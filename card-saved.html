<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>Card Saved — Wilson AC &amp; Appliance</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Roboto", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #eef4ee 0%, #f7f8fc 100%);
      color: #1f2937;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      background: #fff;
      border: 1px solid rgba(33, 105, 44, 0.14);
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
      padding: 36px 30px;
      max-width: 460px;
      width: 100%;
      text-align: center;
    }
    .card img { width: 190px; height: auto; margin-bottom: 18px; }
    .check {
      width: 58px; height: 58px; border-radius: 50%;
      background: #dcfce7; color: #166534;
      display: flex; align-items: center; justify-content: center;
      font-size: 30px; font-weight: 800; margin: 0 auto 16px;
    }
    h1 { margin: 0 0 10px; font-size: 22px; }
    p { margin: 0 0 12px; font-size: 15px; line-height: 1.6; color: #4b5563; }
    .note { font-size: 13px; color: #6b7280; }
  </style>
</head>
<body>
  <div class="card">
    <img src="logo-black.png" alt="Wilson AC &amp; Appliance" />
    <div class="check">✓</div>
    <h1>Your card is securely saved</h1>
    <p>Thank you — your payment method is on file with Wilson AC &amp; Appliance. <strong>Nothing has been charged.</strong></p>
    <p class="note">Your Wilson team member will follow up before any charge is made. Questions? Call us at <a href="tel:512-894-0907" style="color:#21692c; font-weight:700;">512-894-0907</a>.</p>
  </div>
</body>
</html>
