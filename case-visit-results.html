<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>Case Visit Results</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="internal-shell.css" />
  <style>
    :root {
      --bg: #f7f8fc; --card: #ffffff; --text: #1f2937; --muted: #6b7280;
      --border: #dbe1ea; --primary: #635bff; --primary-hover: #564ef0;
      --shadow: 0 10px 35px rgba(0, 0, 0, 0.08); --radius: 18px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #eef2ff 0%, var(--bg) 100%);
      color: var(--text); min-height: 100vh; padding: 32px 16px;
    }
    .wrap { max-width: 1480px; margin: 0 auto; }
    .card {
      background: var(--card); border: 1px solid rgba(99, 91, 255, 0.12);
      box-shadow: var(--shadow); border-radius: var(--radius); padding: 22px;
    }
    .toolbar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; align-items: center; }
    .toolbar-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; justify-content: flex-end; }
    input {
      border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px;
      font-size: 14px; background: #fff; color: var(--text); outline: none; font-family: inherit;
    }
    input:focus { border-color: rgba(99, 91, 255, 0.75); box-shadow: 0 0 0 4px rgba(99, 91, 255, 0.12); }
    button {
      appearance: none; border: 1px solid rgba(99, 91, 255, 0.18); background: #eef2ff;
      color: #3730a3; border-radius: 12px; padding: 12px 16px; font-size: 14px;
      font-weight: 700; cursor: pointer; font-family: inherit;
    }
    button:hover { background: #e0e7ff; }
    .summary-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }
    .metric { border: 1px solid var(--border); border-radius: 16px; padding: 16px; background: #fafbff; }
    .metric-label { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
    .metric-value { font-size: clamp(24px, 3vw, 36px); font-weight: 800; line-height: 1; }
    .metric-sub { margin-top: 8px; color: var(--muted); font-size: 13px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 14px 10px; border-bottom: 1px solid #edf1f7; vertical-align: middle; font-size: 14px; }
    th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
    .empty { color: var(--muted); padding: 18px 0 6px; }
    .face-badge {
      display: inline-flex; align-items: center; gap: 7px;
      border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 800;
    }
    .face-happy { background: #d1fae5; color: #065f46; }
    .face-neutral { background: #fef3c7; color: #92400e; }
    .face-sad { background: #fee2e2; color: #991b1b; }
    .seg-label { font-size: 12.5px; color: var(--muted); }
    @media (max-width: 1100px) { .summary-grid { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 640px) { .summary-grid { grid-template-columns: 1fr; } body { padding: 14px 8px; } .card { padding: 14px; } }
  </style>
</head>
<body data-shell-label="Case Visit Results" data-shell-icon="accounting">
  <div class="wrap">
    <div id="internal-shell-header"></div>
    <div class="card">
      <div class="toolbar">
        <input type="date" id="startDate" />
        <input type="date" id="endDate" />
        <button id="runReportBtn" type="button">Run</button>
      </div>

      <div class="toolbar-actions">
        <button id="exportCsvBtn" type="button">Export visible to CSV</button>
      </div>

      <div class="summary-grid">
        <div class="metric">
          <div class="metric-label">Responses</div>
          <div class="metric-value" id="responseCount">0</div>
          <div class="metric-sub">Survey responses in range</div>
        </div>
        <div class="metric">
          <div class="metric-label">Security Experience</div>
          <div class="metric-value" id="securityValue">—</div>
          <div class="metric-sub" id="securityBreakdown">Great · Okay · Poor</div>
        </div>
        <div class="metric">
          <div class="metric-label">Met or Exceeded</div>
          <div class="metric-value" id="metValue">—</div>
          <div class="metric-sub">Progress as much as expected or more</div>
        </div>
        <div class="metric">
          <div class="metric-label">Most Common Progress</div>
          <div class="metric-value" id="topProgress" style="font-size: clamp(15px, 1.6vw, 20px); line-height: 1.3;">—</div>
          <div class="metric-sub" id="topProgressSub">Most-chosen answer</div>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Security Staff &amp; Process</th>
              <th>Progress With Case Manager</th>
              <th>Recorded By</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="4" class="empty">Loading today's results…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
    <div id="internal-shell-footer"></div>
  </div>

  <script src="internal-shell.js"></script>
  <script>
    const startDateEl = document.getElementById("startDate");
    const endDateEl = document.getElementById("endDate");
    const tableBody = document.getElementById("tableBody");
    let currentRows = [];

    const FACE_META = {
      happy: { label: "Great", cls: "face-happy" },
      neutral: { label: "Okay", cls: "face-neutral" },
      sad: { label: "Poor", cls: "face-sad" }
    };

    function todayKey() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
    }

    function formatDateTime(iso) {
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return "—";
      return d.toLocaleString("en-US", { month: "2-digit", day: "2-digit", year: "2-digit", hour: "numeric", minute: "2-digit" });
    }

    function escapeHtml(value) {
      return String(value == null ? "" : value).replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
      })[ch]);
    }

    function escapeCsv(value) {
      const s = String(value ?? "");
      return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    }

    function render(rows) {
      currentRows = rows;
      document.getElementById("responseCount").textContent = String(rows.length);

      // Each record answers ONE question, so each metric uses its own
      // denominator: security % over face answers, progress % over
      // progress answers.
      const securityRows = rows.filter((r) => r.staffRating);
      const progressRows = rows.filter((r) => r.progress);
      const happy = securityRows.filter((r) => r.staffRating === "happy").length;
      const neutral = securityRows.filter((r) => r.staffRating === "neutral").length;
      const sad = securityRows.filter((r) => r.staffRating === "sad").length;

      if (securityRows.length) {
        const pctHappy = Math.round((happy / securityRows.length) * 100);
        document.getElementById("securityValue").textContent = pctHappy + "% Great";
        document.getElementById("securityBreakdown").textContent =
          `${happy} Great · ${neutral} Okay · ${sad} Poor`;
      } else {
        document.getElementById("securityValue").textContent = "—";
        document.getElementById("securityBreakdown").textContent = "Great · Okay · Poor";
      }

      if (progressRows.length) {
        const met = progressRows.filter((r) =>
          r.progress === "As much as I expected" || r.progress === "More than I expected"
        ).length;
        document.getElementById("metValue").textContent = Math.round((met / progressRows.length) * 100) + "%";
      } else {
        document.getElementById("metValue").textContent = "—";
      }

      const counts = new Map();
      for (const r of rows) {
        if (!r.progress) continue;
        counts.set(r.progress, (counts.get(r.progress) || 0) + 1);
      }
      const top = [...counts.entries()].sort((a, b) => b[1] - a[1])[0];
      document.getElementById("topProgress").textContent = top ? top[0] : "—";
      document.getElementById("topProgressSub").textContent = top
        ? `${top[1]} of ${progressRows.length} progress answer${progressRows.length === 1 ? "" : "s"}`
        : "Most-chosen answer";

      if (!rows.length) {
        tableBody.innerHTML = `<tr><td colspan="4" class="empty">No survey responses in the selected range.</td></tr>`;
        return;
      }

      tableBody.innerHTML = rows.map((r) => {
        const face = r.staffRating ? (FACE_META[r.staffRating] || { label: r.staffRating, cls: "" }) : null;
        return `
          <tr>
            <td>${formatDateTime(r.createdAt)}</td>
            <td>${face ? `<span class="face-badge ${face.cls}">${face.label}</span>` : "—"}</td>
            <td>${escapeHtml(r.progress || "—")}</td>
            <td class="seg-label">${escapeHtml(r.recordedByEmail || "—")}</td>
          </tr>
        `;
      }).join("");
    }

    async function runReport() {
      tableBody.innerHTML = `<tr><td colspan="4" class="empty">Loading survey results…</td></tr>`;
      try {
        const params = new URLSearchParams({ start: startDateEl.value, end: endDateEl.value });
        const res = await fetch(`/api/case-visit/responses?${params.toString()}`, { credentials: "same-origin" });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Unable to load survey results.");
        render(data.responses || []);
      } catch (err) {
        tableBody.innerHTML = `<tr><td colspan="4" class="empty">Error loading results: ${escapeHtml(err.message)}</td></tr>`;
      }
    }

    function downloadCsv(rows) {
      const headers = ["Date", "Security Staff & Process", "Progress With Case Manager", "Recorded By"];
      const lines = [
        headers.join(","),
        ...rows.map((r) => [
          formatDateTime(r.createdAt),
          (FACE_META[r.staffRating] || { label: r.staffRating }).label,
          r.progress || "",
          r.recordedByEmail || ""
        ].map(escapeCsv).join(","))
      ];
      const blob = new Blob([lines.join("\r\n")], { type: "text/csv;charset=utf-8;" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `case-visit-results_${startDateEl.value || "start"}_to_${endDateEl.value || "end"}.csv`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(link.href);
    }

    const today = todayKey();
    startDateEl.value = today;
    endDateEl.value = today;

    document.getElementById("runReportBtn").addEventListener("click", runReport);
    document.getElementById("exportCsvBtn").addEventListener("click", () => downloadCsv(currentRows));

    runReport();
  </script>
</body>
</html>
