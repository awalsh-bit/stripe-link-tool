<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>Wilson AC &amp; Appliance - Clearance Hit List</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="internal-shell.css" />
  <style>
    :root {
      --bg: #f7f8fc;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #dbe1ea;
      --shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Roboto", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, var(--primary-tint) 0%, var(--bg) 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 32px 16px;
    }

    .wrap { max-width: 1480px; margin: 0 auto; }

    .page-intro {
      background: linear-gradient(135deg, var(--primary-ink) 0%, var(--primary-deep) 60%, var(--primary) 100%);
      color: #fff;
      border-radius: var(--radius);
      padding: 22px 26px;
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      flex-wrap: wrap;
      box-shadow: var(--shadow);
    }

    .page-intro-title { font-size: 22px; font-weight: 800; margin: 0 0 4px; letter-spacing: 0.02em; }
    .page-intro-sub { margin: 0; font-size: 14px; color: rgba(255, 255, 255, 0.85); line-height: 1.5; }

    .page-intro-eyebrow {
      display: inline-flex;
      align-items: center;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .page-intro-count { color: rgba(255, 255, 255, 0.78); font-size: 13px; font-weight: 600; }

    .filter-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .search-input {
      flex: 1 1 320px;
      max-width: 460px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 15px;
      background: #fff;
      color: var(--text);
      outline: none;
      font-family: inherit;
    }

    .search-input:focus {
      border-color: rgba(var(--primary-rgb), 0.65);
      box-shadow: 0 0 0 4px rgba(var(--primary-rgb), 0.12);
    }

    .cat-filter { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }

    .cat-chip {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .cat-chip .chip-count { color: var(--muted); font-weight: 500; margin-left: 4px; }
    .cat-chip:hover { background: var(--primary-wash); border-color: rgba(var(--primary-rgb), 0.32); }
    .cat-chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    .cat-chip.active .chip-count { color: rgba(255, 255, 255, 0.75); }

    .card {
      background: var(--card);
      border: 1px solid rgba(var(--primary-rgb), 0.12);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      padding: 22px;
    }

    table { width: 100%; border-collapse: collapse; font-size: 13.5px; }

    th, td {
      text-align: left;
      padding: 9px 10px;
      border-bottom: 1px solid #eef1f6;
      vertical-align: top;
    }

    th {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #64748b;
      white-space: nowrap;
      position: sticky;
      top: 0;
      background: var(--card);
    }

    td.model { font-weight: 700; white-space: nowrap; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
    th.num { text-align: right; }
    td.serial, td.loc { color: var(--muted); font-size: 12.5px; white-space: nowrap; }

    .rule-tag { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 6px; font-size: 10.5px; font-weight: 800; letter-spacing: .02em; background: #f1f5f9; color: #475569; white-space: nowrap; vertical-align: 1px; }
    .rule-tag.open { background: #ecfeff; color: #155e75; }
    .rule-tag.aged { background: #fff7ed; color: #9a3412; }
    .rule-tag.unique { background: #f5f3ff; color: #5b21b6; }
    .needs-price { color: #b91c1c; font-weight: 800; font-size: 12px; }
    .price-src { display: block; color: var(--muted); font-size: 10.5px; font-weight: 600; margin-top: 2px; }
    .cat-pill {
      display: inline-block;
      background: var(--primary-tint);
      color: var(--primary-hover);
      border-radius: 999px;
      padding: 2px 9px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .empty { color: var(--muted); padding: 20px 0 8px; }
    .error-banner {
      display: none;
      background: #fef2f2;
      color: #991b1b;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 16px;
      font-size: 14px;
      font-weight: 600;
    }

    .table-scroll { overflow-x: auto; max-height: 72vh; overflow-y: auto; }

    mark { background: #fef08a; border-radius: 3px; padding: 0 1px; }

    tr.sold-row td { opacity: 0.55; }
    tr.sold-row td.model { text-decoration: line-through; }
    tr.sold-row td.status-cell { opacity: 1; }
    tr.hold-row td { background: #fffdf3; }

    .avail-btn {
      appearance: none;
      border: 1px solid rgba(6, 95, 70, 0.28);
      background: #f0fdf6;
      color: #065f46;
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }

    .avail-btn:hover { background: #dcfce7; }

    .hold-pill {
      display: inline-block;
      background: #fffbeb;
      color: #92400e;
      border: 1px solid rgba(217, 119, 6, 0.28);
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 11.5px;
      font-weight: 800;
      white-space: nowrap;
    }

    .sold-pill {
      display: inline-block;
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid rgba(6, 95, 70, 0.18);
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 11.5px;
      font-weight: 800;
      white-space: nowrap;
    }

    .web-pill {
      display: inline-block;
      background: #eef2ff;
      color: #3730a3;
      border: 1px solid rgba(55, 48, 163, 0.22);
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 11.5px;
      font-weight: 800;
      white-space: nowrap;
    }

    .sold-meta { display: block; color: var(--muted); font-size: 11.5px; margin-top: 3px; white-space: nowrap; }

    /* ePASS says the unit is taken (written to a sales order) or gone from
       on-hand stock - shown even when nobody marked it here. */
    .epass-pill {
      display: inline-block;
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid rgba(153, 27, 27, 0.2);
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 11.5px;
      font-weight: 800;
      white-space: nowrap;
    }
    .live-line { color: var(--muted); font-size: 12px; margin: 6px 0 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .live-dot { width: 8px; height: 8px; border-radius: 999px; background: #16a34a; display: inline-block; }
    .live-dot.stale { background: #dc2626; }
    .live-line button { background: none; border: 0; color: var(--primary, #1d4ed8); font: inherit; font-size: 12px; cursor: pointer; padding: 0; text-decoration: underline; }

    .sold-btn, .reopen-link {
      appearance: none;
      border: none;
      background: var(--primary-tint);
      color: var(--primary);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }

    .sold-btn:hover, .reopen-link:hover { background: var(--primary-tint-2); }
    .reopen-link { background: transparent; color: var(--muted); padding: 3px 6px; font-weight: 600; }

    .sold-editor { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

    .sold-editor input {
      width: 130px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 9px;
      font-size: 12.5px;
      font-family: inherit;
      outline: none;
    }

    .sold-editor input:focus { border-color: rgba(var(--primary-rgb), 0.65); }
    .sold-editor .confirm-sold { background: var(--primary); color: #fff; }
    .sold-editor .confirm-sold:hover { background: var(--primary-hover); }

    .toggle-chip {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }

    .toggle-chip.active { background: #1f2937; border-color: #1f2937; color: #fff; }

    .was-price { display: block; color: var(--muted); font-size: 11px; font-weight: 500; text-decoration: line-through; }
    .margin-line { display: block; color: #475569; font-size: 11px; font-weight: 600; margin-top: 2px; white-space: nowrap; }
    .margin-line.thin { color: #b45309; }
    .margin-line.neg { color: #b91c1c; }

    .price-edit {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--primary);
      cursor: pointer;
      font-size: 11px;
      padding: 1px 4px;
      font-family: inherit;
      opacity: 0.55;
    }

    tr:hover .price-edit { opacity: 1; }

    .price-editor { display: flex; gap: 5px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
    .price-editor input {
      width: 90px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 8px;
      font-size: 12.5px;
      font-family: inherit;
      outline: none;
      text-align: right;
    }
    .price-editor input:focus { border-color: rgba(var(--primary-rgb), 0.65); }

    @media (max-width: 720px) {
      body { padding: 14px 8px; }
      .card { padding: 14px; }
      td.serial { display: none; }
      th.serial { display: none; }
    }
  </style>
</head>
<body data-shell-label="Clearance Hit List" data-shell-icon="sales">
  <div class="wrap">
    <div id="internal-shell-header"></div>

    <div class="page-intro">
      <div>
        <span class="page-intro-eyebrow">Sales Tools</span>
        <h1 class="page-intro-title">Clearance Hit List</h1>
        <p class="page-intro-sub" id="introSub">Every clearance unit on the floor — one row per serial number. Filter by category or search by model and description.</p>
        <p class="live-line" id="liveLine" style="display:none"><span class="live-dot" id="liveDot"></span><span id="liveText"></span><button type="button" id="refreshNow">Refresh now</button></p>
      </div>
      <div class="page-intro-count" id="itemCount">&nbsp;</div>
    </div>

    <div id="errorBanner" class="error-banner"></div>

    <div class="filter-row">
      <input id="searchInput" class="search-input" type="search" placeholder="Search model, description, or brand..." aria-label="Search the clearance list" />
      <button id="hideSoldBtn" type="button" class="toggle-chip">Hide sold</button>
      <button id="marginBtn" type="button" class="toggle-chip" style="display:none" title="Margin at the unique sell price (price minus ePASS cost). Hidden by default - do not show on a customer-facing screen.">Show margin</button>
    </div>
    <div class="cat-filter" id="catFilter"></div>

    <div class="card">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Model</th>
              <th>Brand</th>
              <th>Category</th>
              <th>Description</th>
              <th class="serial">Serial</th>
              <th>Loc</th>
              <th class="num">Price</th>
              <th class="status-cell">Status</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="8" class="empty">Loading the clearance list…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div id="internal-shell-footer"></div>
  </div>

  <script src="internal-shell.js"></script>
  <script>
    let items = [];
    let categories = [];
    let activeCategory = "All";
    let searchTerm = "";
    let hideSold = false;
    let showMargin = false;  // margin at unique sell price - hidden by default (Andrew 10/15)
    let isLive = false;      // list built from ePASS (price = Unique Sell Price, read-only here)
    let editId = null;       // row with an open action UI
    let editMode = null;     // "choose" (hold vs sold) or "sold" (sales-order box)
    let session = null;

    const money = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 2 });

    const catLabel = (key) => (categories.find((c) => c.key === key)?.label) || key;

    function escapeHtml(value) {
      return String(value == null ? "" : value).replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
      })[ch]);
    }

    // Highlight the search term inside already-escaped text.
    function highlight(text) {
      const safe = escapeHtml(text);
      if (!searchTerm) return safe;
      const pattern = searchTerm.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      return safe.replace(new RegExp("(" + pattern + ")", "ig"), "<mark>$1</mark>");
    }

    function effectivePrice(item) {
      if (item.priceOverride && !isLive) return item.priceOverride.price;
      return typeof item.price === "number" ? item.price : null;
    }

    function priceLabel(item) {
      const price = effectivePrice(item);
      if (typeof price === "number") return money.format(price);
      return item.priceText || (item.rule ? "Needs price" : "—");
    }
    const ruleTag = (item) => item.rule ? `<span class="rule-tag ${escapeHtml(item.rule)}" title="${escapeHtml(item.rule === "open" ? "Serial type OPEN in ePASS" : item.rule === "aged" ? "New (ALL) unit received " + (item.received || "") + " - over a year in stock" : "ePASS carries a unique sell price on this serial")}">${escapeHtml(item.ruleLabel || item.rule)}</span>` : "";

    let priceEditId = null;

    function marginHtml(item) {
      if (typeof item.margin !== "number" || typeof item.marginDollars !== "number") {
        return `<span class="margin-line" title="ePASS carries no cost on this serial">margin —</span>`;
      }
      const cls = item.margin < 0 ? " neg" : item.margin < 10 ? " thin" : "";
      return `<span class="margin-line${cls}" title="Margin at the unique sell price: price ${escapeHtml(money.format(effectivePrice(item)))} minus ePASS cost ${escapeHtml(money.format(item.cost))}">${escapeHtml(String(item.margin))}% · ${escapeHtml(money.format(item.marginDollars))}</span>`;
    }

    function priceCellHtml(item) {
      if (priceEditId === item.id) {
        const current = effectivePrice(item);
        return `<div class="price-editor">
          <input type="text" class="price-input" data-id="${escapeHtml(item.id)}" value="${current == null ? "" : current}" />
          <button type="button" class="sold-btn confirm-price" data-id="${escapeHtml(item.id)}">Save</button>` +
          (item.priceOverride ? `<button type="button" class="reopen-link reset-price" data-id="${escapeHtml(item.id)}">reset</button>` : "") +
          `<button type="button" class="reopen-link cancel-price" data-id="${escapeHtml(item.id)}">cancel</button>
        </div>`;
      }
      let html = effectivePrice(item) == null && item.rule
        ? `<span class="needs-price" title="${isLive ? "No Unique Sell Price on this serial - set it in ePASS and it shows here on the next pull" : "No price on the list yet"}">Needs price</span>`
        : escapeHtml(priceLabel(item));
      if (isLive) {
        // Live list: the price IS ePASS's Unique Sell Price - nothing to edit
        // here. Margin at that price (price - ePASS cost) rides under it only
        // when the toolbar toggle is on.
        if (showMargin && effectivePrice(item) != null) html += marginHtml(item);
        return html;
      }
      if (!item.priceOverride && item.priceSource === "workbook" && typeof item.price === "number") html += `<span class="price-src" title="Carried over from the clearance workbook - ePASS has no unique sell price on this serial yet">workbook price</span>`;
      // Show the crossed-out original only on markdowns — a cut sells better
      // with the old price visible; a raise just shows the new price.
      if (item.priceOverride && typeof item.price === "number" && item.priceOverride.price < item.price) {
        html += `<span class="was-price">was ${escapeHtml(money.format(item.price))}</span>`;
      }
      if (session?.canManageUsers) {
        html += ` <button type="button" class="price-edit" data-id="${escapeHtml(item.id)}" title="Edit price (executive)">edit</button>`;
      }
      return html;
    }

    // Treat a hold whose clock ran out as available even before a reload —
    // the server purges it on the next request anyway.
    function liveState(item) {
      const s = item.state;
      if (!s) return null;
      if (s.status === "hold" && s.heldUntil && new Date(s.heldUntil).getTime() < Date.now()) return null;
      return s;
    }

    // ePASS's word on the unit when nobody marked it here: written to a
    // sales order (taken), or no longer in on-hand stock (gone).
    function epassTaken(item) {
      const e = item.epass;
      if (!e) return null;
      if (e.writtenTo) return { kind: "written", invoice: e.writtenTo };
      if (!e.onHand) return { kind: "gone" };
      return null;
    }
    const isTaken = (item) => liveState(item)?.status === "sold" || Boolean(epassTaken(item));

    function matches(item) {
      if (hideSold && isTaken(item)) return false;
      if (activeCategory !== "All" && item.category !== activeCategory) return false;
      if (!searchTerm) return true;
      return [item.model, item.description, item.brand, item.serial, item.ruleLabel || "", effectivePrice(item) == null && item.rule ? "needs price" : ""]
        .join(" ").toLowerCase().includes(searchTerm.toLowerCase());
    }

    function canAct(state) {
      const myEmail = String(session?.user?.email || "").toLowerCase();
      return Boolean(state) && (state.byEmail === myEmail || session?.canManageUsers);
    }

    function formatUntil(iso) {
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return "";
      return d.toLocaleString("en-US", { weekday: "short", hour: "numeric", minute: "2-digit" });
    }

    function soldEditorHtml(id) {
      return `<div class="sold-editor">
        <input type="text" class="so-input" data-id="${escapeHtml(id)}" placeholder="Sales order #" maxlength="60" />
        <button type="button" class="sold-btn confirm-sold" data-id="${escapeHtml(id)}">Confirm sold</button>
        <button type="button" class="reopen-link cancel-edit" data-id="${escapeHtml(id)}">cancel</button>
      </div>`;
    }

    function statusCellHtml(item) {
      const state = liveState(item);

      if (state?.status === "sold") {
        const seller = state.byName || state.byEmail || "";
        return `<span class="sold-pill">SOLD · ${escapeHtml(state.salesOrder || "—")}</span>` +
          `<span class="sold-meta">${escapeHtml(seller)}` +
          (canAct(state) ? ` · <button type="button" class="reopen-link release-line" data-id="${escapeHtml(item.id)}">reopen</button>` : "") +
          `</span>`;
      }

      if (state?.status === "web") {
        return `<span class="web-pill">WEB ORDER · ${escapeHtml(state.salesOrder || "—")}</span>` +
          `<span class="sold-meta">Reserved by the online shop · finish or cancel it in ` +
          `<a href="shop-orders.html">Online Shop Orders</a></span>`;
      }

      if (state?.status === "hold") {
        if (editId === item.id && editMode === "sold") return soldEditorHtml(item.id);
        const holder = state.byName || state.byEmail || "";
        return `<span class="hold-pill">HOLD · until ${escapeHtml(formatUntil(state.heldUntil))}</span>` +
          `<span class="sold-meta">${escapeHtml(holder)}` +
          (canAct(state)
            ? ` · <button type="button" class="reopen-link open-sell" data-id="${escapeHtml(item.id)}">sold</button>` +
              ` · <button type="button" class="reopen-link release-line" data-id="${escapeHtml(item.id)}">release</button>`
            : "") +
          `</span>`;
      }

      const taken = epassTaken(item);
      if (taken && editId !== item.id) {
        if (taken.kind === "written") {
          return `<span class="epass-pill">IN ePASS · ${escapeHtml(taken.invoice)}</span>` +
            `<span class="sold-meta">Written to a sales order in ePASS — not marked here` +
            ` · <button type="button" class="reopen-link open-sell" data-id="${escapeHtml(item.id)}">record sale</button></span>`;
        }
        return `<span class="epass-pill">NOT IN STOCK</span>` +
          `<span class="sold-meta">No longer in ePASS on-hand inventory (sold or transferred)</span>`;
      }

      if (editId === item.id) {
        if (editMode === "sold") return soldEditorHtml(item.id);
        return `<div class="sold-editor">
          <button type="button" class="sold-btn choose-hold" data-id="${escapeHtml(item.id)}">24-hr hold</button>
          <button type="button" class="sold-btn open-sell" data-id="${escapeHtml(item.id)}">Sold</button>
          <button type="button" class="reopen-link cancel-edit" data-id="${escapeHtml(item.id)}">cancel</button>
        </div>`;
      }

      return `<button type="button" class="avail-btn open-status" data-id="${escapeHtml(item.id)}">Available</button>`;
    }

    function renderChips() {
      const host = document.getElementById("catFilter");
      host.textContent = "";
      const counts = {};
      for (const item of items) counts[item.category] = (counts[item.category] || 0) + 1;

      const makeChip = (key, label, count) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "cat-chip" + (key === activeCategory ? " active" : "");
        btn.innerHTML = escapeHtml(label) + '<span class="chip-count">' + count + "</span>";
        btn.addEventListener("click", () => {
          activeCategory = key;
          renderChips();
          renderTable();
        });
        return btn;
      };

      host.appendChild(makeChip("All", "All", items.length));
      for (const cat of categories) {
        if (!counts[cat.key]) continue;
        host.appendChild(makeChip(cat.key, cat.label, counts[cat.key]));
      }
    }

    function renderTable() {
      const body = document.getElementById("tableBody");
      const filtered = items.filter(matches);

      const totalLabel = `${filtered.length === items.length ? items.length : filtered.length + " of " + items.length} unit${items.length === 1 ? "" : "s"}`;
      document.getElementById("itemCount").textContent =
        activeCategory === "All" ? totalLabel : `${totalLabel} · ${catLabel(activeCategory)}`;

      if (!filtered.length) {
        body.innerHTML = '<tr><td colspan="8" class="empty">Nothing matches — try a different search or category.</td></tr>';
        return;
      }

      body.innerHTML = filtered.map((item) => `
        <tr class="${isTaken(item) ? "sold-row" : ["hold", "web"].includes(liveState(item)?.status || "") ? "hold-row" : ""}">
          <td class="model">${highlight(item.model)}</td>
          <td>${highlight(item.brand)}</td>
          <td><span class="cat-pill">${escapeHtml(catLabel(item.category))}</span></td>
          <td>${highlight(item.description)}${ruleTag(item)}</td>
          <td class="serial">${escapeHtml(item.serial)}</td>
          <td class="loc">${escapeHtml(item.location || "—")}</td>
          <td class="num">${priceCellHtml(item)}</td>
          <td class="status-cell">${statusCellHtml(item)}</td>
        </tr>
      `).join("");

      const editor = body.querySelector(".so-input") || body.querySelector(".price-input");
      if (editor) { editor.focus(); if (editor.select) editor.select(); }
    }

    // ---- Sold actions (event delegation — the table re-renders often) ----

    function showError(message) {
      const banner = document.getElementById("errorBanner");
      banner.textContent = message;
      banner.style.display = message ? "block" : "none";
      if (message) setTimeout(() => { banner.style.display = "none"; }, 6000);
    }

    async function postStatus(itemId, action, salesOrder) {
      try {
        const res = await fetch("/api/clearance/status", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ itemId, action, salesOrder: salesOrder || "" })
        });
        const data = await res.json();
        const item = items.find((i) => i.id === itemId);
        if (!res.ok) {
          // 409 = someone beat them to it; show who and reflect it.
          if (res.status === 409 && data.state && item) item.state = data.state;
          throw new Error(data.error || "Unable to update that line.");
        }
        if (item) item.state = data.state;
      } catch (err) {
        showError(err.message);
      } finally {
        editId = null;
        editMode = null;
        renderTable();
      }
    }

    function confirmSold(itemId) {
      const input = document.querySelector(`.so-input[data-id="${CSS.escape(itemId)}"]`);
      const salesOrder = (input?.value || "").trim();
      if (!salesOrder) {
        input?.focus();
        return;
      }
      postStatus(itemId, "sold", salesOrder);
    }

    async function releaseLine(itemId) {
      try {
        const res = await fetch("/api/clearance/release", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ itemId })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Unable to release that line.");
        const item = items.find((i) => i.id === itemId);
        if (item) delete item.state;
        renderTable();
      } catch (err) {
        showError(err.message);
      }
    }

    async function postPrice(itemId, price) {
      try {
        const res = await fetch("/api/clearance/price", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ itemId, price })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Unable to update the price.");
        const item = items.find((i) => i.id === itemId);
        if (item) {
          if (data.priceOverride) item.priceOverride = data.priceOverride;
          else delete item.priceOverride;
        }
      } catch (err) {
        showError(err.message);
      } finally {
        priceEditId = null;
        renderTable();
      }
    }

    document.getElementById("tableBody").addEventListener("click", (event) => {
      const target = event.target;
      const id = target.getAttribute && target.getAttribute("data-id");
      if (!id) return;
      if (target.classList.contains("price-edit")) {
        priceEditId = id;
        renderTable();
        return;
      }
      if (target.classList.contains("cancel-price")) {
        priceEditId = null;
        renderTable();
        return;
      }
      if (target.classList.contains("confirm-price")) {
        const input = document.querySelector(`.price-input[data-id="${CSS.escape(id)}"]`);
        const value = (input?.value || "").trim();
        if (!value) { input?.focus(); return; }
        postPrice(id, value);
        return;
      }
      if (target.classList.contains("reset-price")) {
        postPrice(id, null);
        return;
      }
      if (target.classList.contains("open-status")) {
        editId = id;
        editMode = "choose";
        renderTable();
      } else if (target.classList.contains("open-sell")) {
        editId = id;
        editMode = "sold";
        renderTable();
      } else if (target.classList.contains("choose-hold")) {
        postStatus(id, "hold");
      } else if (target.classList.contains("cancel-edit")) {
        editId = null;
        editMode = null;
        renderTable();
      } else if (target.classList.contains("confirm-sold")) {
        confirmSold(id);
      } else if (target.classList.contains("release-line")) {
        releaseLine(id);
      }
    });

    document.getElementById("tableBody").addEventListener("keydown", (event) => {
      if (event.key === "Enter" && event.target.classList?.contains("so-input")) {
        event.preventDefault();
        confirmSold(event.target.getAttribute("data-id"));
      }
      if (event.key === "Enter" && event.target.classList?.contains("price-input")) {
        event.preventDefault();
        const id = event.target.getAttribute("data-id");
        const value = event.target.value.trim();
        if (value) postPrice(id, value);
      }
    });

    document.getElementById("hideSoldBtn").addEventListener("click", () => {
      hideSold = !hideSold;
      const soldCount = items.filter(isTaken).length;
      const btn = document.getElementById("hideSoldBtn");
      btn.classList.toggle("active", hideSold);
      btn.textContent = hideSold ? `Showing open only (${soldCount} sold hidden)` : "Hide sold";
      renderTable();
    });

    document.getElementById("marginBtn").addEventListener("click", () => {
      showMargin = !showMargin;
      const btn = document.getElementById("marginBtn");
      btn.classList.toggle("active", showMargin);
      btn.textContent = showMargin ? "Hide margin" : "Show margin";
      renderTable();
    });

    document.getElementById("searchInput").addEventListener("input", () => {
      searchTerm = document.getElementById("searchInput").value.trim();
      renderTable();
    });

    // ---- Live list (Andrew 10/8: the list wasn't live and a unit sold twice) ----
    // The list re-reads itself every minute while the tab is visible, and
    // again whenever the tab comes back into view - so a mark made at the
    // other desk, or a sale written in ePASS, shows up without a reload.
    // A refresh never interrupts an open hold / sold / price editor.
    const REFRESH_MS = 60 * 1000;
    let lastLoadedAt = null;
    let loading = false;

    function fmtTime(iso) {
      const d = new Date(iso);
      return Number.isNaN(d.getTime()) ? "" : d.toLocaleString("en-US", { weekday: "short", hour: "numeric", minute: "2-digit" });
    }

    function renderLiveLine(meta) {
      const line = document.getElementById("liveLine");
      const dot = document.getElementById("liveDot");
      const text = document.getElementById("liveText");
      line.style.display = "";
      const e = meta?.epass;
      const taken = items.filter((i) => epassTaken(i)).length;
      if (e?.asOf) {
        dot.classList.toggle("stale", Boolean(e.stale));
        text.textContent = `Live — ePASS stock as of ${fmtTime(e.asOf)}` + (e.stale ? " (stale feed — availability may be off)" : "") +
          (taken ? ` · ${taken} unit${taken === 1 ? "" : "s"} taken in ePASS but not marked here` : "") +
          ` · list refreshed ${fmtTime(lastLoadedAt)}`;
      } else {
        dot.classList.add("stale");
        text.textContent = `No ePASS stock feed yet — availability is marks only · list refreshed ${fmtTime(lastLoadedAt)}`;
      }
    }

    async function loadList({ quiet = false } = {}) {
      if (loading) return;
      loading = true;
      try {
        const res = await fetch("/api/clearance", { credentials: "same-origin", cache: "no-store" });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Unable to load the clearance list.");
        items = data.items || [];
        categories = data._meta?.categories || [];
        lastLoadedAt = new Date().toISOString();
        isLive = Boolean(data._meta?.live);
        document.getElementById("marginBtn").style.display = isLive ? "" : "none";
        if (data._meta?.live) {
          const c = data._meta.counts || {};
          const f = data._meta.feed || null;
          // Why "0 unique-priced" when that's the case: the pull script, or ePASS itself.
          const uniqueNote = f && !(c.unique || 0)
            ? (!f.uniqueColumn
                ? ` The last pull carried no UniqueSellPrice column — the ePASS server is running an older copy of epass-odbc-pull.ps1 (or ePASS rejected the column; the pull log says which).`
                : !f.unitsWithUniquePrice
                  ? ` The feed carries UniqueSellPrice but no unit in stock has one set in ePASS.` + (f.unitsWithTagPrice ? ` (${f.unitsWithTagPrice} units carry a TagPrice instead.)` : "")
                  : ` ${f.unitsWithUniquePrice} units in stock carry a unique sell price, but none are serial type ALL.`)
            : "";
          document.getElementById("introSub").textContent =
            `Built from ePASS on every pull — open-box units, new units over a year in stock, and units with a unique sell price in ePASS. The price shown is the serial's Unique Sell Price in ePASS (edit it there, not here). ` +
            `${c.open || 0} open box · ${c.aged || 0} aged · ${c.unique || 0} unique-priced` + (c.needsPrice ? ` · ${c.needsPrice} need a unique sell price set in ePASS` : "") + `. Search "needs price" to find them.` + uniqueNote;
        } else if (data._meta?.listDate) {
          document.getElementById("introSub").textContent =
            `Every clearance unit on the floor — one row per serial number. Price list updated ${data._meta.listDate}; availability from ePASS. Filter by category or search by model and description.`;
        }
        renderLiveLine(data._meta);
        renderChips();
        renderTable();
        if (hideSold) {
          const btn = document.getElementById("hideSoldBtn");
          btn.textContent = `Showing open only (${items.filter(isTaken).length} sold hidden)`;
        }
      } catch (err) {
        if (quiet) return; // a background refresh that fails just waits for the next tick
        const banner = document.getElementById("errorBanner");
        banner.textContent = err.message;
        banner.style.display = "block";
        document.getElementById("tableBody").innerHTML =
          '<tr><td colspan="8" class="empty">Could not load the clearance list.</td></tr>';
      } finally {
        loading = false;
      }
    }

    const editorOpen = () => editId != null || priceEditId != null;
    function refreshIfIdle() {
      if (document.visibilityState !== "visible" || editorOpen()) return;
      loadList({ quiet: true });
    }
    setInterval(refreshIfIdle, REFRESH_MS);
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refreshIfIdle(); });
    window.addEventListener("focus", refreshIfIdle);
    document.getElementById("refreshNow").addEventListener("click", () => loadList());

    (async function boot() {
      try {
        const sessionRes = await fetch("/api/auth/session", { credentials: "same-origin" });
        if (sessionRes.ok) session = await sessionRes.json();
      } catch {}
      await loadList();
    })();
  </script>
</body>
</html>
