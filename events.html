<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>Wilson AC & Appliance - Events</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/public-shell.css" />
  <style>
    :root { --bg: #f8f8f1; --card: #ffffff; --text: #1f2a1f; --muted: #5d6a5b; --border: #d9dfcf; --primary: #2f6f4f; --primary-hover: #275d42; --primary-soft: rgba(47, 111, 79, 0.12); --accent: #b45309; --accent-soft: rgba(180, 83, 9, 0.1); --shadow: 0 10px 35px rgba(0, 0, 0, 0.08); --radius: 18px; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Roboto", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: radial-gradient(circle at top left, rgba(47, 111, 79, 0.12), transparent 34%), linear-gradient(180deg, #f2f8ea 0%, var(--bg) 100%); color: var(--text); min-height: 100vh; padding: 32px 16px; }
    .wrap { max-width: 1160px; margin: 0 auto; }
    .public-shell-footer { margin-top: 22px; padding: 16px 18px; border-radius: 18px; border: 1px solid rgba(47, 111, 79, 0.12); background: rgba(255, 255, 255, 0.9); box-shadow: var(--shadow); }
    .public-shell-footer-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .public-shell-footer-text { color: var(--muted); font-size: 13px; }
    .public-shell-footer-link { color: var(--accent); text-decoration: none; font-weight: 700; }
    body .public-shell-menu-trigger { border-color: rgba(47, 111, 79, 0.18); box-shadow: 0 8px 24px rgba(47, 111, 79, 0.12); }
    h1 { margin: 0 0 6px; font-family: "Bebas Neue", "Roboto", system-ui, sans-serif; font-size: clamp(44px, 8vw, 72px); line-height: 0.95; font-weight: 400; }
    .lead { margin: 0 0 22px; color: var(--muted); font-size: 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
    .card { background: var(--card); border: 1px solid rgba(47, 111, 79, 0.12); box-shadow: var(--shadow); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; text-decoration: none; color: inherit; transition: transform 0.12s ease; }
    .card:hover { transform: translateY(-2px); }
    .card img { width: 100%; height: 180px; object-fit: cover; display: block; background: #e9efe3; }
    .card .body { padding: 18px 20px 20px; display: grid; gap: 6px; }
    .date { color: var(--accent); font-size: 12.5px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
    .name { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
    .sub { color: var(--primary); font-weight: 700; font-size: 14px; }
    .meta { color: var(--muted); font-size: 14px; }
    .spots { margin-top: 6px; display: inline-block; background: var(--primary-soft); color: var(--primary); border-radius: 999px; padding: 5px 11px; font-size: 12.5px; font-weight: 800; width: fit-content; }
    .spots.full { background: var(--accent-soft); color: var(--accent); }
    .empty { padding: 40px 20px; text-align: center; color: var(--muted); }
    @media (max-width: 560px) { body { padding: 16px 12px; } }
  </style>
</head>
<body data-public-shell-label="Events" data-public-shell-root="/" data-public-shell-footer-text="Wilson AC &amp; Appliance events." data-public-shell-footer-link-label="Request service" data-public-shell-footer-link-href="/applianceservice.html">
  <div class="wrap">
    <div id="public-shell-header"></div>
    <h1>Upcoming events</h1>
    <p class="lead">Classes, showcases and gatherings at Wilson AC &amp; Appliance.</p>
    <div id="list" class="grid"><div class="card empty">Loading…</div></div>
    <div id="public-shell-footer"></div>
  </div>
  <script src="/public-shell.js"></script>
  <script>
    (function () {
      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
      const TZ = "America/Chicago";
      const fmt = (iso) => iso ? new Date(iso).toLocaleDateString("en-US", { timeZone: TZ, weekday: "short", month: "long", day: "numeric" }) + " · " + new Date(iso).toLocaleTimeString("en-US", { timeZone: TZ, hour: "numeric", minute: "2-digit" }) : "Date to be announced";
      fetch("/api/public/events").then((r) => r.json()).then((data) => {
        const events = data.events || [];
        document.getElementById("list").innerHTML = events.length ? events.map((e) => `
          <a class="card" href="/events/${encodeURIComponent(e.slug)}">
            ${e.heroImageUrl ? `<img src="${esc(e.heroImageUrl)}" alt="">` : ""}
            <div class="body">
              <div class="date">${esc(fmt(e.startsAt))}</div>
              <div class="name">${esc(e.name)}</div>
              ${e.subtitle ? `<div class="sub">${esc(e.subtitle)}</div>` : ""}
              ${e.location ? `<div class="meta">${esc(e.location)}</div>` : ""}
              ${e.capacity == null ? "" : e.full ? `<span class="spots full">Full — waitlist open</span>` : e.spotsRemaining <= 5 ? `<span class="spots">${e.spotsRemaining} spot${e.spotsRemaining === 1 ? "" : "s"} left</span>` : ""}
            </div>
          </a>`).join("") : '<div class="card empty">Nothing on the calendar right now — check back soon.</div>';
      }).catch(() => { document.getElementById("list").innerHTML = '<div class="card empty">Events are unavailable right now.</div>'; });
    })();
  </script>
</body>
</html>
