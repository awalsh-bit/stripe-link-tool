<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>Wilson AC & Appliance - Inventory Lookup</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="internal-shell.css" />
  <style>
    :root { --bg: #f7f8fc; --card: #ffffff; --text: #1f2937; --muted: #6b7280; --border: #dbe1ea; --error-bg: #fef2f2; --error-text: #991b1b; --shadow: 0 10px 35px rgba(0, 0, 0, 0.08); --radius: 18px; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Roboto", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: linear-gradient(180deg, var(--primary-tint) 0%, var(--bg) 100%); color: var(--text); min-height: 100vh; padding: 24px 24px 60px; }
    .wrap { max-width: 1520px; margin: 0 auto; }
    .surface { background: var(--card); border: 1px solid rgba(var(--primary-rgb), 0.12); box-shadow: var(--shadow); border-radius: var(--radius); padding: 22px 24px; margin-bottom: 18px; }
    h2 { margin: 0 0 4px; font-size: 20px; }
    .section-note { margin: 0 0 14px; color: var(--muted); font-size: 13.5px; line-height: 1.5; }
    button { appearance: none; border: none; background: var(--primary, #2f6b3a); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
    button:hover { background: var(--primary-hover, #255a2f); }
    button.quiet { background: #fff; color: #374151; border: 1px solid var(--border); }
    select, input[type="text"] { border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px; font-size: 14px; font-family: inherit; background: #fff; }
    .lbl { font-size: 11px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: #64748b; margin-bottom: 4px; display: block; }
    .merch { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px; }
    .merch select { width: 100%; }
    .finds { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px; }
    .find { display: flex; gap: 6px; }
    .find input { flex: 1 1 0; min-width: 0; width: 0; }
    .finds > div, .merch > div { min-width: 0; }
    .find select { flex: 0 0 128px; }
    .opts { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
    .filters { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 18px; align-items: start; margin-top: 12px; }
    .filters-main { min-width: 0; }
    .filters-side { border-left: 1px solid var(--border); padding: 2px 0 0 18px; display: flex; flex-direction: column; gap: 10px; }
    .opt { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 14px; cursor: pointer; user-select: none; }
    .opt input[type="checkbox"]:not(.switch input) { width: 18px; height: 18px; accent-color: var(--primary); }
    .opt.sub { margin-left: 28px; font-weight: 600; font-size: 13.5px; }
    .opt.sub.off { opacity: .4; cursor: default; }
    .switch { position: relative; display: inline-block; width: 40px; height: 22px; flex: 0 0 auto; }
    .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
    .switch .track { position: absolute; inset: 0; border-radius: 999px; background: #cbd5e1; transition: background .15s; }
    .switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: left .15s; }
    .switch input:checked + .track { background: var(--primary); } .switch input:checked + .track::after { left: 21px; }
    .switch input:focus-visible + .track { outline: 2px solid var(--primary); outline-offset: 2px; }
    .sortlbl { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; } .sortlbl select { padding: 7px 10px; }
    .opts label { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; }
    .feed { font-size: 12.5px; color: var(--muted); margin-left: auto; }
    .status { display: none; margin: 10px 0 0; padding: 10px 14px; border-radius: 10px; font-size: 13.5px; }
    .status.show { display: block; }
    .status.error { background: var(--error-bg); color: var(--error-text); }
    .status.ok { background: rgba(var(--primary-rgb, 47, 107, 58), 0.1); color: var(--primary, #2f6b3a); }
    table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    table.t th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b; padding: 8px; border-bottom: 1px solid var(--border); white-space: nowrap; position: sticky; top: 0; background: #fff; }
    table.t td { padding: 8px; border-bottom: 1px solid #eef2f7; vertical-align: top; }
    table.t td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    table.t tr.row { cursor: pointer; }
    table.t tr.row:hover td { background: var(--primary-faint, #f3f8f4); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
    .mut { color: var(--muted); font-size: 12px; }
    .scroll { max-height: 70vh; overflow: auto; border: 1px solid var(--border); border-radius: 12px; }
    .pill { display: inline-block; border-radius: 999px; padding: 2px 8px; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
    .pill.avail { background: #dcfce7; color: #166534; }
    .pill.likely { background: #fef3c7; color: #92400e; }
    .pill.spoken { background: #e5e7eb; color: #374151; }
    .pill.reserved { background: #fee2e2; color: #991b1b; }
    .pill.exclusive { background: #ede9fe; color: #5b21b6; }
    .pill.display { background: #e0f2fe; color: #075985; }
    .ask { margin-top: 6px; } .ask button { font-size: 12px; padding: 5px 10px; border-radius: 8px; border: 1px solid #0ea5e9; background: #f0f9ff; color: #075985; font-weight: 700; cursor: pointer; }
    .ask button:disabled { opacity: .6; cursor: default; } .ask .sent { font-size: 12px; color: #166534; font-weight: 600; } .ask .err { font-size: 12px; color: #991b1b; }
    .ask textarea { display: block; width: 100%; max-width: 420px; margin: 6px 0; font: inherit; font-size: 13px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; }
    .pill.disc { background: #f1f5f9; color: #475569; }
    .num-avail { color: #166534; font-weight: 800; }
    .num-likely { color: #92400e; font-weight: 700; }
    .num-display { color: #075985; font-weight: 700; }
    /* drawer */
    .overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45); display: none; align-items: flex-start; justify-content: center; padding: 24px; overflow: auto; z-index: 50; }
    .overlay.show { display: flex; }
    .drawer { background: #fff; border-radius: 16px; width: min(1480px, 100%); box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3); padding: 20px 22px 26px; }
    .d-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 14px; }
    .d-head h3 { margin: 0; font-size: 20px; }
    .d-sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .tiles { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
    .tile { border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; min-width: 130px; background: #fbfcfe; }
    .tile .v { font-size: 22px; font-weight: 800; }
    .tile .l { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .tile.avail .v { color: #166534; } .tile.likely .v { color: #92400e; }
    .sec { font-size: 11px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: #64748b; margin: 16px 0 6px; }
    tr.u-available td { background: #f0fdf4; } tr.u-likely td { background: #fffbeb; } tr.u-exclusive td { background: #faf5ff; } tr.u-display td { background: #f0f9ff; }
    .note { font-size: 12px; color: #92400e; margin-top: 2px; }
    .months { display: inline-flex; gap: 14px; font-size: 13px; color: var(--muted); }
    .months b { color: var(--text); }
    .copy { cursor: pointer; border-bottom: 1px dashed #94a3b8; }
    .price { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .price.base { font-weight: 800; }
    .chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 800; white-space: nowrap; }
    .chip.ats { background: #dcfce7; color: #166534; }
    .chip.ats0 { background: #f1f5f9; color: #64748b; font-weight: 700; }
    .chip.likely { background: #fef3c7; color: #92400e; }
    .chip.display { background: #e0f2fe; color: #075985; }
    .card .top .chips-r { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; align-items: flex-start; }
    .chip.disc { background: #f1f5f9; color: #475569; font-weight: 700; }
    .chip.close, .pill.close { background: #ffe4e6; color: #9f1239; }
    /* mobile cards (the showroom view) */
    .cards { display: none; }
    .card { border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; background: #fff; cursor: pointer; }
    .card:active { background: var(--primary-faint, #f3f8f4); }
    .card .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .card .model { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 800; font-size: 16px; letter-spacing: 0.01em; }
    .card .brand { font-size: 12px; color: var(--muted); margin-top: 1px; }
    .card .desc { font-size: 14px; color: #334155; margin: 6px 0 8px; line-height: 1.35; }
    .card .bottom { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .card .prices { display: flex; gap: 14px; }
    .card .prices .p { font-size: 18px; font-weight: 800; }
    .card .prices .p small { display: block; font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .info { display: inline-flex; align-items: center; justify-content: center; width: 15px; height: 15px; border-radius: 50%; border: 1px solid currentColor; font-size: 10px; font-weight: 700; margin-left: 5px; cursor: help; text-transform: none; vertical-align: -2px; }
    .tile .sub { font-size: 11px; color: var(--muted); font-weight: 600; }
    .card .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .u-cards { display: none; }
    .u-card { border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
    .u-card .l1 { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
    .u-card .meta { font-size: 12.5px; color: #475569; margin-top: 6px; line-height: 1.5; }
    .u-card .meta b { color: var(--text); font-weight: 600; }
    .banner { background: #fef3c7; color: #92400e; border-radius: 12px; padding: 10px 14px; font-size: 13.5px; margin: 0 0 12px; }
    @media (max-width: 900px) {
      body { padding: 14px 12px 40px; } .surface { padding: 16px; } .merch, .finds { grid-template-columns: 1fr; } .find select { flex-basis: 112px; } .overlay { padding: 8px; }
      .filters { grid-template-columns: 1fr; } .filters-side { border-left: none; border-top: 1px solid var(--border); padding: 12px 0 0; flex-direction: row; flex-wrap: wrap; gap: 10px 18px; }
      /* iOS Safari zooms the page when a field under 16px takes focus, and
         doesn't zoom back (Andrew 10/27). 16px keeps the layout still. */
      select, input[type="text"], .ask textarea { font-size: 16px; }
      .scroll { display: none; } .cards { display: block; }
      .drawer { padding: 14px 14px 20px; } .d-head h3 { font-size: 17px; }
      .tiles { gap: 8px; } .tile { min-width: calc(50% - 4px); flex: 1 1 calc(50% - 4px); padding: 8px 12px; } .tile .v { font-size: 19px; }
      .u-table { display: none; } .u-cards { display: block; }
      .legend { display: none; }
    }
  </style>
</head>
<body data-shell-label="Inventory Lookup" data-shell-icon="sales">
  <div class="wrap">
    <div id="internal-shell-header"></div>
    <div class="surface">
      <h2>Inventory Lookup</h2>
      <div class="filters">
      <div class="filters-main">
      <div class="merch">
        <div><span class="lbl">Merch category</span><select id="cat"><option value="">All categories</option></select></div>
        <div><span class="lbl">Merch class</span><select id="cls"><option value="">All classes</option></select></div>
        <div><span class="lbl">Merch subclass</span><select id="sub"><option value="">All subclasses</option></select></div>
      </div>
      <div class="finds">
        <div><span class="lbl">Model</span><div class="find"><input id="qModel" type="text" placeholder="e.g. CL4850" autocomplete="off" /><select id="mModel"><option value="contains">contains</option><option value="starts">starts with</option><option value="ends">ends with</option></select></div></div>
        <div><span class="lbl">Brand</span><div class="find"><input id="qBrand" type="text" placeholder="e.g. Sub-Zero" autocomplete="off" /><select id="mBrand"><option value="contains">contains</option><option value="starts">starts with</option><option value="ends">ends with</option></select></div></div>
        <div><span class="lbl">Description</span><div class="find"><input id="qDesc" type="text" placeholder="e.g. french door" autocomplete="off" /><select id="mDesc"><option value="contains">contains</option><option value="starts">starts with</option><option value="ends">ends with</option></select></div></div>
      </div>
      <div class="opts">
        <label class="sortlbl">Sort <select id="sort"><option value="">Stocked first</option><option value="price_asc">Price: low → high</option><option value="price_desc">Price: high → low</option></select></label>
        <button id="clearBtn" type="button" class="quiet">Clear</button>
        <span id="feed" class="feed"></span>
      </div>
      </div>
      <div class="filters-side">
        <label class="opt"><input type="checkbox" id="atsOnly" /> ATS Only</label>
        <label class="opt sub off" id="incLikelyRow"><input type="checkbox" id="incLikely" disabled /> Include Likely Available</label>
        <label class="opt sub off" id="incDisplayRow"><input type="checkbox" id="incDisplay" disabled /> Include Displays</label>
        <label class="opt sw"><span class="switch"><input type="checkbox" id="closeout" /><span class="track"></span></span> Closeouts</label>
        <label class="opt sw"><span class="switch"><input type="checkbox" id="displays" /><span class="track"></span></span> Displays</label>
        <input type="checkbox" id="active" checked hidden />
      </div>
      </div>
      <div id="status" class="status"></div>
    </div>

    <div class="surface">
      <div id="banner" class="banner" style="display:none;"></div>
      <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:8px;">
        <div id="count" class="mut"></div>
        <div class="mut legend">Unit colors in the drawer: <span class="pill avail">available</span> <span class="pill likely">likely available</span> <span class="pill spoken">spoken for</span> <span class="pill display">display · ask GM</span> <span class="pill reserved">reserved</span> <span class="pill exclusive">exclusive</span></div>
      </div>
      <div class="scroll">
        <table class="t">
          <thead id="thead"><tr><th>Brand</th><th>Model</th><th>Description</th><th>Class · subclass</th><th class="n">ATS</th><th class="n">L1</th><th class="n">Retail</th><th class="n">UMRP / MAP</th></tr></thead>
          <tbody id="rows"><tr><td colspan="8" class="mut">Loading…</td></tr></tbody>
        </table>
      </div>
      <div id="cards" class="cards"></div>
    </div>
    <div id="internal-shell-footer"></div>
  </div>

  <div class="overlay" id="overlay">
    <div class="drawer" role="dialog" aria-modal="true">
      <div class="d-head">
        <div><h3 id="dTitle"></h3><div class="d-sub" id="dSub"></div></div>
        <button type="button" class="quiet" id="dClose">Close</button>
      </div>
      <div id="dBody"></div>
    </div>
  </div>

  <script src="internal-shell.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const day = (iso) => iso && /^\d{4}-\d{2}-\d{2}/.test(iso) ? new Date(iso.slice(0, 10) + "T12:00:00Z").toLocaleDateString("en-US", { month: "2-digit", day: "2-digit", year: "numeric", timeZone: "UTC" }) : (iso || "—");
    const fmt = (n) => Number(n || 0).toLocaleString("en-US");
    const money = (n) => n == null || !(Number(n) > 0) ? "" : "$" + Number(n).toLocaleString("en-US", { minimumFractionDigits: 0, maximumFractionDigits: 0 });
    const atsChip = (r) => r.atsShown ? `<span class="chip ats">${r.atsShown} ATS</span>` : `<span class="chip ats0">0 ATS</span>`;
    let tree = [];
    let timer = null;

    function setStatus(msg, kind) { const b = $("status"); b.className = "status" + (msg ? " show " + kind : ""); b.textContent = msg || ""; }
    async function api(path, init) { const r = await fetch(path, { credentials: "same-origin", ...(init || {}) }); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || "Request failed."); return j; }

    // ---- cascading merch filters ----
    function fillSelect(sel, items, allLabel, keep) {
      const cur = keep ? sel.value : "";
      sel.innerHTML = `<option value="">${esc(allLabel)}</option>` + items.map((i) => `<option value="${esc(i.label)}">${esc(i.label)}${i.models ? ` (${fmt(i.models)})` : ""}</option>`).join("");
      if (cur && items.some((i) => i.label === cur)) sel.value = cur;
    }
    function cascade(level) {
      const cat = tree.find((c) => c.label === $("cat").value);
      if (level <= 0) fillSelect($("cls"), cat ? cat.classes : tree.flatMap((c) => c.classes), "All classes", level === 0 ? false : true);
      const cls = (cat ? cat.classes : tree.flatMap((c) => c.classes)).find((c) => c.label === $("cls").value);
      fillSelect($("sub"), cls ? cls.subclasses : (cat ? cat.classes : tree.flatMap((c) => c.classes)).flatMap((c) => c.subclasses), "All subclasses", level >= 2);
    }

    async function loadOptions() {
      try {
        const o = await api("/api/inventory-lookup/options");
        tree = o.tree || [];
        fillSelect($("cat"), tree, "All categories", false);
        cascade(-1);
        const at = o.snapshotAt ? new Date(o.snapshotAt).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "—";
        $("feed").textContent = `${fmt(o.totals.units)} units on hand across ${fmt(o.totals.stocked)} models · ePASS feed ${at}`;
        if (!o.hierarchyLoaded) {
          $("banner").style.display = "";
          $("banner").textContent = o.netsuiteModels
            ? "The NetSuite items on file have no merchandise hierarchy yet — upload the current NetSuite items export (the one with Merch Category / Class / Subclass columns) on the Ordering Report, step 2 “NetSuite items & suppliers”, and these three filters will fill in."
            : "No NetSuite items have been imported yet — upload the NetSuite items export on the Ordering Report, step 2 “NetSuite items & suppliers”, to get the category / class / subclass filters and base prices.";
        } else { $("banner").style.display = "none"; }
        search();
      } catch (err) { setStatus(err.message, "error"); }
    }

    // ---- search ----
    function params() {
      return {
        category: $("cat").value, cls: $("cls").value, subclass: $("sub").value,
        model: $("qModel").value.trim(), modelMode: $("mModel").value,
        brand: $("qBrand").value.trim(), brandMode: $("mBrand").value,
        description: $("qDesc").value.trim(), descMode: $("mDesc").value,
        ats: $("atsOnly").checked ? "1" : "0", includeLikely: $("atsOnly").checked && $("incLikely").checked ? "1" : "0", includeDisplay: $("atsOnly").checked && $("incDisplay").checked ? "1" : "0", closeout: $("closeout").checked ? "1" : "0", displays: $("displays").checked ? "1" : "0", active: "1", sort: $("sort").value, limit: "400"
      };
    }
    async function search() {
      const p = params();
      const hasFilter = p.category || p.cls || p.subclass || p.model || p.brand || p.description || p.ats === "1" || p.closeout === "1" || p.displays === "1";
      try {
        const d = await api("/api/inventory-lookup?" + new URLSearchParams(p));
        setStatus("", "");
        $("count").textContent = `${fmt(d.total)} model${d.total === 1 ? "" : "s"}${d.total > d.shown ? ` — showing the first ${fmt(d.shown)}, narrow the search to see the rest` : ""}${p.sort ? (p.sort === "price_asc" ? " · price low → high (L1, else UMRP/MAP)" : " · price high → low (L1, else UMRP/MAP)") : hasFilter ? "" : " · stocked models first"}`;
        const empty = `No models match. Try "contains" instead of "starts with".`;
        // Extra columns appear with the Include boxes (Andrew 10/30): Likely
        // (amber) and Display (blue), the same colors the drawer uses.
        const showLikely = p.includeLikely === "1", showDisplay = p.includeDisplay === "1";
        const cols = 8 + (showLikely ? 1 : 0) + (showDisplay ? 1 : 0);
        $("thead").innerHTML = `<tr><th>Brand</th><th>Model</th><th>Description</th><th>Class · subclass</th><th class="n">ATS</th>${showLikely ? `<th class="n">Likely</th>` : ""}${showDisplay ? `<th class="n">Display</th>` : ""}<th class="n">L1</th><th class="n">Retail</th><th class="n">UMRP / MAP</th></tr>`;
        $("rows").innerHTML = d.rows.map((r) => `<tr class="row" data-model="${esc(r.model)}">
            <td>${esc(r.brand || "—")}</td>
            <td class="mono"><b>${esc(r.displayName || r.model)}</b>${r.displayName ? `<div class="mut" style="font-size:11px;">${esc(r.model)}</div>` : ""}${r.discontinued ? ` <span class="pill disc">discontinued</span>` : ""}${r.source !== "netsuite" ? ` <span class="mut" title="Not in NetSuite yet — described from ePASS">ePASS</span>` : ""}</td>
            <td>${esc(r.description)}</td>
            <td>${r.cls ? esc(r.cls) + `<div class="mut">${esc(r.subclass || "")}</div>` : `<span class="mut">${esc(r.prod || "—")}</span>`}</td>
            <td class="n">${r.atsShown ? `<span class="num-avail">${r.atsShown}</span>${r.atsShown !== r.ats ? `<div class="mut" style="font-size:10px;">${r.ats} strict</div>` : ""}` : "<span class=mut>0</span>"}</td>
            ${showLikely ? `<td class="n">${r.likely ? `<span class="num-likely">${r.likely}</span>` : "<span class=mut>—</span>"}</td>` : ""}
            ${showDisplay ? `<td class="n">${r.display ? `<span class="num-display">${r.display}</span>` : "<span class=mut>—</span>"}</td>` : ""}
            <td class="n price">${money(r.l1) || "<span class=mut>—</span>"}</td>
            <td class="n price">${money(r.retail) || "<span class=mut>—</span>"}</td>
            <td class="n price">${money(r.umrp) ? `${money(r.umrp)}<div class="mut" style="font-size:10px;">${esc(r.umrpCode)}</div>` : "<span class=mut>—</span>"}</td>
          </tr>`).join("") || `<tr><td colspan="${cols}" class="mut">${empty}</td></tr>`;
        for (const tr of $("rows").querySelectorAll("tr.row")) tr.addEventListener("click", () => openModel(tr.dataset.model));
        // Showroom cards (phone): model, short description, L1 / Retail, ATS.
        $("cards").innerHTML = d.rows.map((r) => `<div class="card" data-model="${esc(r.model)}">
            <div class="top"><div><div class="model">${esc(r.displayName || r.model)}${r.displayName ? ` <span class="mut" style="font-size:11px;font-weight:500;">${esc(r.model)}</span>` : ""}</div><div class="brand">${esc(r.brand || "")}${r.cls ? " · " + esc(r.subclass || r.cls) : ""}</div></div><div class="chips-r">${atsChip(r)}${showLikely ? `<span class="chip ${r.likely ? "likely" : "ats0"}" title="Likely available — written to an order more than 60 days out">${r.likely ? "+" + r.likely : "0"} likely</span>` : ""}${showDisplay ? `<span class="chip ${r.display ? "display" : "ats0"}" title="Display units — ask the GM to sell">${r.display ? "+" + r.display : "0"} display</span>` : ""}</div></div>
            <div class="desc">${esc(r.description || "—")}</div>
            <div class="bottom"><div class="prices"><div class="p">${money(r.l1) || "<span class=mut>—</span>"}<small>L1</small></div><div class="p">${money(r.retail) || "<span class=mut>—</span>"}<small>Retail</small></div>${money(r.umrp) ? `<div class="p">${money(r.umrp)}<small>${esc(r.umrpCode)}</small></div>` : ""}</div>
              <div class="chips">${r.discontinued ? `<span class="chip disc">discontinued</span>` : ""}</div></div>
          </div>`).join("") || `<div class="mut">${empty}</div>`;
        for (const c of $("cards").querySelectorAll(".card")) c.addEventListener("click", () => openModel(c.dataset.model));
      } catch (err) { setStatus(err.message, "error"); }
    }
    const debounced = () => { clearTimeout(timer); timer = setTimeout(search, 220); };
    $("cat").addEventListener("change", () => { cascade(0); search(); });
    $("cls").addEventListener("change", () => { cascade(1); search(); });
    $("sub").addEventListener("change", search);
    for (const id of ["qModel", "qBrand", "qDesc"]) { $(id).addEventListener("input", debounced); $(id).addEventListener("keydown", (e) => { if (e.key === "Enter") { clearTimeout(timer); search(); } }); }
    // Include Likely / Include Displays are sub-options of ATS Only (Andrew
    // 10/30): greyed and cleared unless ATS Only is on.
    function syncSubs() {
      const on = $("atsOnly").checked;
      for (const id of ["incLikely", "incDisplay"]) { $(id).disabled = !on; if (!on) $(id).checked = false; $(id + "Row").classList.toggle("off", !on); }
    }
    $("atsOnly").addEventListener("change", syncSubs);
    for (const id of ["mModel", "mBrand", "mDesc", "atsOnly", "incLikely", "incDisplay", "closeout", "displays", "sort"]) $(id).addEventListener("change", search);
    $("clearBtn").addEventListener("click", () => { for (const id of ["qModel", "qBrand", "qDesc"]) $(id).value = ""; for (const id of ["mModel", "mBrand", "mDesc"]) $(id).value = "contains"; $("cat").value = ""; cascade(0); $("cls").value = ""; cascade(1); $("sub").value = ""; $("atsOnly").checked = false; $("incLikely").checked = false; $("incDisplay").checked = false; syncSubs(); $("closeout").checked = false; $("displays").checked = false; $("sort").value = ""; search(); });

    // "Ask the GM to sell" on a free display unit: one click, optional note,
    // the GM (E80) gets a dashboard flag + email with the requester's name.
    const askHtml = (p, u) => (u.status === "display" || u.status === "exclusive")
      ? `<div class="ask" data-serial="${esc(u.serial)}"><button type="button" class="ask-btn">Ask the GM to sell</button></div>` : "";
    function wireAsk(p) {
      for (const box of $("dBody").querySelectorAll(".ask")) {
        const btn = box.querySelector(".ask-btn"); if (!btn) continue;
        btn.addEventListener("click", async (e) => {
          e.stopPropagation();
          let ta = box.querySelector("textarea");
          if (!ta) {
            ta = document.createElement("textarea"); ta.rows = 2; ta.placeholder = "Optional: customer name, price you need, when it would leave the floor";
            box.insertBefore(ta, btn); btn.textContent = "Send request to the GM"; ta.focus(); return;
          }
          btn.disabled = true; btn.textContent = "Sending…";
          try {
            const r = await api("/api/inventory-lookup/display-request", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ model: p.model, serial: box.dataset.serial, note: ta.value.trim() }) });
            box.innerHTML = `<span class="sent">Request sent to ${esc(r.approver?.name || r.approver?.code || "the GM")}${r.emailed ? " (email + dashboard flag)" : " (dashboard flag)"} — they'll come back to you.</span>`;
          } catch (err) { btn.disabled = false; btn.textContent = "Send request to the GM"; let er = box.querySelector(".err"); if (!er) { er = document.createElement("div"); er.className = "err"; box.appendChild(er); } er.textContent = err.message; }
        });
      }
    }

    // ---- drawer ----
    async function openModel(model) {
      $("overlay").classList.add("show"); $("overlay").scrollTop = 0;
      $("dTitle").textContent = model; $("dSub").textContent = ""; $("dBody").innerHTML = `<div class="mut">Loading…</div>`;
      try {
        const p = await api("/api/inventory-lookup/model/" + encodeURIComponent(model));
        $("dTitle").innerHTML = `<span class="copy" title="Click to copy">${esc(p.displayName || p.model)}</span>${p.displayName ? ` <span class="mut" style="font-size:14px;font-weight:500;">${esc(p.model)}</span>` : ""}${p.description ? " — " + esc(p.description) : ""}`;
        $("dTitle").querySelector(".copy").addEventListener("click", () => { navigator.clipboard?.writeText(p.displayName || p.model).catch(() => {}); });
        $("dSub").textContent = [p.brand, p.supplier, [p.category, p.cls, p.subclass].filter(Boolean).join(" › ") || (p.prod ? "ePASS " + p.prod : "")].filter(Boolean).join(" · ") + (p.discontinued ? " · discontinued" : "") + (p.source !== "netsuite" ? " · not in NetSuite yet" : "");
        const c = p.counts, pr = p.prices || {};
        const priceTiles = `<div class="tiles">
            <div class="tile"><div class="v">${money(pr.l1) || "—"}</div><div class="l">L1</div></div>
            <div class="tile"><div class="v">${money(pr.l2) || "—"}</div><div class="l">L2</div></div>
            <div class="tile"><div class="v">${money(pr.retail) || "—"}</div><div class="l">Retail</div></div>
            ${money(pr.umrp) ? `<div class="tile"><div class="v">${money(pr.umrp)}</div><div class="l">${esc(pr.umrpCode)}</div></div>` : ""}
          </div>`;
        const tiles = priceTiles + `<div class="tiles">
            <div class="tile avail"><div class="v">${c.ats}</div><div class="l">Available to sell<span class="info" title="Units of serial type ALL that are not written to an order, not reserved and not on hold — what can be promised today. Display / open-box units that are free show as +N below and in the list, but aren't counted.">i</span></div>${c.available > c.ats ? `<div class="sub">+${c.available - c.ats} open box, also free</div>` : ""}</div>
            ${c.display ? `<div class="tile"><div class="v" style="color:#075985;">${c.display}</div><div class="l">Display<span class="info" title="A free display unit. It isn't the salesperson's to promise — use “Ask the GM to sell” on the unit and the GM gets a dashboard flag and an email.">i</span></div></div>` : ""}
            ${c.closeout ? `<div class="tile"><div class="v" style="color:#9f1239;">${c.closeout}</div><div class="l">Closeout</div></div>` : ""}
            <div class="tile"><div class="v">${c.onHand}</div><div class="l">On hand</div></div>
            <div class="tile likely"><div class="v">${c.likely}</div><div class="l">Likely available<span class="info" title="Written to an order whose delivery or pickup is more than ${p.likelyDays} days out. Check with the salesperson on the order before promising it.">i</span></div></div>
            <div class="tile"><div class="v">${c.spoken}</div><div class="l">Spoken for</div></div>
            <div class="tile"><div class="v">${c.reserved}${c.exclusive ? `<span class="mut" style="font-size:13px;"> +${c.exclusive} excl</span>` : ""}</div><div class="l">Reserved</div></div>
            ${p.sold12 != null ? `<div class="tile"><div class="v">${p.written12 != null ? `${fmt(p.written12)} <span class="mut" style="font-size:12px;font-weight:600;">written</span> · ` : ""}${fmt(p.sold12)} <span class="mut" style="font-size:12px;font-weight:600;">delivered</span></div><div class="l">Last 12 months<span class="info" title="${esc(day(p.soldWindow?.from))} – ${esc(day(p.soldWindow?.to))}, the same definitions as Brand Sales. Written = units on tickets started in the window (delivered or still open). Delivered = units on invoices finished in the window. Returns excluded. ${p.soldSource === "epass" ? "Live from the ePASS feed." : "From the OE-23 warehouse."} Units only — no dollars on this screen.">i</span></div></div>` : ""}
          </div>`;
        const unitCards = `<div class="u-cards">${p.units.map((u) => `<div class="u-card u-${u.status}">
            <div class="l1"><span><span class="pill ${u.status === "available" ? "avail" : u.status}">${esc(u.statusLabel)}</span>${u.closeout ? ` <span class="pill close">closeout · ${esc(u.closeout)}${u.uniquePrice ? " · " + money(u.uniquePrice) : ""}</span>` : ""}</span><span class="mono">${esc(u.serial)}</span></div>
            ${u.note ? `<div class="note">${esc(u.note)}</div>` : ""}
            ${askHtml(p, u)}
            <div class="meta">${u.writtenTo ? `<b>${esc(u.writtenTo)}</b> · ${esc(u.customer || "—")}${u.salesperson ? " · " + esc(u.salesperson) : ""}${u.scheduleDate || u.pickupDate ? " · " + (u.scheduleDate ? day(u.scheduleDate) : day(u.pickupDate) + " pickup") : ""}<br>` : ""}${esc(u.serialType)} · received ${day(u.received)}${u.ageDays == null ? "" : ` (${u.ageDays} d)`}${u.location || u.bin ? ` · ${esc([u.location, u.bin].filter(Boolean).join(" / "))}` : ""}${u.reservedOn ? ` · reserved ${day(u.reservedOn)}` : ""}</div>
          </div>`).join("")}</div>`;
        const units = p.units.length ? `<div class="sec">Inventory on hand <span class="mut" style="text-transform:none; letter-spacing:0; font-weight:500;">(ePASS feed)</span></div>` + unitCards + `
          <table class="t u-table"><thead><tr><th>Status</th><th>Order</th><th>Customer</th><th>Schedule / pickup</th><th>Job status</th><th>Received</th><th>Age</th><th>Loc / bin</th><th>Serial type</th><th>Serial #</th></tr></thead>
          <tbody>${p.units.map((u) => `<tr class="u-${u.status}">
              <td><span class="pill ${u.status === "available" ? "avail" : u.status}">${esc(u.statusLabel)}</span>${u.closeout ? ` <span class="pill close" title="Qualifies for the Clearance Hit List">closeout · ${esc(u.closeout)}${u.uniquePrice ? " · " + money(u.uniquePrice) : ""}</span>` : ""}${u.note ? `<div class="note">${esc(u.note)}</div>` : ""}${u.reservedOn ? `<div class="mut">since ${day(u.reservedOn)}</div>` : ""}${askHtml(p, u)}</td>
              <td class="mono">${esc(u.writtenTo || "—")}</td>
              <td>${esc(u.customer || "—")}${u.salesperson ? `<div class="mut">${esc(u.salesperson)}</div>` : ""}</td>
              <td>${u.scheduleDate ? day(u.scheduleDate) : u.pickupDate ? day(u.pickupDate) + ` <span class="mut">pickup</span>` : "—"}</td>
              <td>${esc(u.jobStatus || "—")}</td>
              <td>${day(u.received)}</td>
              <td>${u.ageDays == null ? "—" : u.ageDays + " d"}</td>
              <td class="mut">${esc([u.location, u.bin].filter(Boolean).join(" / ") || "—")}</td>
              <td>${esc(u.serialType)}</td>
              <td class="mono">${esc(u.serial)}</td>
            </tr>`).join("")}</tbody></table>` : `<div class="sec">Inventory on hand</div><div class="mut">Nothing on hand for this model.</div>`;
        const foot = `<div class="mut" style="margin-top:12px;">Snapshot: ${esc(p.snapshotSource || "ePASS feed")}${p.snapshotAt ? " · " + esc(new Date(p.snapshotAt).toLocaleString("en-US", { month: "numeric", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" })) : ""}.</div>`;
        $("dBody").innerHTML = tiles + units + foot;
        wireAsk(p);
        // [i] on a tile: hover shows the title; a tap (phones) toggles it under the tile.
        for (const el of $("dBody").querySelectorAll(".info")) el.addEventListener("click", (e) => {
          e.stopPropagation();
          const tile = el.closest(".tile"); const open = tile.querySelector(".info-note");
          if (open) open.remove(); else { const n = document.createElement("div"); n.className = "note info-note"; n.textContent = el.title; tile.appendChild(n); }
        });
      } catch (err) { $("dBody").innerHTML = `<div class="status show error">${esc(err.message)}</div>`; }
    }
    $("dClose").addEventListener("click", () => $("overlay").classList.remove("show"));
    $("overlay").addEventListener("click", (e) => { if (e.target === $("overlay")) $("overlay").classList.remove("show"); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("overlay").classList.remove("show"); });

    loadOptions();
  </script>
</body>
</html>
