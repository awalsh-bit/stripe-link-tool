             creates the enrollment this quote was priced from, so it is one
             button that does the thing rather than a status somebody sets and
             then re-enters the household by hand. -->
        <div class="inline-actions"><button class="button ghost" data-quote-status="Draft" type="button">Mark draft</button><button class="button secondary" data-quote-status="Sent" type="button">Mark sent</button><button class="button" id="accept-quote" type="button">Accept &amp; enroll</button><button class="button secondary" id="print-quote" type="button">Print / Save PDF</button></div>
