<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>Your Project — Wilson AC &amp; Appliance</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    :root { --green: #21692c; --text: #1f2937; --muted: #6b7280; --border: #dbe1ea; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Roboto", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: linear-gradient(180deg, #eef5ee 0%, #f7f8fc 100%); color: var(--text); min-height: 100vh; padding: 26px 16px 50px; }
    .wrap { max-width: 560px; margin: 0 auto; }
    .brand { text-align: center; margin-bottom: 18px; } .brand img { height: 46px; } .brand .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .card { background: #fff; border-radius: 18px; box-shadow: 0 14px 45px rgba(0,0,0,0.1); padding: 26px 24px; margin-bottom: 16px; }
    h1 { font-size: 21px; margin: 0 0 8px; } h2 { font-size: 15px; margin: 18px 0 8px; }
    .lead { color: var(--muted); font-size: 14px; line-height: 1.55; margin: 0 0 14px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; } td { padding: 8px 4px; border-bottom: 1px dashed #eef1f6; vertical-align: top; } tr:last-child td { border-bottom: none; }
    .model { color: var(--muted); font-size: 11.5px; } .qty { text-align: right; white-space: nowrap; color: var(--muted); }
    .fact { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px dashed #eef1f6; font-size: 14px; } .fact b { text-align: right; }
    label.chk { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px dashed #eef1f6; font-size: 14px; line-height: 1.4; cursor: pointer; } label.chk input { margin-top: 3px; width: 18px; height: 18px; }
    .field { margin: 10px 0; } .field span { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
    input[type="text"], input[type="tel"], input[type="date"], textarea { width: 100%; border: 1.5px solid var(--border); border-radius: 12px; padding: 11px 12px; font-size: 16px; font-family: inherit; }
    button { width: 100%; border: none; border-radius: 12px; padding: 13px 16px; font-size: 15px; font-weight: 700; background: var(--green); color: #fff; cursor: pointer; font-family: inherit; margin-top: 12px; } button:disabled { opacity: .6; }
    .msg { margin-top: 10px; font-size: 13.5px; color: var(--muted); } .msg.ok { color: #166534; font-weight: 700; } .msg.err { color: #991b1b; }
    .pm { background: #eef5ee; border-radius: 12px; padding: 12px 14px; font-size: 14px; } .pm a { color: var(--green); font-weight: 700; text-decoration: none; }
    .foot { text-align: center; color: var(--muted); font-size: 12px; margin-top: 18px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><img src="logo-black.png" alt="Wilson AC &amp; Appliance" /><div class="sub">Dripping Springs · 512-894-0907</div></div>
    <div class="card" id="main"><h1>Loading your project…</h1></div>
    <div class="foot">Wilson AC &amp; Appliance · 4205 E Hwy 290, Dripping Springs, TX 78620</div>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    const day = (iso) => iso && /^\d{4}-\d{2}-\d{2}/.test(iso) ? new Date(iso.slice(0, 10) + "T12:00:00Z").toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", timeZone: "UTC" }) : "";
    const token = new URLSearchParams(location.search).get("t") || "";
    let data = null;
    function render() {
      const d = data, r = d.readiness || {};
      $("main").innerHTML = `
        <h1>Appliances for ${esc(d.customerName)}</h1>
        <p class="lead">${esc(d.siteAddress || "")}${d.neededBy ? `<br>Planned for <b>${esc(day(d.neededBy))}</b>.` : ""} Before our truck rolls, we want to be sure the site is ready — it saves everyone a second trip.</p>
        <div class="pm">Your Wilson project manager is <b>${esc(d.pm.name)}</b>${d.pm.phone ? ` · <a href="tel:${esc(d.pm.phone.replace(/[^0-9+]/g, ""))}">${esc(d.pm.phone)}</a>` : ""}${d.pm.email ? ` · <a href="mailto:${esc(d.pm.email)}">email</a>` : ""}</div>
        <h2>What's coming</h2>
        <table>${d.models.map((m) => `<tr><td>${esc(m.description || m.model)}<div class="model">${esc(m.model)}</div></td><td class="qty">× ${m.qty}</td></tr>`).join("")}</table>
        <h2>Site readiness — tick what's done</h2>
        ${d.readinessItems.map((it) => `<label class="chk"><input type="checkbox" data-k="${esc(it.key)}" ${r[it.key] ? "checked" : ""} /><span>${esc(it.label)}</span></label>`).join("")}
        <div class="field"><span>When would you like delivery? (optional)</span><input type="date" id="reqDate" value="${esc(r.requestedDate || "")}" /></div>
        <div class="field"><span>Anything we should know? (gate codes, parking, what's not ready yet)</span><textarea id="notes" rows="3">${esc(r.notes || "")}</textarea></div>
        <div class="field"><span>Your name</span><input type="text" id="cName" value="${esc(d.siteContactName || "")}" autocomplete="name" /></div>
        <div class="field"><span>Best mobile number</span><input type="tel" id="cPhone" value="${esc(d.siteContactPhone || "")}" autocomplete="tel" /></div>
        <button id="send">Send to Wilson</button>
        <div class="msg" id="msg">${r.submittedAt ? `Last updated ${new Date(r.submittedAt).toLocaleDateString("en-US")}. You can update this any time.` : ""}</div>`;
      $("send").addEventListener("click", async () => {
        const checklist = {}; for (const cb of document.querySelectorAll("input[data-k]")) checklist[cb.dataset.k] = cb.checked;
        $("send").disabled = true; $("msg").className = "msg"; $("msg").textContent = "Sending…";
        try {
          const res = await fetch("/api/project/readiness", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token, checklist, notes: $("notes").value, requestedDate: $("reqDate").value, contactName: $("cName").value, contactPhone: $("cPhone").value }) });
          const out = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(out.error || "Something went wrong — please call us.");
          $("msg").className = "msg ok"; $("msg").textContent = `Thank you — ${data.pm.name} has it and will be in touch.`;
        } catch (err) { $("msg").className = "msg err"; $("msg").textContent = err.message; }
        finally { $("send").disabled = false; }
      });
    }
    (async () => {
      try {
        const res = await fetch(`/api/project/view?t=${encodeURIComponent(token)}`);
        data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || "This link isn't valid.");
        render();
      } catch (err) { $("main").innerHTML = `<h1>Hmm — we can't find that project.</h1><p class="lead">${esc(err.message)}</p>`; }
    })();
  </script>
</body>
</html>
