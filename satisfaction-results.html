<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>Wilson AC & Appliance - Satisfaction Results</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="internal-shell.css" />
  <style>
    :root {
      --bg: #f7f8fc; --card: #ffffff; --text: #1f2937; --muted: #6b7280;
      --border: #dbe1ea; --primary: var(--primary); --primary-hover: var(--primary-hover);
      --shadow: 0 10px 35px rgba(0, 0, 0, 0.08); --radius: 18px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, var(--primary-tint) 0%, var(--bg) 100%);
      color: var(--text); min-height: 100vh; padding: 32px 16px;
    }
    .wrap { max-width: 1480px; margin: 0 auto; }
    .card {
      background: var(--card); border: 1px solid rgba(var(--primary-rgb), 0.12);
      box-shadow: var(--shadow); border-radius: var(--radius); padding: 22px;
    }
    .toolbar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; align-items: center; }
    .toolbar-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; justify-content: flex-end; }
    input {
      border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px;
      font-size: 14px; background: #fff; color: var(--text); outline: none; font-family: inherit;
    }
    input:focus { border-color: rgba(var(--primary-rgb), 0.75); box-shadow: 0 0 0 4px rgba(var(--primary-rgb), 0.12); }
    button {
      appearance: none; border: 1px solid rgba(var(--primary-rgb), 0.18); background: var(--primary-tint);
      color: var(--primary-hover); border-radius: 12px; padding: 12px 16px; font-size: 14px;
      font-weight: 700; cursor: pointer; font-family: inherit;
    }
    button:hover { background: var(--primary-tint-2); }
    .summary-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }
    .metric { border: 1px solid var(--border); border-radius: 16px; padding: 16px; background: var(--primary-faint); }
    .metric-label { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
    .metric-value { font-size: clamp(24px, 3vw, 36px); font-weight: 800; line-height: 1; }
    .metric-sub { margin-top: 8px; color: var(--muted); font-size: 13px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 14px 10px; border-bottom: 1px solid #edf1f7; vertical-align: middle; font-size: 14px; }
    th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
    .empty { color: var(--muted); padding: 18px 0 6px; }
    .score-badge {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 40px; border-radius: 999px; padding: 6px 10px;
      font-size: 13px; font-weight: 800;
    }
    .score-low { background: #fee2e2; color: #991b1b; }
    .score-mid { background: #fef3c7; color: #92400e; }
    .score-high { background: #d1fae5; color: #065f46; }
    .seg-label { font-size: 12.5px; color: var(--muted); }
    @media (max-width: 1100px) { .summary-grid { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 640px) { .summary-grid { grid-template-columns: 1fr; } body { padding: 14px 8px; } .card { padding: 14px; } }
  </style>
</head>
<body data-shell-label="Satisfaction Results" data-shell-icon="accounting">
  <div class="wrap">
    <div id="internal-shell-header"></div>
    <div class="card">
      <div class="toolbar">
        <input type="date" id="startDate" />
        <input type="date" id="endDate" />
        <button id="runReportBtn" type="button">Run</button>
      </div>

      <div class="toolbar-actions">
        <button id="exportCsvBtn" type="button">Export visible to CSV</button>
      </div>

      <div class="summary-grid">
        <div class="metric">
          <div class="metric-label">Responses</div>
          <div class="metric-value" id="responseCount">0</div>
          <div class="metric-sub">Survey responses in range</div>
        </div>
        <div class="metric">
          <div class="metric-label">NPS</div>
          <div class="metric-value" id="npsValue">—</div>
          <div class="metric-sub" id="npsBreakdown">% promoters (9–10) − % detractors (1–6)</div>
        </div>
        <div class="metric">
          <div class="metric-label">Average Score</div>
          <div class="metric-value" id="avgScore">—</div>
          <div class="metric-sub">Mean of all 1–10 answers</div>
        </div>
        <div class="metric">
          <div class="metric-label">Top Priority</div>
          <div class="metric-value" id="topPriority" style="font-size: clamp(15px, 1.6vw, 20px); line-height: 1.3;">—</div>
          <div class="metric-sub" id="topPrioritySub">Most-chosen experience aspect</div>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Score</th>
              <th>Segment</th>
              <th>Most Important Aspect</th>
              <th>Recorded By</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="5" class="empty">Loading today's results…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
    <div id="internal-shell-footer"></div>
  </div>

  <script src="internal-shell.js"></script>
  <script>
    const startDateEl = document.getElementById("startDate");
    const endDateEl = document.getElementById("endDate");
    const tableBody = document.getElementById("tableBody");
    let currentRows = [];

    function todayKey() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
    }

    function segment(score) {
      if (score >= 9) return { label: "Promoter", cls: "score-high" };
      if (score >= 7) return { label: "Passive", cls: "score-mid" };
      return { label: "Detractor", cls: "score-low" };
    }

    function formatDateTime(iso) {
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return "—";
      return d.toLocaleString("en-US", { month: "2-digit", day: "2-digit", year: "2-digit", hour: "numeric", minute: "2-digit" });
    }

    function escapeHtml(value) {
      return String(value == null ? "" : value).replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
      })[ch]);
    }

    function escapeCsv(value) {
      const s = String(value ?? "");
      return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    }

    function render(rows) {
      currentRows = rows;
      document.getElementById("responseCount").textContent = String(rows.length);

      const promoters = rows.filter((r) => r.score >= 9).length;
      const passives = rows.filter((r) => r.score >= 7 && r.score <= 8).length;
      const detractors = rows.filter((r) => r.score <= 6).length;

      if (rows.length) {
        const nps = Math.round(((promoters - detractors) / rows.length) * 100);
        document.getElementById("npsValue").textContent = String(nps);
        document.getElementById("npsBreakdown").textContent =
          `${promoters} promoter${promoters === 1 ? "" : "s"} · ${passives} passive · ${detractors} detractor${detractors === 1 ? "" : "s"}`;
        const avg = rows.reduce((s, r) => s + r.score, 0) / rows.length;
        document.getElementById("avgScore").textContent = avg.toFixed(1);
      } else {
        document.getElementById("npsValue").textContent = "—";
        document.getElementById("npsBreakdown").textContent = "% promoters (9–10) − % detractors (1–6)";
        document.getElementById("avgScore").textContent = "—";
      }

      const counts = new Map();
      for (const r of rows) {
        if (!r.priority) continue;
        counts.set(r.priority, (counts.get(r.priority) || 0) + 1);
      }
      const top = [...counts.entries()].sort((a, b) => b[1] - a[1])[0];
      document.getElementById("topPriority").textContent = top ? top[0] : "—";
      document.getElementById("topPrioritySub").textContent = top
        ? `${top[1]} of ${rows.length} response${rows.length === 1 ? "" : "s"}`
        : "Most-chosen experience aspect";

      if (!rows.length) {
        tableBody.innerHTML = `<tr><td colspan="5" class="empty">No survey responses in the selected range.</td></tr>`;
        return;
      }

      tableBody.innerHTML = rows.map((r) => {
        const seg = segment(r.score);
        return `
          <tr>
            <td>${formatDateTime(r.createdAt)}</td>
            <td><span class="score-badge ${seg.cls}">${r.score}</span></td>
            <td><span class="seg-label">${seg.label}</span></td>
            <td>${escapeHtml(r.priority || "—")}</td>
            <td class="seg-label">${escapeHtml(r.recordedByEmail || "—")}</td>
          </tr>
        `;
      }).join("");
    }

    async function runReport() {
      tableBody.innerHTML = `<tr><td colspan="5" class="empty">Loading survey results…</td></tr>`;
      try {
        const params = new URLSearchParams({ start: startDateEl.value, end: endDateEl.value });
        const res = await fetch(`/api/satisfaction/responses?${params.toString()}`, { credentials: "same-origin" });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Unable to load survey results.");
        render(data.responses || []);
      } catch (err) {
        tableBody.innerHTML = `<tr><td colspan="5" class="empty">Error loading results: ${escapeHtml(err.message)}</td></tr>`;
      }
    }

    function downloadCsv(rows) {
      const headers = ["Date", "Score", "Segment", "Most Important Aspect", "Recorded By"];
      const lines = [
        headers.join(","),
        ...rows.map((r) => [
          formatDateTime(r.createdAt),
          r.score,
          segment(r.score).label,
          r.priority || "",
          r.recordedByEmail || ""
        ].map(escapeCsv).join(","))
      ];
      const blob = new Blob([lines.join("\r\n")], { type: "text/csv;charset=utf-8;" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `satisfaction-results_${startDateEl.value || "start"}_to_${endDateEl.value || "end"}.csv`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(link.href);
    }

    const today = todayKey();
    startDateEl.value = today;
    endDateEl.value = today;

    document.getElementById("runReportBtn").addEventListener("click", runReport);
    document.getElementById("exportCsvBtn").addEventListener("click", () => downloadCsv(currentRows));

    runReport();
  </script>
</body>
</html>
