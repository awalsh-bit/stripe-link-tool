<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>Wilson AC & Appliance - Service Dispatch Board</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="internal-shell.css" />
  <style>
    :root{--bg:#f3f6f3;--surface:#ffffff;--surface2:#eaf0ea;--ink:#1b241f;--muted:#5d6b62;--line:#d7dfd8;--accent:#1f6b35;--accent-ink:#fff;--soft:#e3eee5;
      --diag:#2f6fb3;--diag-bg:#e7eff9;--inst:#1f8a48;--inst-bg:#e3f3e8;--held:#0f8a8a;--held-bg:#e0f3f3;--war:#7a4fb3;--war-bg:#efe8f8;--wait:#b8770f;--wait-bg:#fbf0d9;--bad:#b3362f;--bad-bg:#fbe4e2;--colA:#1f6b35;--colB:#2f6fb3}
    *{box-sizing:border-box}
    /* Same frame as every internal page: body padding, one centred .wrap that
       internal-shell.css caps at 1480px, header host first, footer host last. */
    body{margin:0;background:linear-gradient(180deg,var(--primary-tint,#eaf4ec) 0%,var(--bg) 100%);color:var(--ink);font:14px/1.45 "Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;padding:24px 16px 60px}
    .wrap{max-width:1480px;margin:0 auto}
    @media (max-width:720px){body{padding:14px 8px 40px}}
    .mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
    button{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.4rem .75rem;cursor:pointer}
    button:hover{border-color:var(--accent)}button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
    button[disabled]{opacity:.5;cursor:not-allowed}
    select,input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.4rem .6rem}
    .top{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;padding:.9rem 0 .6rem;border-bottom:1px solid var(--line)}
    .top h2{margin:0;font-size:20px}.top .note{color:var(--muted);font-size:.8rem}
    .top .weeknav{display:flex;gap:.3rem;align-items:center;margin-left:auto}.top .weeknav button{padding:.3rem .6rem}
    @media (max-width:720px){.top .weeknav{margin-left:0;width:100%}.top .weeknav .feed{flex:1 1 100%;order:-1}#thisWeek{flex:1;font-weight:600;white-space:nowrap}}
    .feed{font-size:.75rem;color:var(--muted)}.feed b{color:var(--ink);font-weight:600}.feed.old b{color:var(--bad)}
    .status{display:none;margin:.6rem 0;padding:.5rem .8rem;border-radius:8px;font-size:.85rem}.status.show{display:block}.status.error{background:var(--bad-bg);color:var(--bad)}.status.ok{background:var(--inst-bg);color:var(--inst)}
    /* strip */
    .strip{display:grid;grid-template-columns:150px repeat(var(--ndays,5),1fr) auto;gap:4px;align-items:center;margin:1rem 0 .75rem;font-size:.78rem}
    .strip .h{color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:.68rem}
    .strip .name{font-weight:500}.strip .name button{border:0;background:none;padding:0;color:var(--ink);font-weight:500;text-align:left;cursor:pointer;text-decoration:underline dotted var(--line);text-underline-offset:3px}
    .strip .name button:hover{color:var(--accent)}
    .cell{height:26px;border-radius:4px;background:var(--surface2);position:relative;overflow:hidden;cursor:pointer;border:1px solid transparent}
    .cell i{position:absolute;inset:0 auto 0 0;background:var(--inst);opacity:.55}
    .cell.hot i{background:var(--bad)}.cell.warm i{background:var(--wait)}.cell.over i{background:var(--bad)}
    .cell span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:500}
    .cell.onA{border-color:var(--colA);box-shadow:inset 0 0 0 1px var(--colA)}.cell.onB{border-color:var(--colB);box-shadow:inset 0 0 0 1px var(--colB)}
    .cell.closed,.cell.noauto{background:repeating-linear-gradient(45deg,var(--surface2),var(--surface2) 4px,var(--bg) 4px,var(--bg) 8px)}.cell.closed span{color:var(--muted);font-weight:400}
    .cell .menu{position:absolute;right:2px;top:1px;font-size:.8rem;line-height:1;color:var(--muted);opacity:0;padding:0 .15rem;border-radius:3px}
    .cell:hover .menu,.cell:focus-within .menu{opacity:1}.cell .menu:hover{background:var(--surface);color:var(--ink)}
    .striptools{display:flex;gap:.4rem;align-items:center;color:var(--muted)}
    .striptools button{padding:.2rem .5rem;font-size:.75rem}.striptools button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
    /* columns */
    .board{display:grid;grid-template-columns:1fr 1fr 330px;gap:.9rem;align-items:start}
    @media (max-width:1100px){.board{grid-template-columns:1fr 1fr}.side{grid-column:1/-1}}
    /* Phone: one day at a time — a day picker, then one row per tech with that
       day's fill; tapping a row loads it into the (only) column. */
    .strip.mobile{grid-template-columns:1fr 130px;gap:6px 10px}
    .strip.mobile .daynav{grid-column:1/-1;display:flex;align-items:center;gap:.4rem;margin-bottom:.3rem}
    .strip.mobile .daynav b{flex:1;text-align:center;font-size:.9rem}.strip.mobile .daynav button{padding:.3rem .7rem}
    .strip.mobile .cell{height:30px}
    @media (max-width:720px){.board{grid-template-columns:1fr}.col.b,.striptools{display:none}}
    .col{background:var(--surface);border:1px solid var(--line);border-radius:8px;border-top:3px solid var(--colA);min-height:400px;display:flex;flex-direction:column}
    .col.b{border-top-color:var(--colB)}
    .colhead{padding:.7rem .8rem;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:.5rem}
    .colhead .row{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
    .colhead select{flex:1;min-width:120px}
    .stats{display:flex;gap:1rem;font-size:.78rem;color:var(--muted);flex-wrap:wrap}.stats b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
    .cap{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;display:flex}
    .cap i{display:block;height:100%}.cap .w{background:var(--accent)}.cap .d{background:var(--muted);opacity:.5}
    .stops{padding:.5rem;display:flex;flex-direction:column;gap:.4rem;flex:1;min-height:120px}
    .stops.over{background:var(--soft)}
    .leg{font-size:.72rem;color:var(--muted);display:flex;align-items:center;gap:.4rem;padding:0 .4rem}.leg::before,.leg::after{content:"";flex:1;border-top:1px dashed var(--line)}
    .card{border:1px solid var(--line);border-left:4px solid var(--diag);border-radius:6px;padding:.5rem .6rem;background:var(--surface);cursor:grab;display:grid;grid-template-columns:auto 1fr auto;gap:.15rem .6rem;align-items:start;position:relative}
    .card:active{cursor:grabbing}.card.dragging{opacity:.4}
    .card.SO6{border-left-color:var(--inst)}.card.SO4PRE{border-left-color:var(--held);border-left-style:dashed}.card.SO4H{border-left-color:var(--held)}.card.SO5,.card.REQ{border-left-color:var(--wait)}.card.wty{border-left-color:var(--war)}
    .card.stale{opacity:.7}
    .card .seq{font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted);grid-row:1/3;padding-top:.1rem}
    .card .who{font-weight:600}.card .sub{color:var(--muted);font-size:.78rem;grid-column:2}
    .card .time{font-variant-numeric:tabular-nums;font-size:.78rem;text-align:right;color:var(--muted);white-space:nowrap}.card .time b{display:block;color:var(--ink);font-size:.85rem}
    .card .time.late b{color:var(--bad)}
    .chips{grid-column:2/4;display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.2rem}
    .chip{font-size:.68rem;padding:.05rem .4rem;border-radius:10px;background:var(--surface2);color:var(--muted);font-weight:500;letter-spacing:.02em}
    .chip.st{font-family:"IBM Plex Mono",ui-monospace,monospace}
    .chip.SO1{background:var(--diag-bg);color:var(--diag)}.chip.SO6{background:var(--inst-bg);color:var(--inst)}.chip.SO4PRE,.chip.SO4H{background:var(--held-bg);color:var(--held)}.chip.SO5,.chip.REQ{background:var(--wait-bg);color:var(--wait)}.chip.wty{background:var(--war-bg);color:var(--war)}
    .chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.warn{background:var(--wait-bg);color:var(--wait)}.chip.ok{background:var(--inst-bg);color:var(--inst)}.chip.forced{background:var(--bad-bg);color:var(--bad)}.chip.epass{background:var(--held-bg);color:var(--held)}
    .pin{grid-column:3;grid-row:2;justify-self:end;border:0;background:transparent;padding:0 .2rem;font-size:.85rem;color:var(--muted);line-height:1}.pin[aria-pressed="true"]{color:var(--accent)}
    .card .more{grid-column:1/4;display:none;font-size:.78rem;color:var(--muted);border-top:1px dashed var(--line);margin-top:.35rem;padding-top:.35rem}
    .card.open .more{display:block}.more .acts{display:flex;gap:.3rem;margin-top:.35rem;flex-wrap:wrap}.more button,.more a.btn{padding:.2rem .5rem;font-size:.75rem;border:1px solid var(--line);border-radius:6px;text-decoration:none;color:var(--ink);background:var(--surface)}
    .suggest{grid-column:1/-1;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;font-size:.75rem;color:var(--ink);background:var(--soft);border-radius:6px;padding:.35rem .5rem;margin-top:.2rem}.suggest b{color:var(--accent)}.suggest .why{color:var(--muted)}.suggest button{padding:.15rem .5rem;font-size:.72rem;margin-left:auto}
    .ph{height:3px;background:var(--accent);border-radius:2px;margin:.1rem .3rem}
    .side{display:flex;flex-direction:column;gap:.9rem}
    .panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
    .panel h3{margin:0;padding:.65rem .8rem;border-bottom:1px solid var(--line);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:.5rem}
    .panel h3 span{font-variant-numeric:tabular-nums}.panel h3 input{padding:.15rem .4rem;font-size:.75rem;text-transform:none;letter-spacing:0;width:120px}
    .unsched .stops{max-height:520px;overflow:auto}
    .map svg{display:block;width:100%;height:auto}
    .maplegend{display:flex;gap:.35rem;padding:.4rem .8rem .6rem;font-size:.72rem;color:var(--muted);flex-wrap:wrap}.maplegend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:.3rem;vertical-align:-1px}
    .maplegend button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:.05rem .5rem;font-size:.7rem;color:var(--muted)}.maplegend button[aria-pressed="true"]{color:var(--ink);border-color:var(--accent)}.maplegend button[aria-pressed="false"]{opacity:.55;text-decoration:line-through}
    .toasts{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:.4rem;z-index:9}
    .toast{background:var(--ink);color:var(--bg);padding:.5rem .9rem;border-radius:6px;font-size:.82rem;box-shadow:0 4px 14px rgba(0,0,0,.2)}
    .toast.warn{background:var(--wait)}.toast.bad{background:var(--bad);color:#fff}
    .toast .acts{display:inline-flex;gap:.4rem;margin-left:.7rem}.toast .acts button{padding:.1rem .5rem;font-size:.75rem;background:var(--surface);color:var(--ink);border-color:transparent}
    .pop{position:absolute;z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:.6rem .7rem;min-width:250px;font-size:.82rem}
    .pop h4{margin:0 0 .4rem;font-size:.8rem}.pop h4 small{display:block;color:var(--muted);font-weight:400}
    .pop .grp{display:flex;gap:.3rem;flex-wrap:wrap;margin:.3rem 0}.pop button{padding:.3rem .55rem;font-size:.78rem}.pop .lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:.5rem}
    .pop select,.pop input{padding:.3rem .4rem;font-size:.78rem}.pop .x{position:absolute;right:.4rem;top:.3rem;border:0;background:none;color:var(--muted);font-size:1rem;padding:0 .2rem}
    .cal{width:252px}.cal .calhead{display:flex;justify-content:space-between;align-items:center;font-weight:600;margin-bottom:.3rem}.cal .calhead button{padding:.1rem .45rem}
    .cal .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}.cal .dow{font-size:.62rem;color:var(--muted);text-align:center;text-transform:uppercase}
    .cal .d{height:30px;border:1px solid transparent;border-radius:4px;background:var(--surface2);font-size:.72rem;position:relative;padding:0;color:var(--ink)}
    .cal .d i{position:absolute;left:0;bottom:0;height:4px;background:var(--inst);opacity:.7;border-radius:0 0 4px 4px}.cal .d.hot i{background:var(--bad)}.cal .d.warm i{background:var(--wait)}
    .cal .d.closed{background:repeating-linear-gradient(45deg,var(--surface2),var(--surface2) 3px,var(--bg) 3px,var(--bg) 6px);color:var(--muted)}
    .cal .d.today{border-color:var(--accent)}.cal .d.sel{background:var(--accent);color:var(--accent-ink)}.cal .d.wkend{opacity:.35}.cal .d.pad{visibility:hidden}
    .daybtn{flex:1;min-width:120px;text-align:left;display:flex;justify-content:space-between;align-items:center}
    .block{border:1px dashed var(--line);border-radius:6px;padding:.4rem .6rem;background:var(--surface2);color:var(--muted);font-size:.8rem;display:flex;justify-content:space-between;align-items:center;gap:.5rem}
    .block b{color:var(--ink);font-weight:500}.block button{border:0;background:none;padding:0 .2rem;color:var(--muted)}
    .overcap{color:var(--bad);font-weight:600}
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;display:flex;justify-content:flex-end}
    .drawer{width:min(560px,100%);background:var(--surface);height:100%;overflow:auto;padding:1rem 1.1rem 2rem;border-left:1px solid var(--line)}
    .drawer h2{margin:0;font-size:1.15rem}.drawer .sub{color:var(--muted);font-size:.82rem;margin:.15rem 0 .8rem}
    .drawer .stat{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:.8rem}.drawer .stat div{background:var(--surface2);border-radius:6px;padding:.45rem .6rem;font-size:.75rem;color:var(--muted)}.drawer .stat b{display:block;color:var(--ink);font-size:1rem;font-variant-numeric:tabular-nums}
    .drawer ol{list-style:none;margin:0;padding:0}.drawer li{display:grid;grid-template-columns:64px 1fr auto;gap:.2rem .6rem;padding:.45rem 0;border-bottom:1px solid var(--line);font-size:.85rem}
    .drawer li .eta{font-variant-numeric:tabular-nums;font-weight:600}.drawer li .d{color:var(--muted);font-size:.76rem;grid-column:2/4}
    .drawer .legrow{font-size:.72rem;color:var(--muted);padding:.15rem 0 .15rem 64px}
    .drawer .alerts{display:flex;gap:.3rem;flex-wrap:wrap;margin:.6rem 0}.drawer .acts{display:flex;gap:.4rem;margin:.8rem 0}
    .empty{padding:2rem;text-align:center;color:var(--muted)}
    @media (prefers-reduced-motion:no-preference){.card,.cell{transition:box-shadow .12s,opacity .12s}}
  </style>
</head>
<body data-shell-label="Service Dispatch Board" data-shell-icon="service">
  <div class="wrap">
    <div id="internal-shell-header"></div>
    <div class="top">
      <div><h2>Service Dispatch Board</h2><div class="note">Drag a call onto a tech's day. Every move becomes a packet in <a href="service-journey.html">Service Journey</a> for the office to key into ePASS; the next feed confirms it. Stop order, windows, pins and blocks live here only.</div></div>
      <div class="weeknav"><span class="feed" id="feed"></span><button id="prevWeek" title="Previous week">‹</button><button id="thisWeek">This week</button><button id="nextWeek" title="Next week">›</button><button id="reload" title="Reload from the mirror">↻</button></div>
    </div>
    <div class="status" id="pageStatus"></div>
    <div class="strip" id="strip"></div>
    <div class="board">
      <div class="col a" id="colA"><div class="empty">Loading…</div></div>
      <div class="col b" id="colB"></div>
      <div class="side">
        <div class="panel unsched"><h3>Unscheduled <span id="unCount"></span><input id="unQ" placeholder="filter…" aria-label="Filter unscheduled" /></h3><div class="stops" id="unsched" data-drop="un"></div></div>
        <div class="panel map"><h3>Map <span style="font-weight:400;text-transform:none;letter-spacing:0">click a truck to hide/show it</span></h3><div id="map"></div><div class="maplegend" id="maplegend"></div></div>
      </div>
    </div>
    <div id="internal-shell-footer"></div>
  </div>
  <div class="toasts" id="toasts"></div>
  <script src="internal-shell.js"></script>
  <script>
  (() => {
    const $ = (s) => document.querySelector(s);
    const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    async function api(path, options = {}) {
      const res = await fetch(path, { credentials: "same-origin", headers: options.body ? { "Content-Type": "application/json" } : {}, ...options });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "Request failed.");
      return data;
    }
    function setStatus(msg, kind) { const b = $("#pageStatus"); if (!msg) { b.className = "status"; b.textContent = ""; return; } b.className = "status show " + kind; b.textContent = msg; }

    // ---------- state (everything comes from /api/service-board) ----------
    let B = null;                 // the board payload
    let J = [], TECHS = [], DAYS = [], TD = {}, BLOCKS = [], ZONE = {}, ZIPZONE = {}, ZIP = {}, SHOP = { ll: [30.1852, -98.0031] }, S = {};
    const col = { A: { tech: null, day: null }, B: { tech: null, day: null } };
    let stripTarget = "A", from = "", unFilter = "";
    const mapShow = { A: true, B: true, un: true, others: {} };
    const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    const mkDay = (k) => { const d = new Date(k + "T12:00:00Z"); return { k, s: ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][d.getUTCDay()], n: MON[d.getUTCMonth()] + " " + d.getUTCDate() }; };
    const dayObj = (k) => DAYS.find((d) => d.k === k) || mkDay(k);
    const dow = (k) => mkDay(k).s;
    const mondayOf = (k) => { const d = new Date(k + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7)); return d.toISOString().slice(0, 10); };
    const addDays = (k, n) => { const d = new Date(k + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
    const addBD = (k, n) => { let d = k; while (n > 0) { d = addDays(d, 1); if (!["Sat", "Sun"].includes(dow(d))) n--; } return d; };
    const md = (k) => (k ? `${Number(k.slice(5, 7))}/${Number(k.slice(8, 10))}` : "");
    const techById = (id) => TECHS.find((t) => t.id === id) || { id, name: id || "—", skills: [], start: "shop", end: "shop", auto: false, workDays: ["Mon", "Tue", "Wed", "Thu", "Fri"], home: null, zone: [], zone2: [] };
    const first = (t) => (t.name || t.id || "").split(" ")[0];
    const SHIFT = () => ({ start: S["board.shift_start_min"] ?? 480, end: S["board.pm_end_min"] ?? 1020 });
    const AM_END = () => S["board.am_end_min"] ?? 720;
    const td = (tech, day) => ((TD[tech] ||= {})[day] ||= { adjust: 0 });
    const isOpen = (tech, day) => { const o = td(tech, day); if (o.closed) return false; if (o.open) return true; return techById(tech).workDays.includes(dow(day)); };
    const closedWhy = (tech, day) => { const o = td(tech, day), t = techById(tech); if (o.closed) return o.reason || "closed"; if (!t.workDays.includes(dow(day)) && !o.open) return "works " + t.workDays[0] + "–" + t.workDays[t.workDays.length - 1]; return ""; };
    const zinfo = (j) => ZONE[j.zone || ZIPZONE[j.zip] || ""] || { zone: j.zone || "?", group: "Unclassified", mode: "office_only", p: "", s: [], ll: null };
    const ll = (j) => j.ll || ZIP[j.zip] || zinfo(j).ll || SHOP.ll;
    function driveMin(a, b) { if (!a || !b) return 0; const R = 6371, dLat = (b[0] - a[0]) * Math.PI / 180, dLng = (b[1] - a[1]) * Math.PI / 180, la = a[0] * Math.PI / 180, lb = b[0] * Math.PI / 180; const h = Math.sin(dLat / 2) ** 2 + Math.cos(la) * Math.cos(lb) * Math.sin(dLng / 2) ** 2; const km = 2 * R * Math.asin(Math.sqrt(h)); return Math.round((S["placement.drive_base_min"] ?? 4) + km * (S["placement.drive_min_per_km"] ?? 1.55)); }
    const fmt = (m) => { let h = Math.floor(m / 60), mm = m % 60; const ap = h >= 12 ? "PM" : "AM"; h = ((h + 11) % 12) + 1; return `${h}:${String(mm).padStart(2, "0")} ${ap}`; };
    const hm = (m) => (m >= 60 ? `${Math.floor(m / 60)}h ${m % 60 ? (m % 60) + "m" : ""}`.trim() : `${m}m`);
    const jobsFor = (tech, day) => J.filter((j) => j.tech === tech && j.day === day).sort((a, b) => a.seq - b.seq || a.sv.localeCompare(b.sv));
    const startPt = (t) => (t.start === "shop" ? SHOP.ll : t.home || SHOP.ll), endPt = (t) => (t.end === "shop" ? SHOP.ll : t.home || SHOP.ll);
    const blocksFor = (tech, day) => BLOCKS.filter((b) => b.tech === tech && b.day === day).sort((a, b) => a.start - b.start);

      const alerts = []; if (!tl.open) alerts.push(["bad", "day closed · " + closedWhy(tech, day)]); if (tl.over) alerts.push(["bad", "over capacity"]); if (tl.forced) alerts.push(["forced", tl.forced + " forced stop(s)"]); if (ns && dps > 35) alerts.push(["warn", dps + " min drive/stop"]); if (tl.stops.some((s) => s.late)) alerts.push(["bad", "late arrivals"]); if (tl.needsShop) alerts.push(["", "shop touch before installs"]);
      let n = 0; const items = tl.stops.map((s) => { if (s.shop) return `<div class="legrow">↳ ${s.drive}m · shop touch · load parts · ${fmt(s.arr)}</div>`; if (s.block) return `<li><span class="eta">${fmt(s.arr)}</span><span>⏸ ${esc(s.block.label)}</span><span></span><span class="d">block · not a call · not sent to ePASS</span></li>`; n++; const j = s.j, v = validate(j, tech, day);
        return `<div class="legrow">↳ ${s.drive}m drive${s.wait ? ` · waits ${s.wait}m` : ""}</div><li><span class="eta" style="${s.late ? "color:var(--bad)" : ""}">${fmt(s.arr)}</span><span><b>${n}. ${esc(j.cust)}</b> <span class="chip st ${esc(j.st)}">${esc(j.st)}</span>${j.bal ? ` <span class="chip bad">${j.bal}</span>` : ""}${j.forced ? ' <span class="chip forced">forced</span>' : ""}</span><span></span><span class="d">${esc(j.addr)}, ${esc(j.zip)} · ${esc(zinfo(j).zone)} · ${esc(j.unit)} · ${hm(j.dur)} · ${j.win === "PM" ? "12–5" : j.win === "AM" ? "8–12" : "any"}${v.filter((x) => x.c === "bad").map((x) => " · ⚠ " + esc(x.t)).join("")}</span></li>`; }).join("");
      const W = 300, H = 180; let mini = ""; { const pts = [startPt(t), ...tl.stops.filter((s) => !s.block).map((s) => (s.shop ? SHOP.ll : ll(s.j))), endPt(t), SHOP.ll]; const lats = pts.map((p) => p[0]), lngs = pts.map((p) => p[1]); const pa = Math.max(0.02, (Math.max(...lats) - Math.min(...lats)) * 0.15), po = Math.max(0.03, (Math.max(...lngs) - Math.min(...lngs)) * 0.15); const mnLa = Math.min(...lats) - pa, mxLa = Math.max(...lats) + pa, mnLo = Math.min(...lngs) - po, mxLo = Math.max(...lngs) + po; const X = (lo) => 10 + (lo - mnLo) / (mxLo - mnLo) * (W - 20), Y = (la) => H - 10 - (la - mnLa) / (mxLa - mnLa) * (H - 20);
        mini = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;background:var(--surface2);border-radius:6px"><rect x="${X(SHOP.ll[1]) - 4}" y="${Y(SHOP.ll[0]) - 4}" width="8" height="8" fill="var(--muted)"/><polyline points="${pts.slice(0, -1).map((p) => X(p[1]) + "," + Y(p[0])).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="1.5"/>${tl.stops.filter((s) => s.j).map((s, i) => { const p = ll(s.j); return `<circle cx="${X(p[1])}" cy="${Y(p[0])}" r="7" fill="var(--accent)"/><text x="${X(p[1])}" y="${Y(p[0]) + 3}" font-size="8" text-anchor="middle" fill="var(--accent-ink)" font-weight="600">${i + 1}</text>`; }).join("")}</svg>`; }
      const ov = document.createElement("div"); ov.className = "overlay"; ov.innerHTML = `<div class="drawer" role="dialog" aria-label="Route overview">
        <div style="display:flex;justify-content:space-between;align-items:flex-start"><div><h2>${esc(t.name)} · ${d.s} ${d.n}</h2><div class="sub">${t.start}→${t.end} · works ${t.workDays.join(" ")} · ${t.skills.join(", ")}${t.auto ? "" : " · <b>not auto-routed</b>"}</div></div><button data-x>Close</button></div>
        <div class="alerts">${alerts.map(([c, x]) => `<span class="chip ${c}">${esc(x)}</span>`).join("") || '<span class="chip ok">no alerts</span>'}</div>
        <div class="stat"><div>stops<b>${ns}</b></div><div>on site<b>${hm(tl.work)}</b></div><div>driving<b>${hm(tl.drive)}</b></div><div>fill<b style="${tl.over ? "color:var(--bad)" : ""}">${Math.round(tl.fill * 100)}%</b></div><div>back<b>${fmt(tl.ret)}</b></div><div>drive/stop<b style="${dps > 35 ? "color:var(--bad)" : ""}">${dps}m</b></div></div>
        ${ns ? mini : `<div class="legrow" style="padding:.6rem 0;color:var(--muted)">No stops on this day${tl.open ? "" : " (closed · " + esc(closedWhy(tech, day)) + ")"} — pick another day from the fill strip.</div>`}
        ${ns ? `<div class="legrow" style="padding-left:0;margin-top:.6rem">leaves ${t.start} ${fmt(SHIFT().start)}</div>` : ""}<ol>${items}</ol>${ns ? `<div class="legrow">↳ ${tl.back}m · back at ${t.end} ${fmt(tl.ret)}</div>` : ""}
        <div class="acts"><button data-load="A">Load into left column</button><button data-load="B">Load into right column</button><button data-dc>Day controls</button></div>
        <div style="font-size:.75rem;color:var(--muted)">Blocks and forced stops are visible here and on the board only — nothing about them goes to ePASS.</div></div>`;
      document.body.append(ov); const close = () => ov.remove(); ov.onclick = (e) => { if (e.target === ov) close(); }; ov.querySelector("[data-x]").onclick = close;
      ov.querySelectorAll("[data-load]").forEach((b) => (b.onclick = () => { col[b.dataset.load] = { tech, day }; close(); renderAll(); }));
      ov.querySelector("[data-dc]").onclick = () => { close(); openDayPop(tech, day, $("#colA .daybtn") || document.body); };
      document.addEventListener("keydown", function escK(e) { if (e.key === "Escape") { close(); document.removeEventListener("keydown", escK); } });
    }

    // ---------- load ----------
    async function load({ keepCols = true } = {}) {
      const data = await api(`/api/service-board?from=${encodeURIComponent(from)}&days=5`);
      B = data; J = data.jobs; TECHS = data.techs; DAYS = data.days; TD = data.td || {}; BLOCKS = data.blocks || []; ZONE = data.zones || {}; ZIPZONE = data.zipZone || {}; ZIP = data.zipPts || {}; SHOP = data.shop || SHOP; S = data.settings || {};
      for (const t of TECHS) { t.zone = Object.values(ZONE).filter((z) => z.p === t.id).map((z) => z.zone); t.zone2 = Object.values(ZONE).filter((z) => z.s.includes(t.id)).map((z) => z.zone); }
      if (!TECHS.length) { $("#colA").innerHTML = '<div class="empty">No techs in the roster yet — seed sj_techs first.</div>'; $("#colB").innerHTML = ""; return; }
      const firstAuto = TECHS.find((t) => t.auto) || TECHS[0];
      const todayK = DAYS.find((d) => d.k === B.today)?.k || DAYS[0].k;
      if (!keepCols || !col.A.tech || !TECHS.some((t) => t.id === col.A.tech)) col.A = { tech: firstAuto.id, day: todayK };
      if (!keepCols || !col.B.tech || !TECHS.some((t) => t.id === col.B.tech)) col.B = { tech: firstAuto.id, day: DAYS.find((d) => d.k > todayK)?.k || todayK };
      if (!DAYS.some((d) => d.k === col.A.day)) col.A.day = DAYS[0].k; if (!DAYS.some((d) => d.k === col.B.day)) col.B.day = DAYS[Math.min(1, DAYS.length - 1)].k;
      renderAll();
    }
    // Header navigation: a week at a time on desktop; on a phone the same three
    // buttons step a day at a time, the middle one shows the day and returns to today.
    function renderNav() {
      if (!isMobile()) { $("#thisWeek").textContent = "This week"; $("#prevWeek").title = "Previous week"; $("#nextWeek").title = "Next week"; return; }
      const d = dayObj(stripDay || B.today); $("#thisWeek").textContent = d.k === B.today ? `Today · ${d.s} ${d.n}` : `${d.s} ${d.n}`; $("#prevWeek").title = "Previous day"; $("#nextWeek").title = "Next day";
    }
    async function stepDay(n) {
      const i = DAYS.findIndex((d) => d.k === (stripDay || B.today)); const j = i + n;
      if (j < 0) { from = addDays(DAYS[0].k, -7); stripDay = ""; await load(); stripDay = DAYS[DAYS.length - 1].k; }
      else if (j >= DAYS.length) { from = addDays(DAYS[0].k, 7); stripDay = ""; await load(); stripDay = DAYS[0].k; }
      else stripDay = DAYS[j].k;
      col.A.day = stripDay; renderAll();
    }
    $("#prevWeek").onclick = guard(async () => { if (isMobile()) return stepDay(-1); from = addDays(DAYS[0].k, -7); await load(); });
    $("#nextWeek").onclick = guard(async () => { if (isMobile()) return stepDay(1); from = addDays(DAYS[0].k, 7); await load(); });
    $("#thisWeek").onclick = guard(async () => { from = ""; stripDay = ""; await load({ keepCols: false }); });
    $("#reload").onclick = guard(async () => { await load(); toast("Reloaded"); });
    $("#unQ").addEventListener("input", () => { unFilter = $("#unQ").value; renderUnsched(); });
    setupDrops();
    load({ keepCols: false }).catch((err) => { setStatus(err.message, "error"); $("#colA").innerHTML = `<div class="empty">${esc(err.message)}</div>`; });
    setInterval(() => { if (!document.querySelector(".pop,.overlay,.dragging")) load().catch(() => {}); }, 5 * 60 * 1000);
  })();
  </script>
</body>
</html>
