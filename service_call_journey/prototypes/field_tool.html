/* banner */
.head{position:relative;background:linear-gradient(135deg,var(--wilson-green-dark),var(--wilson-green));color:#fff;border-radius:22px;padding:18px 20px;box-shadow:0 16px 34px rgba(15,71,29,.18);overflow:hidden}

.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.pills span{background:rgba(255,255,255,.12);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
.pills span.att{background:rgba(255,196,80,.28)}
.prog{height:8px;border-radius:999px;background:rgba(255,255,255,.18);margin-top:12px;overflow:hidden}.prog span{display:block;height:100%;background:#fff;transition:width .25s ease}

.card.next{border:2px solid var(--wilson-green);padding-top:14px}

.row{display:flex;gap:8px}.row>*{flex:1}
.stop{display:grid;grid-template-columns:34px 1fr auto;gap:2px 12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px 14px;box-shadow:var(--shadow-soft)}

.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}

.timer{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex-shrink:0;background:var(--wilson-green-pale);color:var(--wilson-green);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}

    ${f.decision==='approve'?`<div style="margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--wilson-green-pale)"><p style="color:var(--ink);font-size:13px">I approve the work above for <b>${money(t.total)}</b> and authorize Wilson AC &amp; Appliance to charge the card I saved with my service request${hasParts?' once the repair is complete':''}. I understand the diagnostic fee applies if I cancel.</p>
      <label style="display:flex;gap:10px;align-items:center;margin:10px 0;font-size:14px;font-weight:600"><input type="checkbox" id="agree" ${f.agree?'checked':''} style="width:22px;height:22px">Customer read and agrees</label>
      <div style="font-size:12px;color:var(--muted);margin-bottom:4px">Customer signature</div><canvas id="sig" width="600" height="180" style="width:100%;height:120px;background:var(--card);border:1px dashed var(--line-strong);border-radius:10px;touch-action:none"></canvas>
      <div class="row" style="margin-top:8px"><button class="button ghost" id="sigclear" style="min-height:40px">Clear</button><span style="flex:2;font-size:12px;color:var(--muted);align-self:center">${f.signed?'✓ Signed':'Sign with a finger'}</span></div></div>`:''}</div>`}
function installHTML(s){const f=s.f;
  const outcomes=[['complete','Repair complete — unit tested','→ SO8 · card charged'],['moreparts','Additional parts needed','→ SO2 · new quote'],['partissue','Part wrong, damaged or missing','→ SO3 · reorder'],['notfixed','Installed but problem persists','→ SO1 · needs research'],['access','Could not access unit','reschedule']];
  return `<div class="card"><h3>Parts on this truck for this job</h3><div class="parts">${s.parts.map(p=>`<div class="part st"><div><div>${esc(p[1])} <span class="pn">×${p[2]}</span></div><div class="pn mono">${p[0]}</div></div><div class="status">${['Installed','Wrong','Damaged'].map(x=>`<button data-ps="${p[0]}:${x}" aria-pressed="${f.partStatus[p[0]]===x}">${x}</button>`).join('')}</div></div>`).join('')}</div></div>
  <div class="card"><h3>Serial tag</h3><div class="photo filled" style="cursor:default"><span>✓ On file from diagnostic · <span class="mono">${s.serial}</span></span></div></div>
  <div class="card"><h3>Outcome</h3><div class="opts">${outcomes.map(o=>`<button class="opt ${o[0]==='complete'?'':'att'}" data-outcome="${o[0]}" aria-pressed="${f.outcome===o[0]}"><span>${o[1]}</span><span class="res">${o[2]}</span></button>`).join('')}</div></div>
  <div class="card" id="partsCard" ${f.outcome==='moreparts'?'':'hidden'}><h3>Additional parts</h3><p>Component, then key the part number yourself.</p><div class="sugg">${compChips(s,f)}</div>
    <div class="parts" style="margin-top:10px">${f.parts.map((p,i)=>partRow(p,i,false)).join('')}</div></div>
  <div class="card"><h3>Completed work photo</h3>${photoHTML('problem','Photo of finished repair',false,f.photos[0])}</div>`}
function wireAnswers(){const f=cur.f;
  document.querySelectorAll('[data-outcome]').forEach(b=>b.onclick=()=>{f.outcome=f.outcome===b.dataset.outcome?null:b.dataset.outcome;saved();renderJob()});
  document.querySelectorAll('[data-sym]').forEach(b=>b.onclick=()=>{const v=b.dataset.sym;f.symptoms=f.symptoms.includes(v)?f.symptoms.filter(x=>x!==v):[...f.symptoms,v];b.setAttribute('aria-pressed',f.symptoms.includes(v));saved();if(v==='Error code'){renderJob();if(f.symptoms.includes(v))setTimeout(()=>$('#errcode')?.focus(),30);return}readiness()});
  const ec=$('#errcode');if(ec)ec.oninput=e=>{f.errorCode=e.target.value.toUpperCase();saved();readiness()};
  const cb=document.querySelector('[data-custom]');if(cb)cb.onclick=()=>{f.showCustom=!f.showCustom;if(!f.showCustom)f.custom='';renderJob();if(f.showCustom)setTimeout(()=>$('#custom')?.focus(),30)};
  const cu=$('#custom');if(cu)cu.oninput=e=>{f.custom=e.target.value;saved()};
  document.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>{const q=LABOR_QUICK.find(x=>x[0]===b.dataset.quick);const i=f.tasks.findIndex(x=>x[0]===q[0]);if(i>=0)f.tasks.splice(i,1);else{f.tasks=f.tasks.filter(x=>!LABOR_QUICK.find(y=>y[0]===x[0]));f.tasks.push([...q])}saved();renderJob()});
  document.querySelectorAll('[data-cause]').forEach(b=>b.onclick=()=>{f.cause=f.cause===b.dataset.cause?null:b.dataset.cause;document.querySelectorAll('[data-cause]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.cause===f.cause));saved();readiness()});
  document.querySelectorAll('[data-labor]').forEach(b=>b.onclick=()=>{f.labor=f.labor===b.dataset.labor?null:b.dataset.labor;document.querySelectorAll('[data-labor]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.labor===f.labor));saved();readiness()});
  document.querySelectorAll('[data-flag]').forEach(b=>b.onclick=()=>{const v=b.dataset.flag;f.flags=f.flags.includes(v)?f.flags.filter(x=>x!==v):[...f.flags,v];b.setAttribute('aria-pressed',f.flags.includes(v));saved()});
  document.querySelectorAll('[data-addpart]').forEach(b=>b.onclick=()=>{const nm=b.dataset.addpart;f.parts.push(['',nm==='OTHER'?'Other component — name it in the note':nm,1,0,'']);saved();renderJob();const inp=document.querySelector(`[data-pn="${f.parts.length-1}"]`);if(inp)inp.focus()});
  document.querySelectorAll('[data-pn]').forEach(inp=>{inp.oninput=e=>{f.parts[+inp.dataset.pn][0]=e.target.value.toUpperCase().trim();saved();readiness()};inp.onblur=()=>{const row=inp.closest('.part');const lbl=row&&row.querySelector('.pn');if(lbl)lbl.textContent=f.parts[+inp.dataset.pn][0]?'part # keyed by tech':'part # needed — from the tag, the parts app or your lookup'}});
  document.querySelectorAll('[data-price]').forEach(inp=>{inp.oninput=e=>{const v=parseFloat(e.target.value.replace(/[^0-9.]/g,''));f.parts[+inp.dataset.price][3]=isNaN(v)?0:v;saved()};inp.onblur=()=>renderJob()});
  document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const [i,d]=b.dataset.q.split(':').map(Number);f.parts[i][2]+=d;if(f.parts[i][2]<=0)f.parts.splice(i,1);saved();renderJob()});
  document.querySelectorAll('[data-ps]').forEach(b=>b.onclick=()=>{const [pn,st]=b.dataset.ps.split(':');f.partStatus[pn]=f.partStatus[pn]===st?null:st;saved();renderJob()});
  document.querySelectorAll('[data-addtask]').forEach(b=>b.onclick=()=>{const t=TASKS[cur.cat].find(x=>x[0]===b.dataset.addtask);f.tasks.push([...t]);saved();renderJob()});
  document.querySelectorAll('[data-rmtask]').forEach(b=>b.onclick=()=>{f.tasks.splice(+b.dataset.rmtask,1);saved();renderJob()});
  document.querySelectorAll('[data-mod]').forEach(b=>b.onclick=()=>{const m=MODS.find(x=>x[0]===b.dataset.mod);const i=f.tasks.findIndex(x=>x[0]===m[0]);i>=0?f.tasks.splice(i,1):f.tasks.push([...m]);saved();renderJob()});
  document.querySelectorAll('[data-ship]').forEach(b=>b.onclick=()=>{f.ship=!f.ship;saved();renderJob()});
  document.querySelectorAll('[data-decision]').forEach(b=>b.onclick=()=>{f.decision=f.decision===b.dataset.decision?null:b.dataset.decision;f.signed=false;f.agree=false;saved();renderJob();if(f.decision==='approve')setTimeout(()=>$('#sig')?.scrollIntoView({block:'center'}),50)});
  const ag=$('#agree');if(ag)ag.onchange=()=>{f.agree=ag.checked;readiness()};
  const tq=$('#taskq');if(tq)tq.oninput=e=>{const v=e.target.value.toLowerCase();const m=$('#moreTasks');if(m)m.hidden=!!v;document.querySelectorAll('[data-addtask]').forEach((b,i)=>{b.hidden=v?!b.dataset.addtask.toLowerCase().includes(v):(i>=6&&!f.allTasks)})};const mt=$('#moreTasks');if(mt)mt.onclick=()=>{f.allTasks=true;renderJob()};
  const sig=$('#sig');if(sig){const ctx=sig.getContext('2d');ctx.lineWidth=3;ctx.lineCap='round';ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--ink');let drawing=false;const pos=e=>{const r=sig.getBoundingClientRect();return[(e.clientX-r.left)*sig.width/r.width,(e.clientY-r.top)*sig.height/r.height]};
    sig.onpointerdown=e=>{drawing=true;ctx.beginPath();ctx.moveTo(...pos(e));sig.setPointerCapture(e.pointerId)};sig.onpointermove=e=>{if(!drawing)return;ctx.lineTo(...pos(e));ctx.stroke()};sig.onpointerup=sig.onpointercancel=()=>{if(drawing){drawing=false;if(!f.signed){f.signed=true;saved();readiness();const l=sig.parentElement.querySelector('.row span');if(l)l.textContent='✓ Signed'}}};
    $('#sigclear').onclick=()=>{ctx.clearRect(0,0,sig.width,sig.height);f.signed=false;readiness();sig.parentElement.querySelector('.row span').textContent='Sign with a finger'}}
  document.querySelectorAll('[data-photo]').forEach(inp=>inp.onchange=()=>{const file=inp.files[0];if(!file)return;const lab=inp.closest('label');lab.querySelector('span').textContent='Saving photo…';
    const r=new FileReader();r.onload=()=>{/* real build: downscale to 1600px and write Blob to IndexedDB before flipping the label */if(inp.dataset.photo==='serial')f.serialPhoto=r.result;else f.photos[0]=r.result;saved();renderJob();toast('Photo saved on this phone — uploads when there\'s signal')};r.readAsDataURL(file)});
}
function missing(){const s=cur,f=s.f,m=[];
  if(s.st==='SO1'){if(!f.serialPhoto)m.push('serial tag photo');if(!f.outcome)m.push('outcome');if(f.outcome&&!/access|declined/.test(f.outcome)&&!f.symptoms.length)m.push('what you found');if(f.symptoms.includes('Error code')&&!f.errorCode.trim())m.push('the error code shown');
    if(f.outcome==='parts'){if(!f.parts.length)m.push('at least one part');if(!f.labor)m.push('labor');}
    if(/parts|field/.test(f.outcome||'')){const np=f.parts.filter(p=>!p[0]);if(np.length)m.push(`part # for ${np.map(p=>p[1].split(' —')[0]).join(', ')} (type UNKNOWN if you can't find it)`)}
    if(f.outcome==='field'){if(!f.tasks.length)m.push('at least one labor task');if(!f.decision)m.push('customer decision');if(f.decision==='approve'){if(!f.agree)m.push('customer agreement');if(!f.signed)m.push('signature')}}
    if(f.outcome&&/research|access|declined|replace/.test(f.outcome)&&!f.note.trim())m.push('a note explaining');if(f.parts.some(p=>/UNKNOWN|TBD/.test(p[0])||/Other component/.test(p[1]))&&!f.note.trim())m.push('describe the unknown part in the note')}
  else{if(!f.outcome)m.push('outcome');const un=s.parts.filter(p=>!f.partStatus[p[0]]);if(un.length)m.push(`status for ${un.length} part${un.length>1?'s':''}`);if(f.outcome==='moreparts'&&!f.parts.length)m.push('the additional part');if(f.outcome==='moreparts'&&f.parts.some(p=>!p[0]))m.push('part # on every line (UNKNOWN + note if needed)');if(f.outcome&&f.outcome!=='complete'&&!f.note.trim())m.push('a note explaining')}
  return m}
function readiness(){const s=cur,f=s.f,m=missing(),bar=$('#bar');
  if(s.done){bar.hidden=false;bar.innerHTML=`<div class="in"><button class="button ghost" id="reopen">Reopen</button><button class="button" disabled>Submitted · ${f.result}</button></div>`;$('#reopen').onclick=()=>{s.done=false;render()};return}
  const fq=f.decision==='approve'?(f.parts.length?'Approved → order parts':'Approved → start the repair'):f.decision==='later'?'Send quote link to customer':f.decision==='decline'?'Submit — declined':'Field quote';const label=s.st==='SO1'?({field:fq,parts:'Submit findings → office quote',onsite:'Complete — quick fix, diag fee',research:'Save — needs research',replace:'Submit — recommend replacement',declined:'Submit — customer declined',access:'Could not access — reschedule'}[f.outcome]||'Submit findings'):({complete:'Repair complete → charge card',moreparts:'Submit → new quote',partissue:'Submit → reorder part',notfixed:'Submit → needs research',access:'Could not access — reschedule'}[f.outcome]||'Complete job');
  bar.hidden=false;bar.innerHTML=`<div class="in"><button class="button ghost" id="savenow">Save</button><button class="button" id="submit" ${m.length?'disabled':''}>${label}</button></div><small>${m.length?'Still needed: '+m.join(' · '):'Everything the office needs is here.'}</small>`;
  $('#savenow').onclick=()=>{saved();toast('Saved on this phone')};
  $('#submit').onclick=submit;
  const ins=document.querySelector('.card:last-of-type');
}
function submit(){const s=cur,f=s.f;const fqr=f.decision==='approve'?(f.parts.length?'SO3 · field-approved, order parts':'SO8 · field-approved, charged'):f.decision==='later'?'SO2.2 · link sent':'SO7 · diag fee charged';const map=s.st==='SO1'?{field:fqr,parts:'SO2 · quote to parts verify',onsite:'SO8 · diag fee billed',research:'SO1 · research',replace:'SO7 · sales lead',declined:'SO7 · diag fee charged',access:'Reschedule'}:{complete:'SO8 · card charged',moreparts:'SO2 · new quote',partissue:'SO3 · reorder',notfixed:'SO1 · research',access:'Reschedule'};
  f.result=map[f.outcome];s.done=true;s.phase='done';const mins=f.arrived?Math.max(1,Math.round((Date.now()-f.arrived)/60000)):0;
  const m=stopDollars(s);toast(`${s.cust.split(' ').pop()} → ${f.result}. On-site ${mins} min.${m&&!m.pending&&(m.lab+m.pp)?` +${usd(m.lab+m.pp)} to your day.`:m&&m.pending?` ${m.pending}.`:''}`);view='route';render();window.scrollTo(0,0)}
render();
</script>
