  document.querySelectorAll('[data-verify]').forEach(b=>b.onclick=()=>{const j=J.find(x=>x.sv===b.dataset.verify);const rq=requote(j);
    if(j.src==='field'&&rq.c==='bad'){j.st='SO2.2';toast(`${j.cust}: new total texted for re-approval (parts ${money(partsTotal(j,'verified'))}). Order holds until they tap Approve.`,'warn')}
    else if(j.src==='office'){j.st='SO2.2';SYNC.push({id:SYNC.length+1,sv:j.sv,cust:j.cust,fields:{status:'SO2.2',date:'',tech:j.tech},created:NOW.toISOString(),state:'pending',note:'Quote auto-sent by text (customer pref). Reminders 48 h / 5 d.'});toast(`${j.cust}: quote built from lines and sent by text → SO2.2`)}
    else{j.st='SO3';j.approvedAt=NOW.toISOString();SYNC.push({id:SYNC.length+1,sv:j.sv,cust:j.cust,fields:{status:'SO3',date:'',tech:j.tech},created:NOW.toISOString(),state:'pending'});toast(`${j.cust} → SO3, now in Parts order`)}
    render()});
}
/* ---------- ORDER ---------- */
let sel=new Set();let poDraft=null;
function renderOrder(){
  const jobs=J.filter(j=>j.st==='SO3');const bySup={};jobs.forEach(j=>j.parts.forEach((p,i)=>{(bySup[p.supplier]??=[]).push({j,p,i,key:j.sv+':'+i})}));
  $('#v-order').innerHTML=`<div class="intro"><h2>Parts order</h2><p>Approved and warranty jobs, grouped by supplier. Tick lines, create the PO, enter the supplier's expected date — that date drives the customer's tracker, the install picker, the route builder and the auto-pencil (ETA + 2 business days on the tech's best-fit day). Placing the PO moves every job on it to SO4 (SO4B if the ETA is more than 10 days out).</p></div>
  <div class="grid">${Object.entries(bySup).map(([sup,lines])=>`<div class="supplier"><h3>${sup}<span class="tot"><b>${lines.length}</b> lines · <b>${money(lines.reduce((a,l)=>a+l.p.verified*l.p.qty,0))}</b></span></h3>
    <div class="tw"><table><thead><tr><th></th><th>Part</th><th>Job</th><th class="r">Qty</th><th class="r">Price</th><th>Avail</th></tr></thead><tbody>${lines.map(l=>`<tr><td><input type="checkbox" data-sel="${l.key}" ${sel.has(l.key)?'checked':''}></td><td>${esc(l.p.name)}<div class="pn">${l.p.pn}</div></td><td>${esc(l.j.cust)}<div class="pn">${l.j.sv} · ${TECH[l.j.tech]} · approved ${ago(l.j.approvedAt)} ago</div></td><td class="r mono">${l.p.qty}</td><td class="r mono">${money(l.p.verified)}</td><td><span class="chip ${l.p.avail==='backorder'?'bad':l.p.avail==='stock'?'ok':''}">${l.p.avail}</span></td></tr>`).join('')}</tbody></table></div>
    <div class="acts"><button class="sm" data-selall="${sup}">Select all ${sup}</button><span style="flex:1"></span><button class="primary" data-po="${sup}" ${lines.some(l=>sel.has(l.key))?'':'disabled'}>Create PO for ${lines.filter(l=>sel.has(l.key)).length} line(s)</button></div>
    ${poDraft&&poDraft.sup===sup?poHTML(poDraft):''}</div>`).join('')||'<div class="empty">No approved jobs waiting for parts.</div>'}</div>`;
  document.querySelectorAll('[data-sel]').forEach(c=>c.onchange=()=>{c.checked?sel.add(c.dataset.sel):sel.delete(c.dataset.sel);renderOrder()});
  document.querySelectorAll('[data-selall]').forEach(b=>b.onclick=()=>{bySup[b.dataset.selall].forEach(l=>sel.add(l.key));renderOrder()});
  document.querySelectorAll('[data-po]').forEach(b=>b.onclick=()=>{const sup=b.dataset.po;poDraft={sup,lines:bySup[sup].filter(l=>sel.has(l.key)),num:'PO-'+POSEQ,eta:'2026-09-18',shipTo:'shop'};renderOrder()});
  const place=$('#place');if(place){place.onclick=()=>{const d=poDraft;const late=(new Date(d.eta)-NOW)/864e5>10;const affected=new Set();d.lines.forEach(l=>{l.j.po=d.num;l.j.eta=d.eta;l.p.received=false;affected.add(l.j)});affected.forEach(j=>{if(j.parts.every(p=>p.po||d.lines.some(l=>l.j===j)))j.st=late?'SO4B':(d.shipTo==='customer'?'SO4H':'SO4');j.pencil=pencilFor(j);SYNC.push({id:SYNC.length+1,sv:j.sv,cust:j.cust,fields:{status:j.st,date:'',tech:j.tech},summary:`${d.num} ${d.sup} · ETA ${d.eta} · ship to ${d.shipTo}`,created:NOW.toISOString(),state:'pending'})});
    d.lines.forEach(l=>sel.delete(l.key));POSEQ++;toast(`${d.num} placed with ${d.sup} · ${affected.size} job(s) → ${late?'SO4B (backorder)':'SO4'} · customers texted "parts ordered, expected ${d.eta.slice(5).replace('-','/')}" · each install auto-penciled onto its tech's best-fit day ${fmtD(addBD(d.eta,2))} (ETA + 2 business days) — see the board`);poDraft=null;render()};
    $('#poeta').onchange=e=>poDraft.eta=e.target.value;$('#poship').onchange=e=>poDraft.shipTo=e.target.value;$('#pocancel').onclick=()=>{poDraft=null;renderOrder()};$('#poexport').onclick=()=>toast(`${poDraft.sup} order sheet downloaded in their upload format (${poDraft.lines.length} lines)`)}
}
function poHTML(d){const late=(new Date(d.eta)-NOW)/864e5>10;return `<div class="po"><label>PO number<b class="mono">${d.num}</b></label><label>Order date<b>${NOW.toLocaleDateString()}</b></label>
  <label>Expected arrival<input type="date" id="poeta" value="${d.eta}"></label><label>Ship to<select id="poship"><option value="shop" ${d.shipTo==='shop'?'selected':''}>Shop (Dripping Springs)</option><option value="customer" ${d.shipTo==='customer'?'selected':''}>Customer (SO4H)</option></select></label>
  <div class="full" style="font-size:.78rem;color:var(--muted)">${d.lines.map(l=>`${l.p.pn} ×${l.p.qty} · ${esc(l.j.cust)}`).join(' · ')}</div>
  ${late?'<div class="full banner warn">ETA is more than 10 days out — jobs will be set to SO4B and customers get a delay notice.</div>':''}
  <div class="full acts"><button class="sm" id="poexport">Export supplier order sheet</button><span style="flex:1"></span><button class="sm" id="pocancel">Cancel</button><button class="primary" id="place">Place PO → ${late?'SO4B':'SO4'}</button></div></div>`}
/* ---------- RECEIVING ---------- */
const BINS=['SV02','SV03','SV05','SV06','SV07','SV08','SV09','SV10'];let binI=0;
function renderReceive(){
  J.forEach(j=>{if(!j.pencil){const pn=pencilFor(j);if(pn)j.pencil=pn}});
  const jobs=J.filter(j=>['SO4','SO4PRE','SO4B','SO4H'].includes(j.st)).sort((a,b)=>new Date(a.eta)-new Date(b.eta));
  $('#v-receive').innerHTML=`<div class="intro"><h2>Receiving</h2><p>Scan or type a part number or PO as boxes come in. When every part for a job is in, the job moves to SO5 and the customer is texted to pick an install time with their tech. A held SO4PRE date confirms itself if the part beat it. Every other SO4 is <b>penciled</b> onto its tech's best-fit day two business days after the ETA (dashboard-only — ePASS still says SO4); the pencil moves when the ETA moves, and it is the first date the customer is offered when the part checks in.</p></div>
  <div class="scan"><input id="scan" placeholder="Scan part number or PO…  (try 4200500 or PO-4471)" autocomplete="off"><button class="primary" id="scanbtn">Check in</button></div>
  ${J.filter(j=>j.st==='SO4PRE'&&j.parts.some(p=>!p.received)&&!j.holdWait).map(j=>`<div class="task"><div><h4>Held install ${esc(j.held)} · part not in — check ETA</h4><p>${esc(j.cust)} · <span class="mono">${j.sv}</span> · ${j.parts.filter(p=>!p.received).map(p=>esc(p.name)+' ('+p.supplier+', '+j.po+')').join(', ')} was expected ${j.eta.slice(5).replace('-','/')}. Two-day check for Kezia: the auto-confirm text will <b>not</b> go out while this is open. If nothing changes by 2 pm today the hold releases itself and the customer gets the apology text.</p></div>
    <div class="acts"><button class="sm" data-hold="${j.sv}:here">Part is here</button><button class="sm" data-hold="${j.sv}:eta">New ETA — release hold</button><button class="sm" data-hold="${j.sv}:wait">Wait</button></div></div>`).join('')}
  <div class="grid">${jobs.map(j=>{const got=j.parts.filter(p=>p.received).length,n=j.parts.length;const due=new Date(j.eta)<=NOW;
    return `<div class="card ${j.st==='SO4PRE'?'field':''}"><div class="hd"><div><b>${esc(j.cust)}</b><div class="sub">${esc(j.unit)} · ${TECH[j.tech]} · <span class="mono">${j.sv}</span></div></div><div class="age ${j.st==='SO4B'?'old':''}"><b>${j.eta.slice(5).replace('-','/')}</b>${due?'expected today':'expected'}</div></div>
    <div class="chips"><span class="chip st ${j.st}">${j.st}</span><span class="chip">${j.po}</span><span class="chip ${got===n?'ok':got?'warn':''}">${got} of ${n} received</span>${j.st==='SO4PRE'?`<span class="chip SO4PRE">Install held ${j.held} — confirms on check-in</span>`:''}${j.st==='SO4B'?'<span class="chip bad">Backorder — customer notified</span>':''}${j.pencil&&j.st!=='SO4PRE'?`<span class="chip SO4" title="${esc(j.pencil.why)}">✎ penciled ${fmtD(j.pencil.day)} · ${TECH[j.pencil.tech]} — first date the customer will see</span>`:''}</div>
    <div class="tw"><table><tbody>${j.parts.map((p,i)=>`<tr><td>${esc(p.name)}<div class="pn">${p.pn} · ${p.supplier}</div></td><td class="r">${p.received?`<span class="chip ok">✓ in</span> <span class="bin">${p.bin}</span>`:`<button class="sm" data-rcv="${j.sv}:${i}">Check in</button>`}</td></tr>`).join('')}</tbody></table></div></div>`}).join('')||'<div class="empty">Nothing on order.</div>'}</div>`;
  document.querySelectorAll('[data-rcv]').forEach(b=>b.onclick=()=>{const [sv,i]=b.dataset.rcv.split(':');receive(J.find(x=>x.sv===sv),+i)});
  $('#scanbtn').onclick=doScan;$('#scan').onkeydown=e=>{if(e.key==='Enter')doScan()};
  document.querySelectorAll('[data-hold]').forEach(b=>b.onclick=()=>{const [sv,act]=b.dataset.hold.split(':');const j=J.find(x=>x.sv===sv);
    if(act==='here'){j.parts.forEach((p,i)=>{if(!p.received)receive(j,i)});return}
    if(act==='wait'){j.holdWait=true;toast(`${j.cust}: waiting — Kezia rechecks at 2 pm; the hold releases itself if the part still isn't in`,'warn');render();return}
    const held=j.held;j.st='SO4';j.eta='2026-09-18';delete j.held;
    SYNC.unshift({id:SYNC.length+1,sv:j.sv,cust:j.cust,fields:{status:'SO4',date:'',tech:j.tech},created:NOW.toISOString(),state:'pending',note:`Hold ${held} released — part not in (ePASS "time out"). New ETA 9/18. Customer texted apology + re-pick link.`});
    toast(`${j.cust}: hold ${held} released → SO4. Text sent: "We're sorry — the part for your washer hasn't arrived in time for Tuesday, so we've released that appointment… now expected Fri 9/18. Pick a new install time: {link}" · Demitrius's Tue route loses the stop · packet queued for ePASS`,'warn');render()});
}
function doScan(){const q=$('#scan').value.trim().toUpperCase();if(!q)return;let hit=false;J.forEach(j=>{if(!['SO4','SO4PRE','SO4B','SO4H'].includes(j.st))return;j.parts.forEach((p,i)=>{if(!p.received&&(p.pn.toUpperCase()===q||(j.po||'').toUpperCase()===q)){receive(j,i);hit=true}})});if(!hit)toast('No open PO line matches that — check the label','warn');$('#scan').value=''}
function receive(j,i){const p=j.parts[i];p.received=true;p.bin=j.parts.find(x=>x.bin)?.bin||BINS[binI++%BINS.length];
  if(j.parts.every(x=>x.received)){if(j.st==='SO4PRE'){j.st='SO6';toast(`${j.cust}: all parts in · held ${j.held} confirmed → SO6 · customer texted "your part arrived, ${j.held} is confirmed" · bin ${p.bin}`);SYNC.push({id:SYNC.length+1,sv:j.sv,cust:j.cust,fields:{status:'SO6',date:'9/15/2026',tech:j.tech},created:NOW.toISOString(),state:'pending',summary:`Parts in bin ${p.bin}`})}
    else{j.st='SO5';toast(`${j.cust}: all parts in → SO5 · customer texted "pick your install time" (${TECH[j.tech]}'s openings) · bin ${p.bin}`);SYNC.push({id:SYNC.length+1,sv:j.sv,cust:j.cust,fields:{status:'SO5',date:'',tech:j.tech},created:NOW.toISOString(),state:'pending',summary:`Parts in bin ${p.bin}`})}}
  else toast(`${j.cust}: ${p.name} checked in to ${p.bin} · ${j.parts.filter(x=>x.received).length} of ${j.parts.length}`);render()}
/* ---------- SYNC ---------- */
function packet(s){const f=s.fields;let t=`${s.sv}  ${s.cust}\nSTATUS: ${f.status}${f.date?`   DATE: ${f.date}`:''}${f.window?`   WINDOW: ${f.window}`:''}   TECH: ${f.tech}`;if(s.lines){t+='\nLINES:';s.lines.forEach(l=>t+=`\n  ${l[0].padEnd(12)} ${l[1]}  x${l[2]}  ${money(l[3])}`)}if(s.summary)t+=`\nNOTE: ${s.summary}`;if(s.note&&!s.summary)t+=`\nNOTE: ${s.note}`;return t}
function renderSync(){
  const order={disc:0,pending:1,keyed:2,confirmed:3};const list=[...SYNC].sort((a,b)=>order[a.state]-order[b.state]||new Date(a.created)-new Date(b.created));
  const c=s=>SYNC.filter(x=>x.state===s).length;
  $('#v-sync').innerHTML=`<div class="intro"><h2>ePASS sync queue</h2><p>Every dashboard transition writes a paste-ready packet here. Key it into ePASS, tap <i>Keyed</i>, and the next DispatchTrack import (every 15 min) confirms it automatically. If ePASS disagrees two imports in a row, it becomes a discrepancy. Techs never touch ePASS; nobody re-types notes.</p></div>
  <div class="synchead"><span>Last import <b>${new Date(lastImport).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</b> · DispatchTrackDetail_20260914_091502.csv</span><span><b>${c('pending')}</b> to key</span><span><b>${c('keyed')}</b> awaiting confirmation</span><span style="color:var(--bad)"><b>${c('disc')}</b> discrepancies</span><span><b>${c('confirmed')}</b> confirmed today</span><span style="flex:1"></span><button class="sm" id="runimport">Simulate next import</button></div>
  <div class="grid">${list.map(s=>`<div class="card ${s.state==='confirmed'?'done':''}" style="border-left-color:${s.state==='disc'?'var(--bad)':s.state==='confirmed'?'var(--inst)':s.state==='keyed'?'var(--held)':'var(--wait)'}">
    <div class="hd"><div><b>${esc(s.cust)}</b> <span class="mono" style="color:var(--muted);font-size:.8rem">${s.sv}</span><div class="sub">created ${ago(s.created)} ago${s.keyedAt?` · keyed ${ago(s.keyedAt)} ago by ${s.keyedBy}`:''}${s.confirmedAt?` · confirmed by import ${new Date(s.confirmedAt).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}`:''}</div></div><span class="state ${s.state}">${{pending:'To key',keyed:'Keyed · awaiting import',confirmed:'Confirmed',disc:'Discrepancy'}[s.state]}</span></div>
    ${s.state==='disc'?`<div class="disc"><span class="h"></span><span class="h">Dashboard</span><span class="h">ePASS (import ${new Date(s.detected).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})})</span>${Object.keys(s.fields).filter(k=>s.fields[k]).map(k=>`<span style="color:var(--muted)">${k}</span><span class="mono" style="${s.fields[k]!==s.epass[k]?'font-weight:600':''}">${s.fields[k]}</span><span class="mono" style="${s.fields[k]!==s.epass[k]?'font-weight:600':''}">${s.epass[k]||'—'}</span>`).join('')}</div><div class="banner" style="font-size:.8rem">${esc(s.note||'')}</div>
      <div class="acts"><button class="sm" data-reissue="${s.id}">Re-issue — dashboard is right, key it again</button><button class="sm" data-accept="${s.id}">Accept ePASS value into dashboard</button></div>`:
    `<div class="packet">${esc(packet(s))}</div>
     <div class="acts">${Object.entries(s.fields).filter(([k,v])=>v).map(([k,v])=>`<button class="sm" data-copy="${esc(v)}">Copy ${k}</button>`).join('')}${s.lines?`<button class="sm" data-copy="${esc(s.lines.map(l=>l.join('\t')).join('\n'))}">Copy lines</button>`:''}<button class="sm" data-copy="${esc(packet(s))}">Copy packet</button><span style="flex:1"></span>${s.state==='pending'?`<button class="primary" data-keyed="${s.id}">Keyed in ePASS</button>`:''}${s.state==='keyed'?'<span style="font-size:.75rem;color:var(--muted)">auto-closes when the import shows it</span>':''}</div>`}</div>`).join('')}</div>`;
  document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{navigator.clipboard?.writeText(b.dataset.copy).catch(()=>{});toast('Copied')});
  document.querySelectorAll('[data-keyed]').forEach(b=>b.onclick=()=>{const s=SYNC.find(x=>x.id==b.dataset.keyed);s.state='keyed';s.keyedAt=NOW.toISOString();s.keyedBy='You';renderSync();renderTabs()});
  document.querySelectorAll('[data-reissue]').forEach(b=>b.onclick=()=>{const s=SYNC.find(x=>x.id==b.dataset.reissue);s.state='pending';delete s.epass;toast(`${s.cust}: sync item re-issued`);render()});
  document.querySelectorAll('[data-accept]').forEach(b=>b.onclick=()=>{const s=SYNC.find(x=>x.id==b.dataset.accept);Object.assign(s.fields,s.epass);s.state='confirmed';s.confirmedAt=NOW.toISOString();const j=J.find(x=>x.sv===s.sv);if(j)j.st=s.epass.status;toast(`${s.cust}: dashboard now matches ePASS (${s.epass.status}) — logged as manual override`,'warn');render()});
  $('#runimport').onclick=()=>{lastImport=new Date(NOW.getTime()+15*6e4).toISOString();let n=0;SYNC.forEach(s=>{if(s.state==='keyed'){s.state='confirmed';s.confirmedAt=lastImport;n++}});
    const stray=SYNC.find(s=>s.sv==='SV00123388'&&s.state==='confirmed'&&!s.strayed);if(stray){stray.strayed=true;SYNC.push({id:SYNC.length+1,sv:'SV00123388',cust:'Brandon Cox',fields:{status:'SO1',date:'9/14/2026',tech:'TDP'},epass:{status:'SO1',date:'9/16/2026',tech:'TDP'},created:lastImport,detected:lastImport,state:'disc',note:'Changed in ePASS without a dashboard event — someone moved the date directly in Routing. Accept it, or re-issue so ePASS is put back.'})}
    toast(`Import processed: ${n} keyed item(s) confirmed${stray?' · 1 reverse discrepancy detected (ePASS changed on its own)':''}`);render()};
}
render();
</script>

</body></html>
