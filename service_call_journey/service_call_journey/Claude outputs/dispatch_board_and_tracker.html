<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head><body style="margin:0">
<title>Wilson Dispatch Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#f3f6f3;--surface:#ffffff;--surface2:#eaf0ea;--ink:#1b241f;--muted:#5d6b62;--line:#d7dfd8;--accent:#1f6b35;--accent-ink:#fff;--soft:#e3eee5;
--diag:#2f6fb3;--diag-bg:#e7eff9;--inst:#1f8a48;--inst-bg:#e3f3e8;--held:#0f8a8a;--held-bg:#e0f3f3;--war:#7a4fb3;--war-bg:#efe8f8;--wait:#b8770f;--wait-bg:#fbf0d9;--bad:#b3362f;--bad-bg:#fbe4e2;--colA:#1f6b35;--colB:#2f6fb3}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111714;--surface:#1a221d;--surface2:#212b25;--ink:#e6ece7;--muted:#9aa89e;--line:#2c372f;--accent:#5fb87a;--accent-ink:#0f1a13;--soft:#1f2c23;
--diag:#7fb0e6;--diag-bg:#1c2a3a;--inst:#6ccb8a;--inst-bg:#1a3324;--held:#5fc9c9;--held-bg:#173232;--war:#b596e6;--war-bg:#2a2138;--wait:#e2b25a;--wait-bg:#3a2e14;--bad:#ef8b84;--bad-bg:#3d1f1d;--colA:#5fb87a;--colB:#7fb0e6}}
:root[data-theme="dark"]{--bg:#111714;--surface:#1a221d;--surface2:#212b25;--ink:#e6ece7;--muted:#9aa89e;--line:#2c372f;--accent:#5fb87a;--accent-ink:#0f1a13;--soft:#1f2c23;
--diag:#7fb0e6;--diag-bg:#1c2a3a;--inst:#6ccb8a;--inst-bg:#1a3324;--held:#5fc9c9;--held-bg:#173232;--war:#b596e6;--war-bg:#2a2138;--wait:#e2b25a;--wait-bg:#3a2e14;--bad:#ef8b84;--bad-bg:#3d1f1d;--colA:#5fb87a;--colB:#7fb0e6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "IBM Plex Sans",system-ui,sans-serif;padding-inline:16px;padding-block:0 3rem}
.mono{font-family:"IBM Plex Mono",monospace}
button{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.4rem .75rem;cursor:pointer}
button:hover{border-color:var(--accent)}button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
select,input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.4rem .6rem}
.top{display:flex;align-items:center;gap:1.25rem;flex-wrap:wrap;padding-block:.9rem;border-bottom:1px solid var(--line);max-width:1400px;margin:0 auto}
.brand{font-weight:600;letter-spacing:.01em}.brand small{display:block;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
.tabs{display:flex;gap:.25rem;background:var(--surface2);padding:.25rem;border-radius:8px}
.tabs button{border:0;background:transparent;padding:.4rem .9rem;border-radius:6px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.proto{margin-left:auto;font-size:.75rem;color:var(--muted)}.proto b{color:var(--wait);font-weight:600}
main{max-width:1400px;margin:0 auto}
.view[hidden]{display:none}
/* ---------- board ---------- */
.strip{display:grid;grid-template-columns:150px repeat(5,1fr) auto;gap:4px;align-items:center;margin-block:1rem .75rem;font-size:.78rem}
.strip .h{color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:.68rem}
.strip .name{font-weight:500}
.cell{height:26px;border-radius:4px;background:var(--surface2);position:relative;overflow:hidden;cursor:pointer;border:1px solid transparent}
.cell i{position:absolute;inset:0 auto 0 0;background:var(--inst);opacity:.55}
.cell.hot i{background:var(--bad)}.cell.warm i{background:var(--wait)}
.cell span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:500}
.cell.onA{border-color:var(--colA);box-shadow:inset 0 0 0 1px var(--colA)}.cell.onB{border-color:var(--colB);box-shadow:inset 0 0 0 1px var(--colB)}
.striptools{display:flex;gap:.4rem;align-items:center;color:var(--muted)}
.striptools button{padding:.2rem .5rem;font-size:.75rem}.striptools button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.board{display:grid;grid-template-columns:1fr 1fr 320px;gap:.9rem;align-items:start}
@media (max-width:1100px){.board{grid-template-columns:1fr 1fr}.side{grid-column:1/-1}}
@media (max-width:720px){.board{grid-template-columns:1fr}.strip{grid-template-columns:90px repeat(5,1fr)}.striptools{grid-column:1/-1}}
.col{background:var(--surface);border:1px solid var(--line);border-radius:8px;border-top:3px solid var(--colA);min-height:400px;display:flex;flex-direction:column}
.col.b{border-top-color:var(--colB)}
.colhead{padding:.7rem .8rem;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:.5rem}
.colhead .row{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.colhead select{flex:1;min-width:120px}
.stats{display:flex;gap:1rem;font-size:.78rem;color:var(--muted);flex-wrap:wrap}.stats b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.cap{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;display:flex}
.cap i{display:block;height:100%}.cap .w{background:var(--accent)}.cap .d{background:var(--muted);opacity:.5}
.stops{padding:.5rem;display:flex;flex-direction:column;gap:.4rem;flex:1;min-height:120px}
.stops.over{background:var(--soft)}
.leg{font-size:.72rem;color:var(--muted);display:flex;align-items:center;gap:.4rem;padding:0 .4rem}.leg::before,.leg::after{content:"";flex:1;border-top:1px dashed var(--line)}
.card{border:1px solid var(--line);border-left:4px solid var(--diag);border-radius:6px;padding:.5rem .6rem;background:var(--surface);cursor:grab;display:grid;grid-template-columns:auto 1fr auto;gap:.15rem .6rem;align-items:start;position:relative}
.card:active{cursor:grabbing}.card.dragging{opacity:.4}
.card.SO6{border-left-color:var(--inst)}.card.SO4{border-left-color:var(--held);border-style:dashed;background:var(--held-bg)}.chip.SO4,.chip.pencil{background:var(--held-bg);color:var(--held)}
.suggest{grid-column:1/-1;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;font-size:.75rem;color:var(--ink);background:var(--soft);border-radius:6px;padding:.35rem .5rem;margin-top:.2rem}.suggest b{color:var(--accent)}.suggest .why{color:var(--muted)}.suggest button{padding:.15rem .5rem;font-size:.72rem;margin-left:auto}
.rec{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;border:1.5px solid var(--accent);background:var(--soft);border-radius:8px;padding:.6rem .8rem;margin-bottom:.7rem}.rec .lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:600}.rec .d{font-weight:600}.rec .why{font-size:.78rem;color:var(--muted);flex:1 1 100%}.rec .slot{width:auto;margin:0;padding:.4rem .9rem;font-weight:600;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.card.SO4PRE{border-left-color:var(--held);border-left-style:dashed}.card.WAR{border-left-color:var(--war)}.card.SO5,.card.REQ{border-left-color:var(--wait)}
.card .seq{font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted);grid-row:1/3;padding-top:.1rem}
.card .who{font-weight:600}.card .sub{color:var(--muted);font-size:.78rem;grid-column:2}
.card .time{font-variant-numeric:tabular-nums;font-size:.78rem;text-align:right;color:var(--muted);white-space:nowrap}.card .time b{display:block;color:var(--ink);font-size:.85rem}
.card .time.late b{color:var(--bad)}
.chips{grid-column:2/4;display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.2rem}
.chip{font-size:.68rem;padding:.05rem .4rem;border-radius:10px;background:var(--surface2);color:var(--muted);font-weight:500;letter-spacing:.02em}
.chip.st{font-family:"IBM Plex Mono",monospace}
.chip.SO1{background:var(--diag-bg);color:var(--diag)}.chip.SO6{background:var(--inst-bg);color:var(--inst)}.chip.SO4PRE{background:var(--held-bg);color:var(--held)}.chip.WAR{background:var(--war-bg);color:var(--war)}.chip.SO5,.chip.REQ{background:var(--wait-bg);color:var(--wait)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.warn{background:var(--wait-bg);color:var(--wait)}.chip.ok{background:var(--inst-bg);color:var(--inst)}
.pin{grid-column:3;grid-row:2;justify-self:end;border:0;background:transparent;padding:0 .2rem;font-size:.85rem;color:var(--muted);line-height:1}.pin[aria-pressed="true"]{color:var(--accent)}
.card .more{grid-column:1/4;display:none;font-size:.78rem;color:var(--muted);border-top:1px dashed var(--line);margin-top:.35rem;padding-top:.35rem}
.card.open .more{display:block}.more .acts{display:flex;gap:.3rem;margin-top:.35rem;flex-wrap:wrap}.more button{padding:.2rem .5rem;font-size:.75rem}
.ph{height:3px;background:var(--accent);border-radius:2px;margin:.1rem .3rem}
.side{display:flex;flex-direction:column;gap:.9rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.panel h3{margin:0;padding:.65rem .8rem;border-bottom:1px solid var(--line);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;display:flex;justify-content:space-between}
.panel h3 span{font-variant-numeric:tabular-nums}
.unsched .stops{max-height:360px;overflow:auto}
.map svg{display:block;width:100%;height:auto}
.maplegend{display:flex;gap:.9rem;padding:.4rem .8rem .6rem;font-size:.72rem;color:var(--muted)}.maplegend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:.3rem;vertical-align:-1px}
.toasts{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:.4rem;z-index:9}
.toast{background:var(--ink);color:var(--bg);padding:.5rem .9rem;border-radius:6px;font-size:.82rem;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.toast.warn{background:var(--wait)}.toast.bad{background:var(--bad);color:#fff}
/* ---------- tracker ---------- */
.trk{max-width:560px;margin:1.5rem auto 0}
.look{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1.25rem}
.look h2,.job h2{margin:0 0 .25rem;font-size:1.3rem;font-weight:600;text-wrap:balance}
.look p{color:var(--muted);margin:.25rem 0 1rem}
.look form{display:grid;gap:.6rem}.look label{font-size:.8rem;font-weight:500;color:var(--muted);display:block;margin-bottom:.2rem}.look select{width:100%;padding:.6rem .7rem}.look input{width:100%;padding:.6rem .7rem}
.samples{font-size:.78rem;color:var(--muted);margin-top:.9rem}.samples button{padding:.15rem .5rem;font-size:.75rem;margin:.15rem .15rem 0 0}
.job{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.jobhead{padding:1.1rem 1.25rem .9rem;border-bottom:1px solid var(--line)}
.jobhead .sv{color:var(--muted);font-size:.8rem}.jobhead .unit{color:var(--muted);margin-top:.2rem}
.now{margin:1rem 1.25rem;padding:.9rem 1rem;border-radius:8px;background:var(--soft);border-left:4px solid var(--accent)}
.now .lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:600}
.now .big{font-size:1.1rem;font-weight:600;margin:.15rem 0}.now p{margin:.3rem 0 0;color:var(--muted);font-size:.9rem}
.stages{list-style:none;margin:0;padding:.25rem 1.25rem 1rem}
.stages li{display:grid;grid-template-columns:22px 1fr auto;gap:0 .7rem;align-items:start;padding:.45rem 0;position:relative}
.stages li::before{content:"";position:absolute;left:10px;top:28px;bottom:-6px;border-left:2px solid var(--line)}
.stages li:last-child::before{display:none}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:.7rem;font-weight:600;color:var(--muted)}
li.done .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
li.cur .dot{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--soft)}
li.done::before{border-color:var(--accent)!important}
.stages .t{font-weight:500}.stages li:not(.done):not(.cur) .t{color:var(--muted)}
.stages .d{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.stages .note{grid-column:2/4;font-size:.82rem;color:var(--muted)}
.acts2{display:flex;gap:.5rem;flex-wrap:wrap;padding:0 1.25rem 1.25rem}
.picker{margin:0 1.25rem 1.25rem;border:1px solid var(--line);border-radius:8px;padding:.9rem 1rem}
.picker h4{margin:0 0 .2rem;font-size:.95rem}.picker p{margin:0 0 .7rem;color:var(--muted);font-size:.85rem}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:.4rem}
.day{font-size:.72rem;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.05em}
.day b{display:block;color:var(--ink);font-size:.9rem}
.slot{width:100%;padding:.45rem .2rem;font-size:.78rem;margin-top:.3rem}
.slot[disabled]{opacity:.4;cursor:not-allowed;text-decoration:line-through}
.slot.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.faq{margin:1rem 1.25rem 1.25rem;font-size:.85rem;color:var(--muted)}.faq b{color:var(--ink)}
.back{margin:.75rem 0;font-size:.85rem}
.back button{border:0;background:none;color:var(--accent);padding:0;font-weight:500}
@media (prefers-reduced-motion:no-preference){.card,.cell{transition:box-shadow .12s,opacity .12s}}
/* ---------- 9/11 feedback additions ---------- */
.strip .name button{border:0;background:none;padding:0;color:var(--ink);font-weight:500;text-align:left;cursor:pointer;text-decoration:underline dotted var(--line);text-underline-offset:3px}
.strip .name button:hover{color:var(--accent)}
.cell.closed{background:repeating-linear-gradient(45deg,var(--surface2),var(--surface2) 4px,var(--bg) 4px,var(--bg) 8px)}.cell.closed span{color:var(--muted);font-weight:400}
.cell.over i{background:var(--bad)}.cell .menu{position:absolute;right:2px;top:1px;font-size:.8rem;line-height:1;color:var(--muted);opacity:0;padding:0 .15rem;border-radius:3px}
.cell:hover .menu,.cell:focus-within .menu{opacity:1}.cell .menu:hover{background:var(--surface);color:var(--ink)}
.pop{position:absolute;z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:.6rem .7rem;min-width:250px;font-size:.82rem}
.pop h4{margin:0 0 .4rem;font-size:.8rem}.pop h4 small{display:block;color:var(--muted);font-weight:400}
.pop .grp{display:flex;gap:.3rem;flex-wrap:wrap;margin:.3rem 0}.pop button{padding:.3rem .55rem;font-size:.78rem}.pop .lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:.5rem}
.pop select,.pop input{padding:.3rem .4rem;font-size:.78rem}.pop .x{position:absolute;right:.4rem;top:.3rem;border:0;background:none;color:var(--muted);font-size:1rem;padding:0 .2rem}
.cal{width:252px}.cal .calhead{display:flex;justify-content:space-between;align-items:center;font-weight:600;margin-bottom:.3rem}.cal .calhead button{padding:.1rem .45rem}
.cal .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}.cal .dow{font-size:.62rem;color:var(--muted);text-align:center;text-transform:uppercase}
.cal .d{height:30px;border:1px solid transparent;border-radius:4px;background:var(--surface2);font-size:.72rem;position:relative;padding:0;color:var(--ink)}
.cal .d i{position:absolute;left:0;bottom:0;height:4px;background:var(--inst);opacity:.7;border-radius:0 0 4px 4px}.cal .d.hot i{background:var(--bad)}.cal .d.warm i{background:var(--wait)}
.cal .d.closed{background:repeating-linear-gradient(45deg,var(--surface2),var(--surface2) 3px,var(--bg) 3px,var(--bg) 6px);color:var(--muted)}
.cal .d.today{border-color:var(--accent)}.cal .d.sel{background:var(--accent);color:var(--accent-ink)}.cal .d.wkend{opacity:.35}.cal .d.trip::after{content:"";position:absolute;right:3px;top:3px;width:5px;height:5px;border-radius:50%;background:var(--held)}
.cal .d.pad{visibility:hidden}
.daybtn{flex:1;min-width:120px;text-align:left;display:flex;justify-content:space-between;align-items:center}
.block{border:1px dashed var(--line);border-radius:6px;padding:.4rem .6rem;background:var(--surface2);color:var(--muted);font-size:.8rem;display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.block b{color:var(--ink);font-weight:500}.block button{border:0;background:none;padding:0 .2rem;color:var(--muted)}
.money{padding:.5rem .8rem;border-top:1px solid var(--line);font-size:.78rem;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:.3rem}.money b{color:var(--ink);font-variant-numeric:tabular-nums}
.overcap{color:var(--bad);font-weight:600}
.chip.forced{background:var(--bad-bg);color:var(--bad)}.chip.grp{background:var(--war-bg);color:var(--war)}.chip.units{background:var(--surface2);color:var(--ink);font-weight:600}
.cap i.c{background:repeating-linear-gradient(45deg,var(--muted),var(--muted) 3px,transparent 3px,transparent 6px);opacity:.5}
.card.ingrp{border-left-style:double}
.limits{display:grid;grid-template-columns:1fr auto;gap:.25rem .5rem;align-items:center;font-size:.78rem}.limits input{width:64px;padding:.2rem .3rem;font-size:.78rem;text-align:right}.chip.SO4H{background:var(--held-bg);color:var(--held)}.card.SO4H{border-left-color:var(--held)}
.toast .acts{display:inline-flex;gap:.4rem;margin-left:.7rem}.toast .acts button{padding:.1rem .5rem;font-size:.75rem;background:var(--surface);color:var(--ink);border-color:transparent}
.toast.sticky{pointer-events:auto}
.maplegend button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:.05rem .5rem;font-size:.7rem;color:var(--muted)}.maplegend button[aria-pressed="true"]{color:var(--ink);border-color:var(--accent)}.maplegend button[aria-pressed="false"]{opacity:.55;text-decoration:line-through}
.maplegend{flex-wrap:wrap;gap:.35rem}
.prod{margin-top:.9rem}.prod h3 button{border:0;background:none;color:var(--accent);font-weight:600;padding:0}
.prod table{width:100%;border-collapse:collapse;font-size:.8rem}.prod th,.prod td{padding:.35rem .6rem;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}.prod th:first-child,.prod td:first-child{text-align:left}
.prod th{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}.prod tr.total td{font-weight:600;border-top:2px solid var(--line)}.prod .note{padding:.5rem .8rem;font-size:.78rem;color:var(--muted)}
.tw{overflow-x:auto}
/* collector lane ⟨9/15 pm⟩ */
.strip .h.wknav{display:flex;align-items:center;gap:.25rem;text-transform:none;letter-spacing:0;font-size:.72rem;color:var(--ink);font-weight:500}
.strip .h.wknav button{border:1px solid var(--line);background:var(--surface);border-radius:5px;width:20px;height:20px;line-height:1;cursor:pointer;color:var(--ink);font-size:.85rem;padding:0}
.strip .h.wknav button:hover{border-color:var(--accent);color:var(--accent)}
.strip .h.wknav span{white-space:nowrap}
.whobtn{border:0;background:none;padding:0;font:inherit;font-weight:600;color:var(--ink);cursor:pointer;text-align:left;text-decoration:underline dotted var(--line);text-underline-offset:3px}
.whobtn:hover{color:var(--accent)}
.chip.pastchip{cursor:pointer}.chip.pastchip:hover{outline:1px solid var(--accent)}
.dnsline{background:var(--bad-bg);border-left:3px solid var(--bad);border-radius:5px;padding:.45rem .6rem;margin:.4rem 0;font-size:.76rem;line-height:1.45;grid-column:1/-1}
.sameunit{background:var(--wait-bg);border-left:3px solid var(--wait);border-radius:6px;padding:.55rem .7rem;margin:.6rem 0;font-size:.82rem;line-height:1.5}
ul.pastunits{list-style:none;margin:0;padding:0;font-size:.82rem}
ul.pastunits li{padding:.4rem 0;border-bottom:1px solid var(--line)}
ol.pasthist{list-style:none;margin:0;padding:0}
ol.pasthist li{display:grid;grid-template-columns:86px 1fr auto;gap:.5rem;padding:.4rem 0;border-bottom:1px solid var(--line);font-size:.82rem;align-items:baseline}
ol.pasthist .amt{text-align:right;font-variant-numeric:tabular-nums}
.lanecell{display:flex;flex-direction:column;gap:3px;align-items:stretch;text-align:left;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:.35rem .5rem;cursor:pointer;font:inherit;font-size:.72rem;color:var(--ink)}
.lanecell:hover{border-color:var(--accent)}
.lanecell .lanehead{font-variant-numeric:tabular-nums}

function optimize(k){

function createRequest(j,slot){const sv='SV00123'+(seq++);const first=$('#fn').value||'Customer',last=$('#ln').value||'';const zi=zinfo(j.zip);
  const job={sv,cust:`${last}, ${first}`,addr:'(new request)',zip:j.zip,st:'REQ',type:j.type,unit:`${$('#appl').value} · ${$('#prob').value}`,dur:j.dur,win:null,bal:'',tech:null,day:null,seq:0,pref:$('#pref').value};

function renderJob(sv){
  const t=TRK[sv],j=J.find(x=>x.sv===sv);if(!t){toast('That job has no customer view in the prototype','warn');return}
  const tech=j&&j.tech?techById(j.tech):null;
  let now='',picker='',acts='';
  if(t.detail==='so1'){now=`<div class="lbl">Next up</div><div class="big">${j.tech?`Diagnostic visit ${dayObj(j.day).s}, ${dayObj(j.day).n} · ${j.win==='AM'?'8 AM – 12 PM':'12 – 5 PM'}`:'Request received — pick your diagnostic time'}</div><p>${tech?`${tech.name.split(' ')[0]} is your technician. You'll get a text when he's on the way.`:'Pick a window below and we\'ll confirm by text.'} Please clear access to the unit and have the model tag visible.</p>`;

  if(t.detail==='so4h'){now=`<div class="lbl">Right now</div><div class="big">Your part is shipping straight to you · expected ${t.eta}</div><p>${t.carrier}. GE ships this part to your door instead of our shop. <b>Tap the button below the moment it arrives</b> and you'll pick an install time with ${j&&j.owner?techById(j.owner).name.split(' ')[0]:'your technician'} right away. If we haven't heard from you the day after it's due, we'll text to check.</p>`;
    acts=`<button class="primary" data-act="received">📦 My part arrived</button>`}
  if(t.detail==='so5'){if(j&&j.tech&&!j.pencil){now=`<div class="lbl">Confirmed</div><div class="big">Install ${dayObj(j.day).s}, ${dayObj(j.day).n} · ${j.win==='AM'?'8 AM – 12 PM':'12 – 5 PM'}</div><p>${tech.name.split(' ')[0]} will bring your part and finish the repair. Your card on file is charged only after the work is complete.</p>`;acts=`<button data-act="resched">Reschedule</button>`}
    else{const atHome=j&&j.unit.includes('received by customer');now=`<div class="lbl">Action needed</div><div class="big">${atHome?'Great — your part is there. Pick an install time':'Your part arrived — pick an install time'}</div><p>${atHome?`${techById(j.owner).name.split(' ')[0]} will bring the tools and finish the repair; please keep the part boxed until he arrives.`:'Your part checked in at our shop.'} Choose a window below and it's confirmed instantly.</p>`;picker=pickerHTML(j)}}

    if(i===5&&t.detail==='so4')note=`<div class="note">Expected ${t.eta}</div>`;if(i===5&&t.detail==='so4h')note=`<div class="note">Shipping to you · expected ${t.eta} · tap “My part arrived” when it's there</div>`;if(i===7&&t.detail==='so4'&&j&&j.st==='SO4PRE')note=`<div class="note">Held for ${dayObj(j.day).s}, ${dayObj(j.day).n} — confirms when part arrives</div>`;

const TODAY='2026-09-15';
function pickerHTML(j){
  const el=eligible(j);const resched=!!j.day&&!j.pencil;const zi=zinfo(j.zip);
  if(zi.mode==='office_only'&&!j.owner)return `<div class="picker" id="picker"><h4>We'll call you to schedule</h4><p>${zi.group==='Unclassified'?'Your area':zi.group} is outside our regular routes, so Client Care will call within one business day to find a time that works. Nothing else is needed from you right now.</p></div>`;
  const near=resched&&((new Date(j.day+'T08:00')-new Date(TODAY+'T17:00'))/36e5<48);
  const rec=(!resched&&!zi.trip)?bestFit(j,j.eta?addBD(j.eta,1):null):null;const pen=j.pencil&&j.tech?{tech:j.tech,day:j.day,win:j.win,why:'we already have your installer nearby that day'}:null;const top=pen||rec;
  let h=`<div class="picker" id="picker"><h4>${resched?(near?'Change within 48 hours':'Pick a new day'):'Pick an arrival window'}</h4>${top&&isOpen(top.tech,top.day)?`<div class="rec"><span class="lbl">${pen?'Best fit — installer already nearby':top.day===top.earliest?(top.same?'Earliest available — and our route is already in your area':'Earliest available'):top.same?'Best fit — our route is already in your area':'Best fit — closest to our route'}</span><span class="d">${dayObj(top.day).s}, ${dayObj(top.day).n} · ${top.win==='AM'?'8 AM – 12 PM':'12 – 5 PM'}</span><button class="slot" data-day="${top.day}" data-win="${top.win}" data-tech="${top.tech}">Take this window</button><span class="why">${pen?`${techById(top.tech).name.split(' ')[0]} is already working near you that day, so this is the quickest we can get your part installed.`:top.same?`Our technician is already in your area that day — picking it means less driving for us and a tighter arrival window for you.`:`Closest fit to our routes this week.`} All other openings are below.</span></div>`:''}<p>${zi.trip?(openTrip(zi.group)?`We group visits in ${zi.group==='West'?'the Hill Country west of us':'your area'} so we can get to you efficiently. Our next trip is <b>${dayObj(openTrip(zi.group).day).s}, ${dayObj(openTrip(zi.group).day).n}</b> — pick a window that day.`:`We group visits in your area so we can get to you efficiently. <b>We'll text you a date within a few days.</b> Need it sooner? Message Client Care.`):j.owner?`Showing ${techById(j.owner).name.split(' ')[0]}'s openings — he diagnosed your unit and will finish the repair.`:`Showing openings for technicians who cover ${j.zip}${el.length?` (${el.map(t=>t.name.split(' ')[0]).join(', ')})`:''}.`}${near?' Your visit is soon, so only windows that fit a route already near you are shown.':''} Grey windows are full.</p><div class="days">`;
  for(const d of DAYS){h+=`<div><div class="day">${d.s}<b>${d.n.slice(4)}</b></div>`;for(const w of['AM','PM']){
    let room=el.filter(t=>isOpen(t.id,d.k)&&halfDayLoad(t.id,d.k,w)+j.dur+25<=240).sort((a,b)=>(a.id===zi.p?0:zi.s.includes(a.id)?1:2)-(b.id===zi.p?0:zi.s.includes(b.id)?1:2)||halfDayLoad(a.id,d.k,w)-halfDayLoad(b.id,d.k,w));
    if(near){room=room.filter(t=>jobsFor(t.id,d.k).some(x=>x.sv!==j.sv&&zinfo(x.zip).group===zi.group))}
    const tr=zi.trip?openTrip(zi.group):null;const tripBlock=zi.trip&&(!tr||tr.day!==d.k);const held=(j.eta&&j.eta>=d.k)||(resched&&!near&&j.win&&w!==j.win)||(resched&&d.k===j.day&&w===j.win)||tripBlock;
    h+=`<button class="slot" data-day="${d.k}" data-win="${w}" data-tech="${room[0]?room[0].id:''}" ${room.length&&!held?'':'disabled'} title="${tripBlock?(tr?'not the trip day':'no trip open yet'):held?'part not here yet':room.length?room.length+' tech(s) open':near?'no route near you':el.length&&el.every(t=>!isOpen(t.id,d.k))?'not a working day for your technician':'full'}">${w==='AM'?'8–12':'12–5'}</button>`}h+=`</div>`}
  return h+`</div><p style="margin-top:.6rem">${resched&&!near&&j.win?`Same-week changes keep your ${j.win==='AM'?'8–12':'12–5'} window — pick a different day. `:''}${near?'Nothing fit? <button style="padding:.15rem .5rem;font-size:.8rem">Message Client Care</button> ':''}${j.eta?`Windows before your part's arrival (${j.eta.slice(5).replace('-','/')}) are unavailable. `:''}Confirmation is instant — no call needed.</p></div>`}
function wirePicker(j,sv){document.querySelectorAll('.slot:not([disabled])').forEach(b=>b.onclick=()=>{
  const wasHeld=j.st==='SO4PRE'||(TRK[sv].detail==='so4');
  if(j.tech){jobsFor(j.tech,j.day).filter(x=>x.sv!==sv).forEach((x,i)=>x.seq=i+1)}
  j.tech=b.dataset.tech;j.day=b.dataset.day;j.win=b.dataset.win;const list=jobsFor(j.tech,j.day).filter(x=>x.sv!==sv);const ins=j.win==='AM'?list.filter(x=>x.win==='AM').length:list.length;list.splice(ins,0,j);list.forEach((x,i)=>x.seq=i+1);
  if(TRK[sv].detail==='so4')j.st='SO4PRE';else if(j.st==='SO5'||j.st==='SO6')j.st='SO6';else if(j.st==='REQ')j.st='SO1';delete j.pencil;

document.querySelectorAll('[role=tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[role=tab]').forEach(x=>x.setAttribute('aria-selected',x===b));$('#board').hidden=b.dataset.view!=='board';$('#track').hidden=b.dataset.view!=='track'});
J.filter(j=>j.pencilEta).forEach(j=>{const sg=bestFit(j,addBD(j.eta,2));if(!sg)return;

setupDrops();renderAll();renderLookup();
