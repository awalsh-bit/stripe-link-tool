<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wilson service dashboard · field tool</title></head><body style="margin:0">
<title>Wilson Service Field Tool</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{--wilson-green:#155b26;--wilson-green-dark:#0f471d;--wilson-green-soft:#dcecdf;--wilson-green-pale:#eef6f0;--wilson-lime:#72c681;--ink:#0d1b2a;--muted:#64748b;--muted-2:#8793a4;--line:#d9e3df;--line-strong:#cbd8d1;--card:#ffffff;--bg:#f4f7f5;--danger:#b42318;--danger-bg:#fff0ef;--warning:#9a5b00;--warning-bg:#fff7e7;--info:#245ea8;--info-bg:#eef5ff;--success:#16713a;--success-bg:#eaf7ed;--shadow:0 15px 40px rgba(21,65,40,.09);--shadow-soft:0 8px 24px rgba(21,65,40,.07);--radius-lg:18px;--radius-md:13px;--radius-sm:10px;--sel:#1c3b5c;--sel-bg:#e4edf7;--sel-line:#cbdcef}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--wilson-green:#3f9a57;--wilson-green-dark:#1d5a2e;--wilson-green-soft:#1f3a27;--wilson-green-pale:#182a1d;--ink:#e8eef0;--muted:#9fb0bd;--muted-2:#7d8c98;--line:#2a3a31;--line-strong:#37483e;--card:#151f19;--bg:#0f1712;--danger:#f08b82;--danger-bg:#3a1c19;--warning:#e2b25a;--warning-bg:#3a2e14;--info:#8db5ec;--info-bg:#1b2a3d;--success:#6ccb8a;--success-bg:#1a3324;--shadow:0 15px 40px rgba(0,0,0,.4);--shadow-soft:0 8px 24px rgba(0,0,0,.3);--sel:#b9d3f2;--sel-bg:#1c2c40;--sel-line:#2f4a6b}}
:root[data-theme="dark"]{--wilson-green:#3f9a57;--wilson-green-dark:#1d5a2e;--wilson-green-soft:#1f3a27;--wilson-green-pale:#182a1d;--ink:#e8eef0;--muted:#9fb0bd;--muted-2:#7d8c98;--line:#2a3a31;--line-strong:#37483e;--card:#151f19;--bg:#0f1712;--danger:#f08b82;--danger-bg:#3a1c19;--warning:#e2b25a;--warning-bg:#3a2e14;--info:#8db5ec;--info-bg:#1b2a3d;--success:#6ccb8a;--success-bg:#1a3324;--shadow:0 15px 40px rgba(0,0,0,.4);--shadow-soft:0 8px 24px rgba(0,0,0,.3);--sel:#b9d3f2;--sel-bg:#1c2c40;--sel-line:#2f4a6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;padding-inline:16px;padding-block:12px 110px;-webkit-tap-highlight-color:transparent}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.proto{font-size:12px;color:var(--muted);text-align:center}.proto b{color:var(--warning)}
button{font:inherit;color:inherit;cursor:pointer}
.button{min-height:48px;border-radius:11px;border:0;background:var(--wilson-green);color:#fff;font-weight:800;padding:0 18px;box-shadow:0 5px 14px rgba(21,91,38,.18);width:100%}
.button.secondary{background:var(--wilson-green-pale);color:var(--wilson-green);border:1px solid var(--wilson-green-soft);box-shadow:none}
.button.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.button.danger{background:var(--danger-bg);color:var(--danger);border:1px solid #f3c2bd;box-shadow:none}
.button[disabled]{opacity:.45;cursor:not-allowed}
.button small{display:block;font-weight:600;font-size:12px;opacity:.85}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--wilson-green);outline-offset:2px}
/* banner */
.head{position:relative;background:linear-gradient(135deg,var(--wilson-green-dark),var(--wilson-green));color:#fff;border-radius:22px;padding:18px 20px;box-shadow:0 16px 34px rgba(15,71,29,.18);overflow:hidden}
.head::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;right:-90px;top:-105px;background:rgba(255,255,255,.06)}
.kicker{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.1em;opacity:.85}
.head h1{margin:2px 0 4px;font-size:clamp(22px,6vw,28px);line-height:1.1;font-weight:800;text-wrap:balance}
.head .sub{font-size:14px;opacity:.9}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.pills span{background:rgba(255,255,255,.12);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
.pills span.att{background:rgba(255,196,80,.28)}
.prog{height:8px;border-radius:999px;background:rgba(255,255,255,.18);margin-top:12px;overflow:hidden}.prog span{display:block;height:100%;background:#fff;transition:width .25s ease}
.chipuser{position:absolute;right:16px;top:16px;background:rgba(255,255,255,.16);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-soft);padding:16px}
.card h2{margin:0 0 4px;font-size:17px;font-weight:800}.card h3{margin:0 0 10px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.card p{margin:0;color:var(--muted);font-size:14px}
.card.next{border:2px solid var(--wilson-green);padding-top:14px}
.eyebrow{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--wilson-green)}
.row{display:flex;gap:8px}.row>*{flex:1}
.stop{display:grid;grid-template-columns:34px 1fr auto;gap:2px 12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px 14px;box-shadow:var(--shadow-soft)}
.stop .n{width:34px;height:34px;border-radius:50%;background:var(--wilson-green-pale);color:var(--wilson-green);display:grid;place-items:center;font-weight:800;grid-row:1/3}
.stop.done .n{background:var(--success);color:#fff}
.stop .who{font-weight:800}.stop .sub{font-size:13px;color:var(--muted);grid-column:2}
.stop .eta{font-size:13px;color:var(--muted);text-align:right}.stop .eta b{display:block;color:var(--ink);font-size:15px}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:800;margin-top:2px}
.pill.SO1{background:var(--info-bg);color:var(--info)}.pill.SO6{background:var(--success-bg);color:var(--success)}.pill.WAR{background:#efe8f8;color:#7a4fb3}.pill.done{background:var(--success-bg);color:var(--success)}.pill.warn{background:var(--warning-bg);color:var(--warning)}.pill.bad{background:var(--danger-bg);color:var(--danger)}
/* job */
.back{border:0;background:none;color:var(--wilson-green);font-weight:700;padding:0;text-align:left}
.hero{display:flex;flex-direction:column;gap:6px}
.hero .addr{color:var(--muted);font-size:14px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.acts .button{min-height:44px;font-size:14px}
.timer{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex-shrink:0;background:var(--wilson-green-pale);color:var(--wilson-green);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.timer i{width:8px;height:8px;border-radius:50%;background:var(--wilson-lime);display:inline-block}
.problem{background:var(--warning-bg);border-radius:var(--radius-md);padding:10px 12px;font-size:14px;color:var(--ink)}
.problem b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--warning);margin-bottom:2px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.thumbs img,.thumbs .ph{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--wilson-green-soft);display:grid;place-items:center;font-size:11px;color:var(--muted);text-align:center}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600}
/* answers */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--card);text-align:left;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600}
.opt .res{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.opt[aria-pressed="true"]{background:var(--sel-bg);border-color:var(--sel);color:var(--sel);box-shadow:inset 0 0 0 1px var(--sel)}
.opt[aria-pressed="true"] .res{color:var(--sel)}
.opt.att[aria-pressed="true"]{background:var(--warning-bg);border-color:var(--warning);color:var(--warning);box-shadow:inset 0 0 0 1px var(--warning)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;border-radius:999px;border:1px solid var(--sel-line);background:var(--card);color:var(--sel);padding:0 14px;font-weight:700;font-size:14px}
.chip[aria-pressed="true"]{background:var(--sel);color:#fff;border-color:var(--sel)}
.chip.na{border-color:var(--line);color:var(--muted)}
.photo{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;border-radius:12px;border:1px dashed var(--line-strong);padding:8px 14px;font-weight:700;cursor:pointer;background:var(--card)}
.photo.need{border-color:var(--warning);background:var(--warning-bg);color:var(--warning)}
.photo.filled{border-style:solid;border-color:var(--success);background:var(--success-bg);color:var(--success)}
.photo input{display:none}.photo img{width:44px;height:44px;border-radius:8px;object-fit:cover}
.parts{display:flex;flex-direction:column;gap:8px}
.part{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.part .pn{font-size:12px;color:var(--muted)}.part .q{display:flex;align-items:center;gap:6px}.part .q button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-weight:800}
.part .q b{min-width:18px;text-align:center}
.part.manual{grid-template-columns:1fr auto;row-gap:8px}.part .pnrow{display:flex;gap:8px;grid-column:1/-1;min-width:0}.part .pnrow input{flex:1;min-width:0;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:16px;text-transform:uppercase;background:var(--card);color:var(--ink)}.part .pnrow input.price{flex:0 0 96px;text-transform:none}.part .pnrow input::placeholder{text-transform:none;font-family:inherit;font-weight:500;font-size:13px}
/* 9/18: part # optional, description required — the tint moves from the number to the description */
.part input.desc{width:100%;min-width:0;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;font-weight:600;font-size:15px;background:var(--card);color:var(--ink)}.part input.desc:placeholder-shown{border-color:var(--warning);background:var(--warning-bg)}.part input.desc::placeholder{font-weight:500;font-size:13px}
.part.zone{border-style:dashed;background:var(--bg)}.part.zone .pn{color:var(--muted)}.grp{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:4px 0 -2px}
.part.st{grid-template-columns:1fr auto}.part .status{display:flex;gap:6px}.part .status button{min-height:36px;border-radius:999px;border:1px solid var(--line);background:var(--card);padding:0 10px;font-size:12px;font-weight:700}
.part .status button[aria-pressed="true"]{background:var(--sel);color:#fff;border-color:var(--sel)}
.search{display:flex;gap:8px}.search input{flex:1;min-height:44px;border:1px solid var(--line);border-radius:11px;padding:0 12px;font:inherit;background:var(--card);color:var(--ink)}
.sugg{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.sugg button{min-height:40px;border-radius:999px;border:1px solid var(--line);background:var(--wilson-green-pale);color:var(--wilson-green);padding:0 12px;font-size:13px;font-weight:700}
textarea{width:100%;min-height:88px;border:1px solid var(--line);border-radius:11px;padding:10px 12px;font:inherit;background:var(--card);color:var(--ink);resize:vertical}
.ready{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);padding:10px 12px;background:var(--wilson-green-pale);border-radius:var(--radius-md)}
.ready.ok{color:var(--success);background:var(--success-bg)}
.save{font-size:12px;color:var(--muted);text-align:right}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px rgba(0,0,0,.06);z-index:5}
.bar .in{max-width:480px;margin:0 auto;display:flex;gap:8px}
.bar .in .button{flex:2}.bar .in .button.ghost{flex:1}
.bar small{display:block;text-align:center;color:var(--muted);font-size:12px;margin-top:6px;max-width:480px;margin-inline:auto}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:9;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw;text-align:center}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.opt,.chip{transition:background .1s,color .1s}}
/* 9/11 feedback: money strip, blocks, error code, custom note, quick-pick labor */
.money{margin-top:12px;background:rgba(255,255,255,.12);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;text-align:left;cursor:pointer;border:0;color:#fff;width:100%;font:inherit}
.money span{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;opacity:.8;display:block}.money b{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;display:block;line-height:1.15}.money small{font-size:11px;opacity:.85;font-weight:600}
.money .bar2{grid-column:1/-1;height:6px;border-radius:999px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:2px}.money .bar2 i{display:block;height:100%;background:#fff}
.moneylist{display:flex;flex-direction:column;gap:6px}.moneylist div{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line)}.moneylist div:last-child{border:0}.moneylist .d{color:var(--muted);font-size:12px;grid-column:1}.moneylist b{font-variant-numeric:tabular-nums}.moneylist .pend{color:var(--muted)}
.notif{background:var(--warning-bg);border:1px solid var(--warning);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.notif h3{margin:0 0 2px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--warning)}
.notif .item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:8px 0;border-top:1px dashed var(--warning)}
.notif .item:first-of-type{border-top:0}
.notif .who{font-weight:800}.notif .ask{grid-column:1/-1;font-size:14px}.notif .meta{grid-column:1/-1;font-size:12px;color:var(--muted)}
.notif button{min-height:40px;border-radius:10px;border:1px solid var(--warning);background:var(--card);color:var(--ink);font-weight:700;padding:0 14px}
.blockrow{display:grid;grid-template-columns:34px 1fr auto;gap:2px 12px;align-items:center;border:1px dashed var(--line-strong);border-radius:15px;padding:10px 14px;color:var(--muted);background:var(--bg)}
.blockrow .n{width:34px;height:34px;border-radius:50%;background:var(--card);display:grid;place-items:center;grid-row:1/3;border:1px solid var(--line)}.blockrow .who{font-weight:700;color:var(--ink);font-size:15px}.blockrow .sub{font-size:13px;grid-column:2}.blockrow .eta{font-size:13px;text-align:right}.blockrow .eta b{display:block;color:var(--ink);font-size:15px}
.codebox{display:flex;gap:8px;align-items:center;margin-top:10px;padding:10px 12px;border:1px solid var(--warning);background:var(--warning-bg);border-radius:12px}
.codebox input{flex:1;min-width:0;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:18px;text-transform:uppercase;background:var(--card);color:var(--ink)}
.codebox label{font-size:12px;font-weight:800;color:var(--warning);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.chip.quick{border-color:var(--wilson-green);color:var(--wilson-green);background:var(--wilson-green-pale)}.chip.quick[aria-pressed="true"]{background:var(--wilson-green);color:#fff}
.custombtn{min-height:44px;border-radius:999px;border:1px dashed var(--line-strong);background:var(--card);color:var(--muted);padding:0 14px;font-weight:700;font-size:14px}
.pastbox{margin-top:12px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface2)}
.pastbox.hot{border-color:var(--warning,#b8770f)}
.pasthead{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 13px;border:0;background:none;font:inherit;font-size:15px;text-align:left;color:var(--ink);cursor:pointer}
.pastmeta{color:var(--muted);font-size:13px;white-space:nowrap}
.pastbody{padding:0 13px 12px;font-size:14px}
.pastdns{background:#fbe4e2;color:#b3362f;border-radius:8px;padding:9px 11px;margin-bottom:9px;line-height:1.45}
.pastunit{background:#fbf0d9;border-radius:8px;padding:9px 11px;margin-bottom:9px;line-height:1.45}
.pastrow{display:grid;grid-template-columns:92px 1fr auto;gap:8px;padding:7px 0;border-top:1px solid var(--line)}.pastrow.today{background:var(--success-bg,#e7f3ea);border-radius:8px;padding:7px 8px;border-top:0}
.pastother,.pastfoot{color:var(--muted);font-size:13px;margin-top:9px;line-height:1.45}
.linkbtn{border:0;background:none;padding:0;font:inherit;color:var(--accent,#0b6e4f);font-weight:600;cursor:pointer;text-decoration:underline dotted}
.pastrow{width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;font:inherit;color:inherit;cursor:pointer}.pastrow:active{background:var(--surface)}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface,#fff);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px 22px;font-size:15px;line-height:1.45}
.sheet h3{margin:0;font-size:17px}.sheet .muted,.muted{color:var(--muted)}.sheet textarea{width:100%;min-height:64px;font:inherit;font-size:15px;padding:10px;border:1px solid var(--line);border-radius:10px;margin-top:8px}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}.tiers button{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px 6px;font:inherit;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px;align-items:center}
.tiers button b{font-size:20px;color:var(--ink)}.tiers button[aria-pressed="true"]{border-color:var(--accent,#0b6e4f);background:var(--surface)}
.partsbar{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.partsbar span{background:var(--surface2);border-radius:8px;padding:5px 9px;font-size:13px}
.icall{border-top:1px solid var(--line);padding:8px 0;font-size:13.5px}.icall div{margin-top:2px}
/* ---------- 9/19: one quote flow, typeahead, outcome dropdown, read-only look-ahead ---------- */
.sel{position:relative}
select.outcome{width:100%;min-height:56px;border:1px solid var(--line-strong);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;font-weight:700;font-size:16px;padding:0 42px 0 14px;-webkit-appearance:none;appearance:none}
.sel::after{content:"▾";position:absolute;right:16px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted);font-size:16px}
select.outcome:focus{outline:2px solid var(--wilson-green);outline-offset:1px}
.outres{margin-top:8px;font-size:13px;color:var(--muted)}.outres b{color:var(--ink)}
.tawrap{position:relative}
.ta{position:absolute;left:0;right:0;top:100%;z-index:40;background:var(--card);border:1px solid var(--line-strong);border-radius:12px;box-shadow:0 10px 26px rgba(0,0,0,.16);overflow:hidden;margin-top:4px;max-height:280px;overflow-y:auto}
.ta button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:var(--card);padding:11px 14px;font:inherit;font-weight:700;font-size:15px;color:var(--ink);min-height:48px}
.ta button:last-child{border-bottom:0}.ta button:hover,.ta button.on{background:var(--wilson-green-pale)}
.ta button small{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:1px}
.ta .mk{background:var(--wilson-green-pale);color:var(--wilson-green);border-radius:3px}
textarea.box,input.box{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:16px;background:var(--card);color:var(--ink);resize:vertical}
textarea.box{min-height:76px}
input.box::placeholder,textarea.box::placeholder{font-size:13.5px;color:var(--muted)}
.timerow{display:flex;gap:6px;flex-wrap:wrap;grid-column:1/-1;margin-top:6px}
.timerow button{min-height:40px;border-radius:999px;border:1px solid var(--line);background:var(--card);padding:0 12px;font-size:13px;font-weight:700;color:var(--ink)}
.timerow button[aria-pressed="true"]{background:var(--sel);color:#fff;border-color:var(--sel)}
.part.needtime{border-color:var(--warning);background:var(--warning-bg)}
.part .amt{font-family:"IBM Plex Mono",monospace;font-weight:800;min-width:74px;text-align:right}
.adj{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.adj input{width:130px;min-height:48px;border:1px solid var(--line-strong);border-radius:10px;padding:0 12px;font:inherit;font-family:"IBM Plex Mono",monospace;font-weight:800;font-size:17px;background:var(--card);color:var(--ink)}
.adj .was{font-size:12.5px;color:var(--muted)}
.addbtn{width:100%;min-height:48px;border:1px dashed var(--line-strong);border-radius:12px;background:var(--card);color:var(--wilson-green);font:inherit;font-weight:800;font-size:15px;margin-top:10px}
.ahead .d{margin-top:16px}
.ahead .dh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:0 2px 6px;border-bottom:1px solid var(--line)}
.ahead .dh b{font-size:16px}.ahead .dh span{font-size:12.5px;color:var(--muted)}
.ahead .row{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;padding:11px 2px;border-bottom:1px solid var(--line);align-items:start}
.ahead .row .n{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.ahead .row .who{font-weight:700}.ahead .row .w{font-size:12.5px;color:var(--muted);white-space:nowrap}
.ahead .row .sub{grid-column:2/4;font-size:13px;color:var(--muted)}
.ro{display:flex;gap:8px;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted);margin-bottom:4px}
.ro b{color:var(--ink)}
.lookbtn{width:100%;min-height:52px;border:1px solid var(--line-strong);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:center;padding:0 14px;margin-top:10px}
.lookbtn small{font-weight:500;font-size:12.5px;color:var(--muted)}

/* ---------- typeahead ⟨9/19 Cayden⟩ ----------
   "can we have the text box pull related one click options as they type? … if on the GTW465 the issue is wont
   drain, failed component, bad pressure sensor, when the tech hits other component, can we have it auto populate
   results as they start typing pressure sensor?"  So every free-text box on this screen is also a picker, and the
   first thing it offers is what THIS model family has actually needed before — from the ODBC parts history, not a
   guess. Typing still wins; the list is there so a tap usually beats finishing the word. */
const TA_JUNK=/prescreen|first call|core charge|misc|labor|trip charge|^n\/?a$|^see notes/i;

function modelParts(s){const i=INSIGHT[s.sv];if(!i)return [];const seen=new Map();
  for(const src of [i.exact&&i.exact.parts,i.family&&i.family.parts])(src||[]).forEach(x=>{
    const d=String(x.d||'').trim();if(d.length<3||TA_JUNK.test(d))return;
    const k=d.toUpperCase();const n=x.n||0;if(!seen.has(k)||seen.get(k).n<n)seen.set(k,{label:titleish(d),n,note:`${n}× on the ${i.family.stem} family`})});
  return [...seen.values()].sort((a,b)=>b.n-a.n)}
function partPool(s){const cat=CATALOG[s.cat]||[];
  return [...modelParts(s),...cat.map(p=>({label:p[1],note:'common component'}))]}   /* names only — never a number */
function taskPool(s){return (TASKS[s.cat]||[]).map(t=>({label:t[0],hrs:t[1]}))}
function foundPool(s){const i=INSIGHT[s.sv];const out=(SYMPTOMS[s.cat]||[]).map(x=>({label:x}));
  modelParts(s).slice(0,8).forEach(p=>out.push({label:`${p.label} failed`,note:p.note}));
  if(i&&i.family&&i.family.calls)i.family.calls.slice(0,4).forEach(c=>{const t=String(c.p||'').trim();
    if(t.length>14&&!TA_JUNK.test(t))out.push({label:t.length>90?t.slice(0,88)+'…':t,note:`${c.sp||'a tech'} · ${String(c.d||'').slice(0,4)} · same family`})});

function typeahead(input,poolFn,onPick,minLen){
  if(!input||input.dataset.ta)return;input.dataset.ta='1';
  const wrap=input.closest('.tawrap')||input.parentElement;
  const box=document.createElement('div');box.className='ta';box.hidden=true;wrap.append(box);
  let hits=[],ix=-1;
  const close=()=>{box.hidden=true;ix=-1};
  const draw=()=>{const q=input.value.trim().toLowerCase();
    if(q.length<(minLen||2)){close();return}
    hits=poolFn().filter(o=>o.label.toLowerCase().includes(q)).slice(0,6);
    if(!hits.length){close();return}
    box.innerHTML=hits.map((h,i)=>`<button type="button" data-i="${i}" class="${i===ix?'on':''}">${taMark(h.label,q)}${h.note?`<small>${esc(h.note)}</small>`:''}</button>`).join('');
    box.hidden=false;
    box.querySelectorAll('button').forEach(b=>b.onmousedown=e=>{e.preventDefault();onPick(hits[+b.dataset.i]);close()})};
  input.addEventListener('input',draw);
  input.addEventListener('focus',draw);
  input.addEventListener('blur',()=>setTimeout(close,140));
  input.addEventListener('keydown',e=>{if(box.hidden)return;
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();ix=Math.max(0,Math.min(hits.length-1,ix+(e.key==='ArrowDown'?1:-1)));draw()}
    else if(e.key==='Enter'&&ix>=0){e.preventDefault();onPick(hits[ix]);close()}
    else if(e.key==='Escape')close()});
}

    c:s.problem,p:performedText(s),lab:f.tasks.map(t=>t[0]+(t[1]!=null?` · ${t[1]} h`:'')),
    parts:f.parts.map(p=>({d:p[1]||'component',n:p[0]||'no number yet',i:0})).concat((s.parts||[]).filter(p=>f.partStatus[p[0]]==='Installed').map(p=>({d:p[1],n:p[0],i:1}))),
    today:1,at:new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}),mins:mins||0,photos:(f.serialPhoto?1:0)+f.photos.filter(Boolean).length};
  let P=PAST[s.sv];if(!P)P=PAST[s.sv]={cid:null,how:'',maybe:[],h:[]};if(!P.name)P.name=s.cust;
  P.h=[rec].concat((P.h||[]).filter(x=>!x.today));
  return rec}
function unrecordVisit(s){const P=PAST[s.sv];if(P&&P.h)P.h=P.h.filter(x=>!x.today)}
function submit(){const s=cur,f=s.f;
  const map=s.st==='SO1'?{parts:isWty(s)?'SO3 · parts verify · warranty':'SO2 · quote to parts verify',onsite:'SO8 · diag fee billed',shop:'SI1 · in the shop · delivery owed',research:'SO1 · research',replace:'SO7 · sales lead',declined:'SO7 · diag fee charged',access:'Reschedule'}:{complete:'SO8 · card charged',moreparts:'SO2 · new quote',partissue:'SO3 · reorder',notfixed:'SO1 · research',access:'Reschedule'};
  /* the ZN line(s), the tech's labor and every part number ride along with the findings — §5.3 */
  f.zoneFee=(wantsBuild(s)&&!isWty(s))?zoneFeeLines(s):null;
  f.result=map[f.outcome];s.done=true;s.phase='done';const mins=f.arrived?Math.max(1,Math.round((Date.now()-f.arrived)/60000)):0;
  recordVisit(s,mins);   /* the findings are history the moment they leave the phone */
  const m=stopDollars(s);toast(`${s.cust.split(' ').pop()} → ${f.result}. On-site ${mins} min.${m&&!m.pending&&(m.lab+m.pp)?` +${usd(m.lab+m.pp)} to your day.`:m&&m.pending?` ${m.pending}.`:''}`);view='route';render();window.scrollTo(0,0)}
render();
</script>
