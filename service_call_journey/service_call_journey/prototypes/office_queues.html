function archSearch(q){
  q=(q||'').trim(); if(q.length<2)return null;
  const toks=norm(q).split(' ').filter(Boolean), d=q.replace(/\D/g,'');
  /* a short token matches the START of a word ("ort" is Ort and Ortiz, not Short or Fort); five letters or
     more may match anywhere. Whole-word name hits rank above street hits, then by visits. */
  const rows=[], digitsOnly=/^\d+$/.test(q.replace(/[\s()\-.]/g,''));

    if(toks.every(t=>hit(nw,t)))rank=toks.every(t=>nw.includes(t))?0:1;
    else if(toks.every(t=>hit(nw.concat(sw),t)))rank=toks.every(t=>sw.includes(t))?2:3;
    else if(digitsOnly && d.length>=4 && r.ph4===d.slice(-4))rank=1;

    <div class="unitc" style="margin:.3rem 0 .8rem">${x.p?esc(x.p):'<span style="color:var(--muted)">No work-performed text on this ticket.</span>'}${(x.lab||[]).length?`<div style="margin-top:.4rem;color:var(--muted);font-size:.78rem">Labor: ${x.lab.map(esc).join(' · ')}</div>`:''}</div>
    <h3 class="laneh">Parts <span>${parts.length?parts.filter(p=>p.i).length+' installed':'none on the ticket'}</span></h3>

    <div style="display:flex;gap:.5rem;margin-top:1rem"><button class="sm" data-actx>Activity / change log</button></div>
    <p style="color:var(--muted);font-size:.75rem;margin-top:.8rem">Complaint, work performed, parts and labor come from the ePASS ODBC export (service history, parts and labor tables). Apostrophes ePASS stored as “?” are repaired for display only.</p></div>`;
  document.body.append(ov);const close=()=>ov.remove();

/* ---------- office notes + internal reminders ⟨9/17⟩ ----------

   reminder is a note with a date that lands on someone's list that morning. Internal only — Cayden 9/17 —
   nothing here ever contacts the customer. */
const NOTES={}, REMIND=[];

function notesPanel(id,name){

    <p>Anything the office needs to remember about this account. Never shown to the customer or printed on an invoice.</p></div>
  <div class="unitc" id="notesbox">${rows.length?rows.map(n=>`<div style="display:flex;gap:.6rem;padding:.25rem 0;border-bottom:1px dotted var(--line)"><span class="mono" style="color:var(--muted);white-space:nowrap">${n.d}</span><span style="flex:1">${esc(n.n)}${n.due?` <span class="chip ${n.done?'ok':'warn'}">remind ${n.due}${n.done?' · done':''}</span>`:''}</span><span class="mono" style="color:var(--muted)">${n.u}</span></div>`).join(''):'<span style="color:var(--muted)">No notes yet.</span>'}
    <div class="addnote"><input id="ntxt" placeholder="Note — e.g. gate code changed, call before 9, husband handles billing" autocomplete="off"><input id="ndue" type="date" title="optional: remind the office on this date" style="flex:0 0 150px"><button id="nadd">Add</button></div>

}
function wireNotes(root,id,name){
  const add=()=>{const v=root.querySelector('#ntxt').value.trim();if(!v)return;const due=root.querySelector('#ndue').value;
    const n={d:'9/17/2026',iso:'2026-09-17',n:v,u:'DAH',due:due||'',done:false,id,name};notesFor(id).unshift(n);if(due)REMIND.push(n);
    toast(due?`Reminder set for ${due}`:'Note added','ok');render()};
  root.querySelector('#nadd').onclick=add;root.querySelector('#ntxt').onkeydown=e=>{if(e.key==='Enter')add()};
}
function renderRemind(){
  const v=$('#v-remind');const rows=REMIND.slice().sort((a,b)=>(a.due||'').localeCompare(b.due||''));
  v.innerHTML=`<div class="intro"><h2>Reminders</h2><p>Every dated office note, oldest first. This is the list someone opens with their coffee: “check back in with Miss Jones about the ice maker”. Ticking one off logs who and when; nothing leaves the building.</p></div>
  ${rows.length?`<div class="tw"><table><thead><tr><th>Due</th><th>Account</th><th>Note</th><th>Set by</th><th></th></tr></thead><tbody>
    ${rows.map((n,i)=>`<tr style="${n.done?'opacity:.55':''}"><td class="mono">${n.due}${n.due<='2026-09-17'&&!n.done?' <span class="chip warn">due</span>':''}</td><td><button class="mini" data-acc="${n.id}">${esc(n.name)}</button></td><td>${esc(n.n)}</td><td class="mono">${n.u}</td><td>${n.done?'<span class="chip ok">done</span>':`<button class="mini" data-done="${i}">Done</button>`}</td></tr>`).join('')}

  let h='';
  if(r.groups.length)h+=`<h5>Addresses <span style="font-weight:400">· ${r.total.toLocaleString()} account${r.total===1?'':'s'} in ${r.groups.length}${r.total>r.groups.length?' address':' address'}${r.groups.length===1?'':'es'}${r.total>600?' (showing the first 600)':''}</span></h5>`;
  h+=r.groups.map(g=>{const many=g.accounts.length>1;
    return `<div class="agroup">${g.street?`<button data-addr="${esc(g.key)}" class="ahead"><b>${esc(g.street)}, ${g.zip}</b><span class="sub">${g.accounts.length} account${many?'s':''} · ${g.visits} call${g.visits===1?'':'s'} at this address${g.dns?' · <span class="chip bad">DNS on file</span>':''} · open the house ▸</span></button>`:''}
      ${g.accounts.slice(0,8).map(a=>`<button data-a="${a.id}" class="${g.street?'aacct':''}"><b>${esc(a.name)}</b>${a.dns?' <span class="chip bad">do not service</span>':''}${a.full?'':' <span class="chip" title="full record is on the server in the real build; this prototype carries the summary">summary</span>'}<span class="sub">${g.street?'':esc(a.street||'no street on file')+(a.street?', '+a.zip:'')+' · '}${a.visits} call${a.visits===1?'':'s'}${a.last?' · last '+a.last:''}</span></button>`).join('')}
      ${g.accounts.length>8?`<div class="sub" style="padding:.2rem .7rem .5rem;color:var(--muted)">+${g.accounts.length-8} more accounts — open the address</div>`:''}</div>`}).join('');
  if(r.units.length)h+=`<h5>Appliances</h5>`+r.units.map(({h:hh,a})=>`<button data-a="${hh.id}" data-asset="${a.aid}"><b>${esc(a.brand)} ${esc(a.model)} <span class="mono">${esc(a.serial)}</span></b><span class="sub">${esc(hh.name)} · ${esc(hh.addr)} · ${a.n} call${a.n===1?'':'s'}</span></button>`).join('');
  if(r.svs.length)h+=`<h5>Tickets</h5>`+r.svs.map(({h:hh,x})=>`<button data-a="${hh.id}" data-sv="${x.sv}"><b class="mono">${x.sv}</b> <span class="chip st ${x.st.replace('.','')}">${x.st}</span><span class="sub">${esc(hh.name)} · ${x.d} · ${esc(x.c||'').slice(0,80)}</span></button>`).join('');
  return h;
}
function wireArchResults(root){

function assetCards(assets,opts={}){

function renderArch(){

      <p>Every ePASS service ticket from ${S.span[0].slice(0,4)} to today, re-keyed so the office can answer “have you been out here before?” without leaving the dashboard. Search a <b>name, street, ZIP, phone</b> (last four), SV, model or serial. Results group by address — appliances don't move, and one kitchen can be five ePASS accounts.</p></div>

      <div class="idbar">
        ${[['epass_code','ePASS customer code','var(--inst)'],['address_zip','matched by address','var(--accent)'],

          .map(([k,label,col])=>`<div class="idrow"><span>${label}</span><i style="width:${(S.identity[k]/tot*100).toFixed(1)}%;background:${col}"></i><b>${S.identity[k].toLocaleString()}</b><small>${(S.identity[k]/tot*100).toFixed(1)}%</small></div>`).join('')}
      </div>
      <p style="color:var(--muted);font-size:.78rem;margin-top:.8rem">This prototype searches all ${IDX.length.toLocaleString()} customers and carries the full record — every call with what was done, every appliance with model and serial — for ${REAL_HH.length} households: everyone behind today's ${REAL_OFFICE_J.length>0?'open':''} tickets, the deepest histories, the repeat units, the duplicate addresses and the do-not-service flags. Everyone else shows the summary row and says so. Phone and email are masked.</p>`;
    const aq=$('#aq'), ar=$('#ares');

      <div class="kpis"><span>calls<b>${r.visits}</b></span><span>last call<b>${r.last||'—'}</b></span></div></div>

  const yrs=c.first&&c.last?`${yr(c.first)}–${yr(c.last)}`:'';
  const wty=c.hist.filter(x=>x.pk==='manufacturer').length;
  const k=c.hk?norm(c.hk.split('|')[0])+'|'+c.hk.split('|')[1]:'';

  <div class="grid">${jobs.map(j=>{const got=j.parts.filter(p=>p.received).length,n=j.parts.length;const due=new Date(j.eta)<=NOW;
    return `<div class="card ${j.st==='SO4PRE'?'field':''}"><div class="hd"><div><b>${esc(j.cust)}</b> ${editBtn(j.sv)}<div class="sub">${esc(j.unit)} · ${TECH[j.tech]} · <span class="mono">${j.sv}</span></div></div><div class="age ${j.st==='SO4B'?'old':''}"><b>${j.eta.slice(5).replace('-','/')}</b>${due?'expected today':'expected'}</div></div>
    <div class="chips"><span class="chip st ${j.st}">${j.st}</span><span class="chip">${j.po}</span>${n?`<span class="chip ${got===n?'ok':got?'warn':''}">${got} of ${n} received</span>`:'<span class="chip">part line comes from the field quote — not in this export</span>'}${j.st==='SO4PRE'?`<span class="chip SO4PRE">Install held ${j.held} — confirms on check-in</span>`:''}${j.st==='SO4B'?'<span class="chip bad">Backorder — customer notified</span>':''}${j.pencil&&j.st!=='SO4PRE'?`<span class="chip SO4" title="${esc(j.pencil.why)}">✎ penciled ${fmtD(j.pencil.day)} · ${TECH[j.pencil.tech]} — first date the customer will see</span>`:''}</div>
    <div class="tw"><table><tbody>${j.parts.map((p,i)=>`<tr><td>${esc(p.name)}<div class="pn">${p.pn} · ${p.supplier}</div></td><td class="r">${p.received?`<span class="chip ok">✓ in</span> <span class="bin">${p.bin}</span>`:`<button class="sm" data-rcv="${j.sv}:${i}">Check in</button>`}</td></tr>`).join('')}</tbody></table></div></div>`}).join('')||'<div class="empty">Nothing on order.</div>'}</div>`;
  document.querySelectorAll('[data-rcv]').forEach(b=>b.onclick=()=>{const [sv,i]=b.dataset.rcv.split(':');receive(J.find(x=>x.sv===sv),+i)});
  $('#scanbtn').onclick=doScan;$('#scan').onkeydown=e=>{if(e.key==='Enter')doScan()};
  document.querySelectorAll('[data-hold]').forEach(b=>b.onclick=()=>{const [sv,act]=b.dataset.hold.split(':');const j=J.find(x=>x.sv===sv);
    if(act==='here'){j.parts.forEach((p,i)=>{if(!p.received)receive(j,i)});return}
    if(act==='wait'){j.holdWait=true;toast(`${j.cust}: waiting — Kezia rechecks at 2 pm; the hold releases itself if the part still isn't in`,'warn');render();return}
    const held=j.held;j.st='SO4';j.eta='2026-09-18';delete j.held;
    SYNC.unshift({id:SYNC.length+1,sv:j.sv,cust:j.cust,fields:{status:'SO4',date:'',tech:j.tech},created:NOW.toISOString(),state:'pending',note:`Hold ${held} released — part not in (ePASS "time out"). New ETA 9/18. Customer texted apology + re-pick link.`});
    toast(`${j.cust}: hold ${held} released → SO4. Text sent: "We're sorry — the part for your washer hasn't arrived in time for Tuesday, so we've released that appointment… now expected Fri 9/18. Pick a new install time: {link}" · Demitrius's Tue route loses the stop · packet queued for ePASS`,'warn');render()});
}
function doScan(){const q=$('#scan').value.trim().toUpperCase();if(!q)return;let hit=false;J.forEach(j=>{if(!['SO4','SO4PRE','SO4B','SO4H'].includes(j.st))return;j.parts.forEach((p,i)=>{if(!p.received&&(p.pn.toUpperCase()===q||(j.po||'').toUpperCase()===q)){receive(j,i);hit=true}})});if(!hit)toast('No open PO line matches that — check the label','warn');$('#scan').value=''}
function receive(j,i){const p=j.parts[i];p.received=true;p.bin=j.parts.find(x=>x.bin)?.bin||BINS[binI++%BINS.length];
  if(j.parts.every(x=>x.received)){if(j.st==='SO4PRE'){j.st='SO6';toast(`${j.cust}: all parts in · held ${j.held} confirmed → SO6 · customer texted "your part arrived, ${j.held} is confirmed" · bin ${p.bin}`);SYNC.push({id:SYNC.length+1,sv:j.sv,cust:j.cust,fields:{status:'SO6',date:'9/15/2026',tech:j.tech},created:NOW.toISOString(),state:'pending',summary:`Parts in bin ${p.bin}`})}
    else{j.st='SO5';toast(`${j.cust}: all parts in → SO5 · customer texted "pick your install time" (${TECH[j.tech]}'s openings) · bin ${p.bin}`);SYNC.push({id:SYNC.length+1,sv:j.sv,cust:j.cust,fields:{status:'SO5',date:'',tech:j.tech},created:NOW.toISOString(),state:'pending',summary:`Parts in bin ${p.bin}`})}}
  else toast(`${j.cust}: ${p.name} checked in to ${p.bin} · ${j.parts.filter(x=>x.received).length} of ${j.parts.length}`);render()}
/* ---------- SYNC ⟨9/18: what we key vs. what we only read back⟩ ----------
   KEY into ePASS: new tickets for self-booked / test-bench requests, approved lines + SO3, date/tech changes.
   READ BACK only: SO4 (ordered), SO5 (received) and everything else Kezia does in ePASS — the DispatchTrack
   export every 15 min. In Agility a `newticket` row is a pushed_notifications row (createPushedNotification)
   to the office-admin audience — the same mechanism as needs-tech-input. */
function packet(s){const f=s.fields||{};
  if(s.kind==='fields'){return `${s.sv}  ${s.cust}\nFIELD CORRECTION — keyed by the office, confirmed by the next import\n`+Object.keys(f).map(k=>`  ${k.toUpperCase().padEnd(10)} was [${(s.was||{})[k]||'—'}]  →  [${f[k]||'—'}]`).join('\n')+`\nWHY:  ${s.why||''}\nBY:   ${s.by||''}`}
  if(s.kind==='newticket'){const d=s.req;return `NEW TICKET  ${s.cust}${s.test?'   ⚑ TEST — bench call, not a customer':''}\nNAME:    ${d.name}\nADDRESS: ${d.addr}\nPHONE:   ${d.phone}\nUNIT:    ${d.unit}\nPROBLEM: ${d.problem}\nDATE: ${d.date}   WINDOW: ${d.window}   TECH: ${d.tech}\nSOURCE:  ${d.source}`}
  let t=`${s.sv}  ${s.cust}\nSTATUS: ${f.status}${f.date?`   DATE: ${f.date}`:''}${f.window?`   WINDOW: ${f.window}`:''}   TECH: ${f.tech}`;if(s.lines){t+='\nLINES:';s.lines.forEach(l=>t+=`\n  ${String(l[0]).padEnd(12)} ${l[1]}  x${l[2]}  ${money(l[3])}`)}if(s.summary)t+=`\nNOTE: ${s.summary}`;if(s.note&&!s.summary)t+=`\nNOTE: ${s.note}`;return t}
const WATCH_SUB={so4:'waiting for ePASS to show SO4 — Kezia orders there',so5:'SO4 seen · waiting for ePASS to show SO5 — Kezia receives there',ready:'SO5 seen · customer text ready',sent:'SO5 text sent · logged'};
function watchCard(s){const j=J.find(x=>x.sv===s.sv);
  return `<div class="banner" style="font-size:.8rem">${esc(s.note||WATCH_SUB[s.sub])}</div>
    ${s.sub==='ready'?`<div class="packet">TEXT → ${esc(s.cust)} (${esc(contactsFor(s.sv,s.cust)[0].phone)})\n${esc(s.text||`Your part is in — pick your install time: {link}`)}</div>
    <div class="acts"><span class="pn">sends automatically only if the SO5 template toggle is on (off by default)</span><span style="flex:1"></span><button class="primary" data-sendtext="${s.id}">Send text</button></div>`:
    s.sub==='sent'?`<div class="acts"><span class="chip ok">sent ${new Date(s.confirmedAt).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})} · logged</span></div>`:
    `<div class="acts"><span class="chip st ${s.sub==='so5'?'SO4':'SO3'}">${s.sub==='so5'?'SO4 in ePASS':'SO3 keyed'}</span>${s.sub==='so5'&&j&&j.pencil?`<span class="chip SO4" title="${esc(j.pencil.why)}">✎ penciled ${fmtD(j.pencil.day)} · ${TECH[j.pencil.tech]||j.pencil.tech}</span>`:''}<span class="pn">read back from the import — nothing to key</span></div>`}`}
function newticketCard(s){return `<div class="packet">${esc(packet(s))}</div>
  ${s.state==='pending'?`<div class="acts"><button class="sm" data-copy="${esc(packet(s))}">Copy details</button><span style="flex:1"></span><label class="pn" style="display:flex;gap:.4rem;align-items:center">Created in ePASS as <input class="mono" data-svin="${s.id}" placeholder="SV00123…" style="width:130px" aria-label="ePASS SV number"></label><button class="primary" data-link="${s.id}">Link</button></div>`:
  `<div class="acts"><span class="chip st SO1">${esc(s.sv)}</span><span class="pn">${esc(s.note||'')}</span></div>`}`}
function renderSync(){
  const order={disc:0,pending:1,watching:2,keyed:3,confirmed:4};const list=[...SYNC].sort((a,b)=>order[a.state]-order[b.state]||new Date(a.created)-new Date(b.created));
  const c=s=>SYNC.filter(x=>x.state===s).length;
  $('#v-sync').innerHTML=`<div class="intro"><h2>ePASS sync queue</h2><p>ePASS stays the source of truth. <b>What we key into it</b> (paste-ready packets here, then tap <i>Keyed</i>): a new ticket for every self-booked web request or test-bench call, the approved estimate lines + SO3, and any date or tech change. <b>What we only read back</b> from the DispatchTrack export every 15 min: SO4 when Kezia orders, SO5 when she receives, and everything else she does in ePASS. The import confirms what was keyed; if ePASS disagrees two imports in a row it becomes a discrepancy. A new-ticket row is, in Agility, a pushed notification to the office-admin audience — the same mechanism as needs-tech-input. Techs never touch ePASS; nobody re-types notes.</p></div>
  <div class="synchead"><span>Last import <b>${new Date(lastImport).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</b> · DispatchTrackDetail_20260917_0915.csv</span><span><b>${c('pending')}</b> to key</span><span><b>${c('keyed')}</b> awaiting confirmation</span><span><b>${c('watching')}</b> watching for SO4/SO5</span><span style="color:var(--bad)"><b>${c('disc')}</b> discrepancies</span><span><b>${c('confirmed')}</b> confirmed today</span><span style="flex:1"></span><button class="sm" id="runimport">Simulate next import</button></div>
  <div class="grid">${list.map(s=>`<div class="card ${s.state==='confirmed'?'done':''}" data-sync="${s.id}" data-kind="${s.kind||'status'}" style="border-left-color:${s.state==='disc'?'var(--bad)':s.state==='confirmed'?'var(--inst)':s.state==='keyed'||s.state==='watching'?'var(--held)':'var(--wait)'}">
    <div class="hd"><div><b>${esc(s.cust)}</b> <span class="mono" style="color:var(--muted);font-size:.8rem">${esc(s.sv)}</span>${s.kind==='newticket'?` <span class="chip ${s.test?'warn':'SO1'}">${s.test?'TEST bench call':'self-booked · web form'}</span>`:s.kind==='lines'?' <span class="chip SO3">approved lines → SO3</span>':s.kind==='watch'?' <span class="chip SO4">watch SO4 / SO5</span>':s.kind==='fields'?' <span class="chip warn">field correction → ePASS</span>':s.kind==='status'&&(s.fields||{}).status==='SO7'?' <span class="chip bad">estimate closed → SO7</span>':''}<div class="sub">created ${ago(s.created)} ago${s.keyedAt?` · keyed ${ago(s.keyedAt)} ago by ${s.keyedBy}`:''}${s.confirmedAt?` · ${s.kind==='watch'?'sent':'confirmed by import'} ${new Date(s.confirmedAt).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}`:''}</div></div><span class="state ${s.state}">${{pending:s.kind==='newticket'?'Create the ticket':'To key',keyed:s.kind==='newticket'?'Linked · awaiting import':'Keyed · awaiting import',confirmed:s.kind==='watch'?'Done':'Confirmed',disc:'Discrepancy',watching:'Watching ePASS'}[s.state]}</span></div>
    ${s.state==='disc'?`<div class="disc"><span class="h"></span><span class="h">Dashboard</span><span class="h">ePASS (import ${new Date(s.detected).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})})</span>${Object.keys(s.fields).filter(k=>s.fields[k]).map(k=>`<span style="color:var(--muted)">${k}</span><span class="mono" style="${s.fields[k]!==s.epass[k]?'font-weight:600':''}">${s.fields[k]}</span><span class="mono" style="${s.fields[k]!==s.epass[k]?'font-weight:600':''}">${s.epass[k]||'—'}</span>`).join('')}</div><div class="banner" style="font-size:.8rem">${esc(s.note||'')}</div>
      <div class="acts"><button class="sm" data-reissue="${s.id}">Re-issue — dashboard is right, key it again</button><button class="sm" data-accept="${s.id}">Accept ePASS value into dashboard</button></div>`:
    s.kind==='watch'?watchCard(s):s.kind==='newticket'?newticketCard(s):
    `<div class="packet">${esc(packet(s))}</div>
     <div class="acts">${Object.entries(s.fields).filter(([k,v])=>v).map(([k,v])=>`<button class="sm" data-copy="${esc(v)}">Copy ${k}</button>`).join('')}${s.lines?`<button class="sm" data-copy="${esc(s.lines.map(l=>l.join('\t')).join('\n'))}">Copy lines</button>`:''}<button class="sm" data-copy="${esc(packet(s))}">Copy packet</button><span style="flex:1"></span>${s.state==='pending'?`<button class="primary" data-keyed="${s.id}">Keyed in ePASS</button>`:''}${s.state==='keyed'?'<span style="font-size:.75rem;color:var(--muted)">auto-closes when the import shows it</span>':''}</div>`}</div>`).join('')}</div>`;
  document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{navigator.clipboard?.writeText(b.dataset.copy).catch(()=>{});toast('Copied')});
  document.querySelectorAll('[data-keyed]').forEach(b=>b.onclick=()=>{const s=SYNC.find(x=>x.id==b.dataset.keyed);s.state='keyed';s.keyedAt=NOW.toISOString();s.keyedBy='You';
    if(s.kind==='lines'){SYNC.push({id:nextId(),kind:'watch',sv:s.sv,cust:s.cust,tech:s.fields.tech,eta:s.eta||etaFor('2-3d'),created:NOW.toISOString(),state:'watching',sub:'so4',note:WATCH_SUB.so4});toast(`${s.cust}: lines keyed, SO3 set — now watching the import for SO4 (Kezia orders in ePASS)`)}
    renderSync();renderTabs()});
  document.querySelectorAll('[data-link]').forEach(b=>b.onclick=()=>{const s=SYNC.find(x=>x.id==b.dataset.link);const inp=document.querySelector(`[data-svin="${s.id}"]`);let sv=(inp.value||'').trim().toUpperCase();if(!/^SV\d{6,8}$/.test(sv)){toast('Type the SV number ePASS gave the new ticket, e.g. SV00123486','warn');inp.focus();return}
    s.req.reqId=s.sv;s.sv=sv;s.state='keyed';s.keyedAt=NOW.toISOString();s.keyedBy='You';s.note=`next import will match ${sv} to this request${s.test?' · flagged TEST, excluded from counts':''}`;toast(`${s.cust}: linked to ${sv} — the next import matches it to the request${s.test?' (TEST)':''}`);renderSync();renderTabs()});
  document.querySelectorAll('[data-svin]').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')document.querySelector(`[data-link="${i.dataset.svin}"]`).click()});
  document.querySelectorAll('[data-sendtext]').forEach(b=>b.onclick=()=>{const s=SYNC.find(x=>x.id==b.dataset.sendtext);s.sub='sent';s.state='confirmed';s.confirmedAt=NOW.toISOString();s.note=`SO5 text sent ${fmtTs(s.confirmedAt)} by Noell · logged on ${s.sv}`;toast('sent · logged','ok');render()});
  document.querySelectorAll('[data-reissue]').forEach(b=>b.onclick=()=>{const s=SYNC.find(x=>x.id==b.dataset.reissue);s.state='pending';delete s.epass;toast(`${s.cust}: sync item re-issued`);render()});
  document.querySelectorAll('[data-accept]').forEach(b=>b.onclick=()=>{const s=SYNC.find(x=>x.id==b.dataset.accept);Object.assign(s.fields,s.epass);s.state='confirmed';s.confirmedAt=NOW.toISOString();const j=J.find(x=>x.sv===s.sv);if(j)j.st=s.epass.status;toast(`${s.cust}: dashboard now matches ePASS (${s.epass.status}) — logged as manual override`,'warn');render()});
  $('#runimport').onclick=()=>{lastImport=new Date(new Date(lastImport).getTime()+15*6e4).toISOString();let n=0;SYNC.forEach(s=>{if(s.state==='keyed'){s.state='confirmed';s.confirmedAt=lastImport;n++}});
    /* one ePASS transition per import: the oldest row still waiting moves one step — SO4 seen, then SO5 seen */
    const w=SYNC.filter(s=>s.kind==='watch'&&s.state==='watching'&&(s.sub==='so4'||s.sub==='so5')).sort((a,b)=>new Date(a.created)-new Date(b.created))[0];let wmsg='';
    if(w){const j=J.find(x=>x.sv===w.sv);const eta=w.eta||etaFor('2-3d');const tech=TECH[w.tech]||w.tech;
      if(w.sub==='so4'){const day=addBD(eta,2);w.sub='so5';w.ordered=lastImport;w.pencil=day;if(j){j.st='SO4';j.eta=eta;j.po='ePASS';j.pencil=pencilFor(j)}
        w.note=`SO4 in ePASS (ordered ${fmtTs(lastImport)}) · install penciled onto ${tech}'s best-fit day ${fmtD(day)} (ETA ${fmtD(eta)} + 2 business days) — a held block on the board, dashboard-only`;wmsg=` · ${w.cust}: SO4 seen — penciled ${fmtD(day)}`}
      else{w.sub='ready';w.received=lastImport;if(j)j.st='SO5';w.text=`Your part is in — pick your install time: {link}`;
        w.note=`SO5 in ePASS — parts received ${fmtTs(lastImport)}. Customer text ready: 'Your part is in — pick your install time: {link}'`;wmsg=` · ${w.cust}: SO5 seen — text ready to send`}}
    const stray=SYNC.find(s=>s.sv==='SV00123489'&&s.state==='confirmed'&&!s.strayed);if(stray){stray.strayed=true;SYNC.push({id:nextId(),sv:'SV00123489',cust:'Reimers, Tara & Shep',fields:{status:'SO1',date:'9/17/2026',tech:'TDP'},epass:{status:'SO1',date:'9/18/2026',tech:'TDP'},created:lastImport,detected:lastImport,state:'disc',note:'Changed in ePASS without a dashboard event — someone moved the date directly in Routing. Accept it, or re-issue so ePASS is put back.'})}
    toast(`Import processed: ${n} keyed item(s) confirmed${wmsg}${stray?' · 1 reverse discrepancy detected (ePASS changed on its own)':''}`);render()};
}
render();
</script>
